# 指標案例驗證用的真的 .NET 應用：程式在 dotnet-app/（建成 ConfigMap dotnet-app-src）。
# initContainer：用 .NET SDK 編譯；下載 OpenTelemetry .NET 自動埋點 v1.12.0（測試用；正式環境放進 image 或由 chart 掛）。
# app：ASP.NET Core 8 runtime ＋ 自動埋點（環境變數開）。metrics 用 OTLP 推給同節點的 Collector（實測：.NET 自動埋點的
#   Prometheus 端點只聽 localhost，Collector 抓不到；也不需要 prometheus.io 的 annotation）。
# db：PostgreSQL（Npgsql 連線池上限 5）。load：8 個迴圈一直打；/ctl/burst 存在時加到 40 個（執行緒池飢餓用）。
apiVersion: apps/v1
kind: Deployment
metadata: {name: dotnet-app, namespace: metrics-cases}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: dotnet-app}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dotnet-app, app.kubernetes.io/version: "1.0.0", app.kubernetes.io/part-of: demo}
    spec:
      initContainers:
        - name: build
          image: mcr.microsoft.com/dotnet/sdk:8.0
          command: ["sh", "-c", "cp -r /src /work && cd /work && dotnet publish -c Release -o /app --nologo -v q"]
          # 測試環境的對外 HTTPS 經過會重簽憑證的 proxy，NuGet 要信任它的 CA（ConfigMap proxy-ca，沒有就用系統的）
          env: [{name: SSL_CERT_FILE, value: /ca/ca-bundle.crt}]
          volumeMounts: [{name: src, mountPath: /src}, {name: app, mountPath: /app}, {name: ca, mountPath: /ca}]
          resources: {limits: {memory: 2Gi}}
        - name: otel
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c", "cd /otel && wget -q -O o.zip https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/releases/download/v1.12.0/opentelemetry-dotnet-instrumentation-linux-glibc-x64.zip && unzip -q o.zip && rm o.zip && ls"]
          volumeMounts: [{name: otel, mountPath: /otel}]
      containers:
        - name: app
          image: mcr.microsoft.com/dotnet/aspnet:8.0
          command: ["dotnet", "/app/order-app.dll"]
          env:
            # OpenTelemetry .NET 自動埋點（不改程式）
            - {name: CORECLR_ENABLE_PROFILING, value: "1"}
            - {name: CORECLR_PROFILER, value: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"}
            - {name: CORECLR_PROFILER_PATH, value: /otel/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so}
            - {name: DOTNET_ADDITIONAL_DEPS, value: /otel/AdditionalDeps}
            - {name: DOTNET_SHARED_STORE, value: /otel/store}
            - {name: DOTNET_STARTUP_HOOKS, value: /otel/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll}
            - {name: OTEL_DOTNET_AUTO_HOME, value: /otel}
            # 服務名稱；metrics、trace 都用 OTLP 送同節點的 Collector，metrics 每 30 秒一次（跟 Collector 抓 Java 的頻率一樣）
            - {name: OTEL_SERVICE_NAME, value: dotnet-app}
            - {name: OTEL_METRICS_EXPORTER, value: otlp}
            - {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://otel-node-collector.otel-collector.svc:4318/v1/metrics"}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "30000"}
            # ASP.NET Core 的 HTTP 指標（http.server.request.duration）預設沒開（實測），要自己加
            - {name: OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES, value: "Microsoft.AspNetCore.Hosting,Microsoft.AspNetCore.Server.Kestrel"}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-node-collector.otel-collector.svc:4318/v1/traces"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            # ASP.NET Core 預設每個請求印 5 行 Information（實測），log 量會暴增；框架的只留 Warning 以上
            - {name: Logging__LogLevel__Microsoft.AspNetCore, value: Warning}
            # log 用 JSON、帶 scope（trace_id 在裡面）：跟 chart 一樣用環境變數設定，程式不用改
            - {name: Logging__Console__FormatterName, value: json}
            - {name: Logging__Console__FormatterOptions__IncludeScopes, value: "true"}
            - {name: Logging__Console__FormatterOptions__UseUtcTimestamp, value: "true"}
            - {name: Logging__Console__FormatterOptions__TimestampFormat, value: "yyyy-MM-ddTHH:mm:ss.fffZ"}
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: app, mountPath: /app}, {name: otel, mountPath: /otel}, {name: ctl, mountPath: /ctl}]
        - name: db
          image: docker.io/library/postgres:16-alpine
          env: [{name: POSTGRES_PASSWORD, value: test-only}]
          resources: {limits: {memory: 256Mi}}
        - name: load
          image: docker.io/curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              sleep 40
              loop() { while true; do curl -s -o /dev/null -m 10 "http://localhost:8080/orders/$(( $(od -An -N2 -tu2 /dev/urandom) % 1000 ))"; sleep 0.5; done; }
              for i in 1 2 3 4 5 6 7 8; do loop & done
              while true; do
                if [ -f /ctl/burst ] && [ ! -f /tmp/bursting ]; then touch /tmp/bursting; for i in $(seq 32); do loop & done; fi
                sleep 5
              done
          volumeMounts: [{name: ctl, mountPath: /ctl}]
      volumes:
        - {name: src, configMap: {name: dotnet-app-src}}
        - {name: app, emptyDir: {}}
        - {name: otel, emptyDir: {}}
        - {name: ctl, emptyDir: {}}
        - {name: ca, configMap: {name: proxy-ca, optional: true}}
