# 大流量測試用的 log 產生器：依 RATE（行/秒）輸出 DURATION 秒，每行帶 run 與序號，
# 事後在 ES 數「每個 run 收到幾筆」就能精確算出遺失。用法見 run-load.sh。
apiVersion: v1
kind: Namespace
metadata:
  name: load-test
  labels: {dept: D1110}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: generator
  namespace: load-test
data:
  gen.py: |
    import json, os, signal, sys, time
    rate = int(os.environ["RATE"]); duration = int(os.environ["DURATION"]); run = os.environ["RUN"]
    # 約 400 bytes 一行，接近一般 Java 服務的 INFO log
    filler = "x" * 250
    tick = 0.01
    per_tick = rate * tick
    start = time.time(); seq = 0; owed = 0.0
    out = sys.stdout
    # Pod 被趕走（drain）時也印出送了幾筆，序號 n 的時間 = start + (n-1)/rate（run-durability.sh 算遺失的時間點）
    stopped = []
    signal.signal(signal.SIGTERM, lambda *_: stopped.append(1))
    while not stopped:
        now = time.time()
        if now - start >= duration:
            break
        owed += per_tick
        n = int(owed); owed -= n
        ts = time.strftime("%Y-%m-%dT%H:%M:%S", time.gmtime(now)) + ".%03dZ" % int((now % 1) * 1000)
        for _ in range(n):
            seq += 1
            out.write(json.dumps({"timestamp": ts, "level": "INFO", "message": "load " + filler,
                                  "logger": "load.Gen", "thread": "main", "run": run, "seq": seq}) + "\n")
        out.flush()
        sleep = start + (int((now - start) / tick) + 1) * tick - time.time()
        if sleep > 0:
            time.sleep(sleep)
    sys.stderr.write(json.dumps({"run": run, "emitted": seq, "seconds": round(time.time() - start, 1), "start": round(start, 3)}) + "\n")
