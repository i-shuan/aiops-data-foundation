# 「不改程式」驗證用的 Java 服務（程式 java/SdkApp.java，ConfigMap sdk-java-src；log 設定直接用 sdk/standards/java/logback-spring.xml）。
# run-sdk-inject-e2e.sh 用 sed 把 __NAME__、__CONSUME__ 換掉，部署成 sdk-java-a（消費 Kafka）、sdk-java-b 兩個服務。
# initContainer 從 GitHub、Maven Central 下載 agent 與 logback、Kafka 的 jar（測試用；正式環境 agent 由 chart 的 image 帶）。
apiVersion: v1
kind: Service
metadata: {name: __NAME__, namespace: sdk-cases}
spec:
  selector: {app.kubernetes.io/name: __NAME__}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: __NAME__, namespace: sdk-cases}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: __NAME__}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: __NAME__, app.kubernetes.io/version: "1.0.0", app.kubernetes.io/part-of: demo}
    spec:
      initContainers:
        - name: download
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cd /lib-ext
              M=https://repo1.maven.org/maven2
              get() { [ -s "$1" ] || wget -q -O "$1" "$2"; }
              get otel.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.20.0/opentelemetry-javaagent.jar
              get slf4j.jar $M/org/slf4j/slf4j-api/2.0.13/slf4j-api-2.0.13.jar
              get logback-classic.jar $M/ch/qos/logback/logback-classic/1.5.6/logback-classic-1.5.6.jar
              get logback-core.jar $M/ch/qos/logback/logback-core/1.5.6/logback-core-1.5.6.jar
              get logstash.jar $M/net/logstash/logback/logstash-logback-encoder/7.4/logstash-logback-encoder-7.4.jar
              get jackson-databind.jar $M/com/fasterxml/jackson/core/jackson-databind/2.17.1/jackson-databind-2.17.1.jar
              get jackson-core.jar $M/com/fasterxml/jackson/core/jackson-core/2.17.1/jackson-core-2.17.1.jar
              get jackson-annotations.jar $M/com/fasterxml/jackson/core/jackson-annotations/2.17.1/jackson-annotations-2.17.1.jar
              get kafka-clients.jar $M/org/apache/kafka/kafka-clients/3.7.1/kafka-clients-3.7.1.jar
              ls -la
          volumeMounts: [{name: lib, mountPath: /lib-ext}]
      containers:
        - name: app
          image: docker.io/library/eclipse-temurin:21-jdk
          command: ["sh", "-c", "exec java -javaagent:/lib-ext/otel.jar -Xmx128m -Dlogback.configurationFile=/app/logback-spring.xml -cp \"$(ls /lib-ext/*.jar | grep -v otel.jar | tr '\\n' ':')\" /app/SdkApp.java"]
          env:
            - {name: OTEL_SERVICE_NAME, value: __NAME__}
            - {name: KAFKA, value: "kafka.sdk-cases.svc:9092"}
            - {name: KAFKA_CONSUME, value: "__CONSUME__"}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-node-collector.otel-collector.svc:4318/v1/traces"}
            - {name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL, value: http/protobuf}
            # 跟 app-common chart 一樣（sdk/standards/tracing.md 第 4 節）
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: "1.0"}
            - {name: OTEL_METRICS_EXPORTER, value: none}
            - {name: OTEL_LOGS_EXPORTER, value: none}
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 100m, memory: 160Mi}, limits: {memory: 512Mi}}
          volumeMounts: [{name: lib, mountPath: /lib-ext}, {name: src, mountPath: /app}]
      volumes:
        - {name: lib, emptyDir: {}}
        - {name: src, configMap: {name: sdk-java-src}}
