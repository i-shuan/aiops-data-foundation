# k3d 用：沿用正式的 Collector 設定（telemetry/collectors），只改連線目標與 trace-sampler 的取樣（跟 e2e/local-k3s/otel-collector 一樣）。
# ES 在主機的 docker（接到 k3d 的網路），位址由 create-cluster 之後的 deploy-collectors.sh 用 sed 填進 ES_ENDPOINT。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../telemetry/collectors
configMapGenerator:
  - name: otel-collector-env
    behavior: replace
    literals:
      - CLUSTER_NAME=local
      - ES_ENDPOINT=http://ES_HOST:9200
      - NTP_SERVER=pool.ntp.org:123
images:
  - name: otel/opentelemetry-collector-contrib
    newName: docker.io/otel/opentelemetry-collector-contrib
patches:
  - target: {kind: StatefulSet, name: trace-sampler}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: 5s
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "100"
