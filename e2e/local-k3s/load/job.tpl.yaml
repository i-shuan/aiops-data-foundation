apiVersion: batch/v1
kind: Job
metadata:
  name: gen-${RUN}
  namespace: load-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-gen
        app.kubernetes.io/version: "1.0.0"
    spec:
      restartPolicy: Never
      containers:
        - name: gen
          image: docker.io/library/python:3.12-alpine
          command: ["python", "-u", "/gen/gen.py"]
          env:
            - {name: RATE, value: "${RATE}"}
            - {name: DURATION, value: "${DURATION}"}
            - {name: RUN, value: "${RUN}"}
          volumeMounts: [{name: gen, mountPath: /gen}]
      volumes: [{name: gen, configMap: {name: generator}}]
