# run-rca-demo.sh 用：namespace aiops-demo 裡一個 Grafana（告警＋儀表板）和一個收通知的假 webhook。
# Grafana 的告警設定直接用 engine/configs/grafana/ 的檔（腳本建成 ConfigMap），儀表板是這個資料夾的 dashboard.json。
# 連線用的 key、通知網址由腳本建成 Secret grafana-env。
apiVersion: v1
kind: Namespace
metadata: {name: aiops-demo}
---
# 假 webhook：每收到一則通知印一行（kubectl -n aiops-demo logs deploy/notify-sink）
apiVersion: apps/v1
kind: Deployment
metadata: {name: notify-sink, namespace: aiops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: notify-sink}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: notify-sink}
    spec:
      containers:
        - name: sink
          image: docker.io/library/python:3.13-slim
          command: ["python", "-u", "/app/webhook.py"]
          ports: [{containerPort: 8000}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - {name: app, configMap: {name: notify-sink}}
---
apiVersion: v1
kind: Service
metadata: {name: notify-sink, namespace: aiops-demo}
spec:
  selector: {app.kubernetes.io/name: notify-sink}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: aiops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.0.7
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{secretRef: {name: grafana-env}}]
          env:
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            # demo：不登入也能看（唯讀）；改設定要用 admin
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/rca-demo.json}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: alerting, configMap: {name: grafana-alerting}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: aiops-demo}
spec:
  # LoadBalancer：k3s 的 servicelb 開在節點上，Rancher Desktop 對應到本機 localhost:3300。
  # 不用 kubectl port-forward：Windows 上 Grafana 前端同時抓很多檔，port-forward 會逾時、面板卡在 Loading
  type: LoadBalancer
  selector: {app.kubernetes.io/name: grafana}
  ports: [{name: http, port: 3300, targetPort: http}]
