# 「不改程式」驗證用的 .NET 8 服務（程式 dotnet/，ConfigMap sdk-dotnet-src）。
# run-sdk-inject-e2e.sh 用 sed 把 __NAME__、__CONSUME__、__WAIT__（b 等 a 編譯完才編）換掉，部署成 sdk-dotnet-a（消費 Kafka）、sdk-dotnet-b 兩個服務。
# initContainer：用 .NET SDK 編譯；下載 OpenTelemetry .NET 自動埋點 v1.12.0（測試用；正式環境放進 image 或由 chart 掛）。
# 環境變數跟 app-common chart 的 otel.dotnet 一樣。
apiVersion: v1
kind: Service
metadata: {name: __NAME__, namespace: sdk-cases}
spec:
  selector: {app.kubernetes.io/name: __NAME__}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: __NAME__, namespace: sdk-cases}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: __NAME__}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: __NAME__, app.kubernetes.io/version: "1.0.0", app.kubernetes.io/part-of: demo}
    spec:
      initContainers:
        - name: build
          image: mcr.microsoft.com/dotnet/sdk:8.0
          command: ["sh", "-c", "__WAIT__cp -r /src /work && cd /work && dotnet publish -c Release -o /app --nologo -v q"]
          env: [{name: SSL_CERT_FILE, value: /ca/ca-bundle.crt}]   # 測試環境的 proxy 會重簽憑證，NuGet 要信任它的 CA
          volumeMounts: [{name: src, mountPath: /src}, {name: app, mountPath: /app}, {name: ca, mountPath: /ca}]
          resources: {requests: {memory: 512Mi}, limits: {memory: 2Gi}}   # 只寫 limit 的話 request 也算 2Gi，單節點排不進去
        - name: otel
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c", "cd /otel && wget -q -O o.zip https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/releases/download/v1.12.0/opentelemetry-dotnet-instrumentation-linux-glibc-x64.zip && unzip -q o.zip && rm o.zip"]
          volumeMounts: [{name: otel, mountPath: /otel}]
      containers:
        - name: app
          image: mcr.microsoft.com/dotnet/aspnet:8.0
          command: ["dotnet", "/app/sdk-app.dll"]
          env:
            - {name: KAFKA, value: "kafka.sdk-cases.svc:9092"}
            - {name: KAFKA_CONSUME, value: "__CONSUME__"}
            - {name: CORECLR_ENABLE_PROFILING, value: "1"}
            - {name: CORECLR_PROFILER, value: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"}
            - {name: CORECLR_PROFILER_PATH, value: /otel/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so}
            - {name: DOTNET_ADDITIONAL_DEPS, value: /otel/AdditionalDeps}
            - {name: DOTNET_SHARED_STORE, value: /otel/store}
            - {name: DOTNET_STARTUP_HOOKS, value: /otel/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll}
            - {name: OTEL_DOTNET_AUTO_HOME, value: /otel}
            - {name: OTEL_SERVICE_NAME, value: __NAME__}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-node-collector.otel-collector.svc:4318/v1/traces"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: "1.0"}
            - {name: OTEL_METRICS_EXPORTER, value: none}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: Logging__LogLevel__Microsoft.AspNetCore, value: Warning}
            - {name: Logging__Console__FormatterName, value: json}
            - {name: Logging__Console__FormatterOptions__IncludeScopes, value: "true"}
            - {name: Logging__Console__FormatterOptions__UseUtcTimestamp, value: "true"}
            - {name: Logging__Console__FormatterOptions__TimestampFormat, value: "yyyy-MM-ddTHH:mm:ss.fffZ"}
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: "1", memory: 384Mi}}
          volumeMounts: [{name: app, mountPath: /app}, {name: otel, mountPath: /otel}]
      volumes:
        - {name: src, configMap: {name: sdk-dotnet-src}}
        - {name: app, emptyDir: {}}
        - {name: otel, emptyDir: {}}
        - {name: ca, configMap: {name: proxy-ca, optional: true}}
