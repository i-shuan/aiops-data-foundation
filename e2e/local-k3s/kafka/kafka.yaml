# 真的 Kafka（單台，KRaft 模式不用 ZooKeeper）＋ kafka_exporter（danielqsj），namespace kafka-cases（dept D1110 → group imc）。
# 測試用：資料放 emptyDir，Pod 重建就沒了。
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: kafka-cases}
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports: [{name: kafka, port: 9092}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: kafka-cases}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kafka}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka}
    spec:
      # K8s 會把 Service 變成 KAFKA_PORT 這種環境變數塞進 Pod，apache/kafka 的 image 會把 KAFKA_* 當成設定讀，要關掉
      enableServiceLinks: false
      containers:
        - name: kafka
          image: docker.io/apache/kafka:3.9.1
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.kafka-cases.svc:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms512m"}
          ports: [{containerPort: 9092}]
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 5
          resources: {requests: {cpu: 200m, memory: 768Mi}, limits: {memory: 1Gi}}
---
# kafka_exporter：消費落後（lag）等指標，Prometheus 格式，平台的 Collector 照 annotation 來抓
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka-exporter, namespace: kafka-cases}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kafka-exporter}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka-exporter}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9308", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: exporter
          image: docker.io/danielqsj/kafka-exporter:v1.9.0
          args: ["--kafka.server=kafka.kafka-cases.svc:9092"]
          ports: [{containerPort: 9308}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
