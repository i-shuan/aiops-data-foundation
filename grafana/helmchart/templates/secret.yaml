{{- if .Values.secretData }}
# CI 部署時從 values 建（.gitlab-ci.yml 組出來，不進 git）；沒給 secretData 就不建，沿用手動建的 Secret。
# resource-policy: keep：之後的部署沒帶 secretData 時，helm 不會把這個 Secret 當成「不要了」刪掉。
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.envSecret }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretData }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
