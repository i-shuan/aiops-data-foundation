apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
      annotations:
        checksum/provisioning: {{ include (print .Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      securityContext: {fsGroup: 472}
      automountServiceAccountToken: false    # Grafana 不用呼叫 K8s API，不掛 service account token
      {{- if .Values.plugin.enabled }}
      initContainers:
        - name: install-plugins
          image: {{ .Values.image }}         # 跟主容器同一個 image
          command: ["sh", "/installer/install-plugin.sh"]
          env:
            - {name: PLUGIN_ID, value: {{ .Values.plugin.id | quote }}}
            - {name: PLUGIN_URL, value: {{ .Values.plugin.url | quote }}}
            - {name: PLUGIN_SHA256, value: {{ .Values.plugin.sha256 | quote }}}
            - {name: PLUGINS_DIR, value: /var/lib/grafana/plugins}
          volumeMounts:
            - {name: grafana-plugins, mountPath: /var/lib/grafana/plugins}
            - {name: plugin-installer, mountPath: /installer, readOnly: true}
          resources:
            {{- toYaml .Values.plugin.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: grafana
          image: {{ .Values.image }}
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - secretRef: {name: {{ .Values.envSecret }}}
          env:
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            {{- if .Values.anonymousViewer }}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            {{- end }}
            {{- if .Values.embedFeedback }}
            # 回饋網頁內嵌在儀表板 aiops-feedback 裡（文字面板的 iframe）：要關掉 HTML 消毒。代價：所有文字面板都能放任意 HTML，
            # 有編輯權的人能在儀表板塞東西——這台 Grafana 只給 AIOps 用、編輯權限收緊時才開
            - {name: GF_PANELS_DISABLE_SANITIZE_HTML, value: "true"}
            {{- end }}
            {{- with .Values.homeDashboard }}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: {{ . | quote }}}
            {{- end }}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards/aiops.yaml, subPath: aiops.yaml, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/provisioning/dashboards/aiops, readOnly: true}
            {{- if .Values.plugin.enabled }}
            - {name: grafana-plugins, mountPath: /var/lib/grafana/plugins}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: alerting, configMap: {name: grafana-alerting}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
        {{- if .Values.plugin.enabled }}
        - name: grafana-plugins
          emptyDir: {}        # Pod 每次重建都由 initContainer 重裝，版本永遠是 values 寫的那個
        - name: plugin-installer
          configMap: {name: grafana-plugin-installer}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
