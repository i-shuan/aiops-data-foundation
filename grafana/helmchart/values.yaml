# 正式環境的預設值。公司已經有 Grafana 的話不用這個 chart：只把 initContainer 那段加進現有的 Deployment（見 ../README.md）。
#
# data source、3 條告警規則、contact point、policy、3 個儀表板都在 files/ 裡（Helm 只讀得到 chart 資料夾內的檔），
# 裝的時候不用再帶檔案：helm upgrade --install grafana grafana/helmchart -n <ns>
# 檔裡的 ${ES_URL}、${GRAFANA_ES_API_KEY}、${NOTIFY_*_URL} 由 Grafana 從環境變數展開（envSecret）。
# 要改通知管道、dept 清單：改 files/ 的檔再升級；回饋網頁的網址用下面的 feedbackUrl。
image: grafana/grafana:13.0.7                              # 換成 Nexus 的路徑

service:
  type: ClusterIP
  port: 3000

# Secret（chart 不建）：ES_URL、GRAFANA_ES_API_KEY（唯讀 key）、NOTIFY_IT_URL／NOTIFY_IMC_URL／NOTIFY_PLATFORM_URL、GF_SECURITY_ADMIN_PASSWORD
envSecret: grafana-env
secretData: {}                                             # CI 部署時從 values 建 Secret（ES_URL、GRAFANA_ES_API_KEY、NOTIFY_*、GF_SECURITY_ADMIN_PASSWORD）；空的就不建、沿用手動建的
env:
  GF_PLUGINS_PREINSTALL_DISABLED: "true"                  # 不讓 Grafana 自己連外網裝預設外掛
anonymousViewer: false                                     # true：不登入也能看（demo 用）
homeDashboard: ""                                          # 例如 /etc/grafana/provisioning/dashboards/aiops/aiops-rca.json

# 回饋表單預設用 engine api 的 HTML 頁（儀表板 aiops-feedback 放連結），不用外掛。要在 Grafana 裡直接填（Business Forms 外掛）：
# enabled: true、url 指到 Nexus 上的 zip；會多載入儀表板「AIOps 回饋（外掛表單）」（files/dashboards/forms/）
plugin:                                                    # initContainer（files/install-plugin.sh，Pod 啟動時跑）從 url 下載 zip、核對 SHA-256、解到 emptyDir
  enabled: false                                           # Pod 每次重建都重裝，版本永遠是這裡寫的
  id: volkovlabs-form-panel
  url: https://nexus.example.internal/repository/raw/grafana-plugins/volkovlabs-form-panel-6.3.1.zip
  sha256: 1eece14d67b2ffac4bbba18f5c69cde3f0f7aecef2276b0f1b33bc3cfb9998d0
  resources:
    requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 64Mi}
    limits: {memory: 128Mi, ephemeral-storage: 256Mi}    # 外掛 zip 約 1.4MB，解開約 4.6MB

# 回饋網頁（engine api 的 /feedback）內嵌在儀表板 aiops-feedback 裡（iframe），不用另開分頁。預設關：開了會關掉 Grafana 的
# HTML 消毒（GF_PANELS_DISABLE_SANITIZE_HTML），所有文字面板都能放任意 HTML——只在這台 Grafana 專給 AIOps、編輯權限收緊時開。
# 關著：iframe 會被 Grafana 洗掉，面板上只剩連結（另開分頁），功能一樣
embedFeedback: false

# engine 的 api（Service aiops-api）的網址，要是使用者的**瀏覽器**連得到的（Service 前面加 Ingress）。
# 儀表板 aiops-feedback 的回饋表單、漏報表單、「重跑根因分析」按鈕都從瀏覽器直接打它，渲染時把檔裡的 http://localhost:18080 換成這個值。
feedbackUrl: http://localhost:18080

resources:
  requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi}
  limits: {memory: 1Gi, ephemeral-storage: 1Gi}          # 沒掛 PVC，Grafana 的 sqlite、log 都在容器裡（設定全由 provisioning 來，重建不會丟）
