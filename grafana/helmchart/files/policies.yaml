# 依 dept 送到哪個 contact point（dept 清單跟 APM agent 的 labels.dept 值一致）；沒有 dept 的（資料品質、節點）送平台。
# 嚴重度（investigator/alerts/severity.py）：critical、high 才通知；warning 只進事故清單（下面第一條路由永遠靜音）。
apiVersion: 1
muteTimes:
  - orgId: 1
    name: always               # 永遠靜音：warning 的件仍在 Grafana 的告警清單、儀表板看得到，只是不送通知
    time_intervals:
      - weekdays: ["sunday:saturday"]
policies:
  - orgId: 1
    receiver: platform
    group_by: [alert_id]        # 一件一則：AIOps 已經依服務合併過，這裡不要再依 dept、service 合併
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: platform
        object_matchers: [[source, "=", aiops], [severity, "=", warning]]
        mute_time_intervals: [always]
      - receiver: it-oncall
        object_matchers: [[source, "=", aiops], [dept, "=~", "D3120|D3130"]]
      - receiver: imc-oncall
        object_matchers: [[source, "=", aiops], [dept, "=~", "D1110|D1120"]]
      # 夜間只發 critical：再加一條 mute timing（例如 night），掛在 severity="high" 的子路由上
