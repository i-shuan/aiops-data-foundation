# Grafana 的 data source：engine 自己的資料在 PostgreSQL（aiops-db：告警、異常、調整、回饋，儀表板與告警規則用），
# 加公司 Elastic APM 的 metrics、trace、log 三個 ES（整合儀表板 aiops-overview 用；欄位對照見 aiops-engine/configs/apm/README.md）
apiVersion: 1
datasources:
  # engine 自己的資料（告警、異常、調整、回饋…）：PostgreSQL（docs/pdca/meta/2026-11-postgres-store.md）。帳號給唯讀的（SELECT）
  - name: aiops-db
    uid: aiops-db
    type: grafana-postgresql-datasource
    access: proxy
    url: ${AIOPS_PG_HOST}                 # host:port，例如 pg.example.internal:5432；DBA 有唯讀副本就填副本（Grafana 只讀，不跟 engine 的寫入搶主庫；副本落後幾秒不影響 10 分鐘的心跳規則）
    user: ${GRAFANA_PG_USER}
    jsonData:
      database: ${AIOPS_PG_DATABASE}
      sslmode: ${AIOPS_PG_SSLMODE}         # require／verify-full（公司的 PostgreSQL）；本機測試 disable
      postgresVersion: 1400
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
  - name: apm-metrics
    uid: apm-metrics
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "metrics-apm.transaction.1m-*"
      timeField: "@timestamp"
      timeInterval: "1m"           # APM 的指標一分鐘一筆；auto 的間隔不要比它短，不然每隔一格是空的、線連不起來
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}
  - name: apm-traces
    uid: apm-traces
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "traces-apm-*"
      timeField: "@timestamp"
      timeInterval: "1m"
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}
  - name: apm-logs
    uid: apm-logs
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    jsonData:
      index: "logs-apm.*"
      timeField: "@timestamp"
      logMessageField: error.exception.message   # Log 面板每一行顯示的欄位（APM 例外的訊息）
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}
