# grafana：沒有現成 Grafana 時，用 grafana/helmchart 部署一台（公司已經有 Grafana 就不用這份，見 grafana/README.md）。
#
# 變數：
#   KUBE_CONFIG_GRAFANA        （Type: File）部署 Grafana 的 cluster 的 kubeconfig
#   GRAFANA_NAMESPACE          選填，預設 grafana
#   GRAFANA_IMAGE              Nexus 的 Grafana image，例如 nexus.example.internal/grafana/grafana:13.0.7
#   GRAFANA_PLUGIN_URL         Business Forms 外掛 zip 的網址（Nexus）；連不到 Nexus 改用 repo 裡的 zip，見 grafana/README.md
#   ES_URL                     公司 ES 的網址（寫進 Secret）
#   GRAFANA_ADMIN_PASSWORD     Grafana admin 密碼
#   NOTIFY_IT_URL、NOTIFY_IMC_URL、NOTIFY_PLATFORM_URL    各部門的通知 webhook
#
# 有跑 es-setup（同一條 pipeline）：用它的 grafana-values.yaml 加上上面的變數，由 chart 建 Secret grafana-env。
# 沒跑 es-setup：只更新儀表板、告警規則，不碰 Secret（沿用現有的）。

deploy-grafana:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3.15
    entrypoint: [""]
  needs:
    - job: es-setup
      artifacts: true
      optional: true
  variables:
    KUBECONFIG: ${KUBE_CONFIG_GRAFANA}
  script:
    - ns="${GRAFANA_NAMESPACE:-grafana}"
    - kubectl get namespace "${ns}" >/dev/null 2>&1 || kubectl create namespace "${ns}"
    - |
      secret_args=""
      if [ -f keys/grafana-values.yaml ]; then
        umask 077
        {
          echo "secretData:"
          echo "  ES_URL: \"${ES_URL}\""
          echo "  NOTIFY_IT_URL: \"${NOTIFY_IT_URL}\""
          echo "  NOTIFY_IMC_URL: \"${NOTIFY_IMC_URL}\""
          echo "  NOTIFY_PLATFORM_URL: \"${NOTIFY_PLATFORM_URL}\""
          echo "  GF_SECURITY_ADMIN_PASSWORD: \"${GRAFANA_ADMIN_PASSWORD}\""
          sed -n '2,$p' keys/grafana-values.yaml      # 第一行是 "secretData:"，已經在上面了
        } > grafana-secret-values.yaml
        secret_args="-f grafana-secret-values.yaml"
      else
        echo "沒有 es-setup 的 key 檔：不更新 Secret grafana-env，沿用現有的"
      fi
      helm upgrade --install grafana grafana/helmchart -n "${ns}" ${secret_args} \
        --set image="${GRAFANA_IMAGE}" --set plugin.url="${GRAFANA_PLUGIN_URL}" \
        --set-file provisioning.datasources.aiops=grafana/code/datasource.yaml \
        --set-file provisioning.alerting.alert-rules=grafana/code/alert-rules.yaml,provisioning.alerting.contact-points=grafana/code/contact-points.yaml,provisioning.alerting.policies=grafana/code/policies.yaml \
        --set-file provisioning.dashboards.aiops-feedback=grafana/code/dashboards/aiops-feedback.json,provisioning.dashboards.aiops-rca=grafana/code/dashboards/aiops-rca.json,provisioning.dashboards.aiops-learning=grafana/code/dashboards/aiops-learning.json
    - kubectl -n "${ns}" rollout status deployment/grafana --timeout=300s
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - grafana/**/*
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
