# Grafana chart（helm repo grafana-community/grafana；原 grafana/grafana 已棄用、搬到 grafana-community）的 values：data source、告警、儀表板都在這一份。
# 由 grafana/code/build-official-values.py 從 grafana/helmchart/files/ 產生，**不要手改**：改 helmchart/files/ 的檔，再跑
#   python3 grafana/code/build-official-values.py
#
# 部署（Secret grafana-env 要先有：ES_URL、GRAFANA_ES_API_KEY、NOTIFY_IT_URL、NOTIFY_IMC_URL、NOTIFY_PLATFORM_URL、GF_SECURITY_ADMIN_USER、GF_SECURITY_ADMIN_PASSWORD；
# 或用 .gitlab-ci.yml 的 grafana job 建）：
#   helm repo add grafana-community https://grafana-community.github.io/helm-charts
#   helm upgrade --install grafana grafana-community/grafana -n grafana -f grafana/values-official.yaml \
#     --set image.registry=<nexus> --set image.tag=13.0.7
#
# 要先改的：image（換成 Nexus）、contactpoints 的通知管道、policies 的 dept 清單、
#   儀表板 aiops-feedback 裡的兩個 http://localhost:18080（換成使用者瀏覽器連得到的回饋服務網址）。
# 回饋表單外掛（Business Forms）：公司的 Grafana 已經有裝就不用管；沒有的話在 plugins 加上（見下面），
#   chart 的 plugins 不核對 SHA-256，要核對請用 grafana/helmchart（我們自己的 chart）。
image:
  registry: nexus.example.internal
  repository: grafana/grafana
  tag: 13.0.7
testFramework:
  enabled: false
admin:
  existingSecret: grafana-env
  userKey: GF_SECURITY_ADMIN_USER
  passwordKey: GF_SECURITY_ADMIN_PASSWORD
envFromSecret: grafana-env
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: aiops-alerts
      uid: aiops-alerts
      type: elasticsearch
      access: proxy
      url: ${ES_URL}
      jsonData:
        index: aiops-alerts
        timeField: '@timestamp'
        httpHeaderName1: Authorization
      secureJsonData:
        httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}
    - name: aiops-anomalies
      uid: aiops-anomalies
      type: elasticsearch
      access: proxy
      url: ${ES_URL}
      jsonData:
        index: aiops-anomalies
        timeField: '@timestamp'
        httpHeaderName1: Authorization
      secureJsonData:
        httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}
    - name: aiops-tuning
      uid: aiops-tuning
      type: elasticsearch
      access: proxy
      url: ${ES_URL}
      jsonData:
        index: aiops-tuning
        timeField: at
        httpHeaderName1: Authorization
      secureJsonData:
        httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}
    - name: aiops-feedback
      uid: aiops-feedback
      type: elasticsearch
      access: proxy
      url: ${ES_URL}
      jsonData:
        index: aiops-feedback
        timeField: '@timestamp'
        httpHeaderName1: Authorization
      secureJsonData:
        httpHeaderValue1: ApiKey ${GRAFANA_ES_API_KEY}
alerting:
  rules.yaml:
    apiVersion: 1
    groups:
    - orgId: 1
      name: aiops
      folder: AIOps
      interval: 1m
      rules:
      - uid: aiops-incident
        title: AIOps 事件
        condition: C
        data:
        - refId: A
          datasourceUid: aiops-alerts
          relativeTimeRange:
            from: 300
            to: 0
          model:
            refId: A
            query: status:open
            timeField: '@timestamp'
            metrics:
            - id: '1'
              type: count
            bucketAggs:
            - id: '2'
              type: terms
              field: alert_id
              settings:
                size: '500'
                min_doc_count: '1'
                order: desc
                orderBy: _count
            - id: '3'
              type: terms
              field: service
              settings:
                size: '1'
                min_doc_count: '1'
                order: desc
                orderBy: _count
                missing: —
            - id: '4'
              type: terms
              field: dept
              settings:
                size: '1'
                min_doc_count: '1'
                order: desc
                orderBy: _count
                missing: none
            - id: '5'
              type: terms
              field: group
              settings:
                size: '1'
                min_doc_count: '1'
                order: desc
                orderBy: _count
                missing: unassigned
            - id: '6'
              type: terms
              field: severity
              settings:
                size: '1'
                min_doc_count: '1'
                order: desc
                orderBy: _count
                missing: warning
            - id: '7'
              type: terms
              field: summary
              settings:
                size: '1'
                min_doc_count: '1'
                order: desc
                orderBy: _count
                missing: ''
            - id: '8'
              type: terms
              field: report_url
              settings:
                size: '1'
                min_doc_count: '1'
                order: desc
                orderBy: _count
                missing: ''
            - id: '9'
              type: date_histogram
              field: '@timestamp'
              settings:
                interval: 1m
                min_doc_count: '0'
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: max
            settings:
              mode: dropNN
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          source: aiops
        annotations:
          summary: '{{ `{{ $labels.summary }}` }}'
          report: '{{ `{{ $labels.report_url }}` }}'
          feedback: https://grafana.example.internal/d/aiops-feedback?var-alert={{ `{{ $labels.alert_id }}` }}
      - uid: aiops-heartbeat
        title: AIOps 停了（investigator alert 10 分鐘沒寫入）
        condition: C
        data:
        - refId: A
          datasourceUid: aiops-alerts
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            query: alert_id:heartbeat
            timeField: '@timestamp'
            metrics:
            - id: '1'
              type: count
            bucketAggs:
            - id: '2'
              type: date_histogram
              field: '@timestamp'
              settings:
                interval: 10m
                min_doc_count: '0'
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: sum
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: lt
                params:
                - 1
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          source: aiops
          severity: critical
        annotations:
          summary: AIOps 的 investigator alert 已經 10 分鐘沒有寫入 aiops-alerts：排程停了、或連不到 ES。停著的期間所有件都看不到，不是真的恢復。
      - uid: aiops-baseline-missing
        title: AIOps 基準線不見（detect 讀到空的 aiops-baseline）
        condition: C
        data:
        - refId: A
          datasourceUid: aiops-alerts
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            query: alert_id:detect-status AND missing_baseline:>0
            timeField: '@timestamp'
            metrics:
            - id: '1'
              type: count
            bucketAggs:
            - id: '2'
              type: date_histogram
              field: '@timestamp'
              settings:
                interval: 10m
                min_doc_count: '0'
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: reduce
            expression: A
            reducer: sum
            settings:
              mode: replaceNN
              replaceWithValue: 0
        - refId: C
          datasourceUid: __expr__
          model:
            refId: C
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          source: aiops
          severity: critical
        annotations:
          summary: AIOps 的 detect 讀到空的基準線（aiops-baseline 掉了、或還沒 train）：這些序列的動態基準線學習靜默停了，不會報異常；靜態規則、Pod 同儕橫向比對不受影響。手動跑一次 train：kubectl -n aiops exec deploy/aiops-engine -c scheduler -- python3 -m scheduler --config configs/schedule/schedule.yaml --run train
  contactpoints.yaml:
    apiVersion: 1
    contactPoints:
    - orgId: 1
      name: it-oncall
      receivers:
      - uid: it-oncall
        type: webhook
        settings:
          url: ${NOTIFY_IT_URL}
          httpMethod: POST
    - orgId: 1
      name: imc-oncall
      receivers:
      - uid: imc-oncall
        type: webhook
        settings:
          url: ${NOTIFY_IMC_URL}
          httpMethod: POST
    - orgId: 1
      name: platform
      receivers:
      - uid: platform
        type: webhook
        settings:
          url: ${NOTIFY_PLATFORM_URL}
          httpMethod: POST
  policies.yaml:
    apiVersion: 1
    muteTimes:
    - orgId: 1
      name: always
      time_intervals:
      - weekdays:
        - monday:sunday
    policies:
    - orgId: 1
      receiver: platform
      group_by:
      - alert_id
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
      - receiver: platform
        object_matchers:
        - - source
          - '='
          - aiops
        - - severity
          - '='
          - warning
        mute_time_intervals:
        - always
      - receiver: it-oncall
        object_matchers:
        - - source
          - '='
          - aiops
        - - dept
          - =~
          - D3120|D3130
      - receiver: imc-oncall
        object_matchers:
        - - source
          - '='
          - aiops
        - - dept
          - =~
          - D1110|D1120
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: aiops
      orgId: 1
      folder: AIOps
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/aiops
