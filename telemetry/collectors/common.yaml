# 兩種 Collector 共用的部分：讀 namespace 的 dept、決定 group、依 group 寫進各自的 data stream（data_stream.namespace = group）。
# 所有 group 共用一把寫入 key、一個出口：資料屬於哪個 group 由這裡依 Pod 決定，不靠 key 擋（docs/pdca/phase1-collect/2026-10-ingest-simplify.md）。
# 節點那一份（node.yaml）與 cluster 那一份（cluster.yaml）都會一起載入這份，分部門的規則只有這一處，
# metrics 和 log 共用。
#
# metrics：metrics-<來源>.otel-<group>，例如 metrics-kubeletstatsreceiver.otel-it。
#   ES 9 內建的 metrics-otel@template（metrics-*.otel-*）會把它建成 time series data stream。
# log（只有節點那一份收）：先進 logs-generic.otel-<group>，中央 ES 的 k8s-logs-otel pipeline
#   整理形狀後轉到 k8s-<group>-<cluster>，跟其他來源的 log 同一條 k8s-logs pipeline。
# trace（只有節點那一份收，應用用 OTLP 送來）：traces-generic.otel-<group>（ES 9 內建的 traces-otel@template）。

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # 寫入 key 從檔案讀（Secret es-writer-keys 的 ES_WRITER_API_KEY，掛在 /etc/es-keys）。
  # 檔案一變就換用新 key，不用重啟：換 key 時先換上新的、確認都在用了，才作廢舊的，就不會有 key 失效的空檔
  #（key 失效期間的資料會被丟掉，見 docs/metrics/README.md 的「坑」）。換 key 用 telemetry/scripts/rotate-writer-key.sh
  bearertokenauth/es:
    scheme: ApiKey
    filename: /etc/es-keys/ES_WRITER_API_KEY
  # 送不出去的資料放在節點上，Collector 重啟或 ES 暫時連不上都不會掉
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # 擋冒充：應用自己帶的 dept、group 或指定 data stream 的欄位一律不算數，
  # 歸屬只看 namespace 的 dept label
  transform/pre:
    error_mode: ignore
    metric_statements:
      - delete_key(datapoint.attributes, "dept")
      - delete_key(datapoint.attributes, "group")
      - delete_key(datapoint.attributes, "data_stream.dataset")
      - delete_key(datapoint.attributes, "data_stream.namespace")
      - delete_key(resource.attributes, "dept")
      - delete_key(resource.attributes, "group")
      - delete_key(resource.attributes, "data_stream.dataset")
      - delete_key(resource.attributes, "data_stream.namespace")
      # Prometheus receiver 會把抓取工作的名稱（例如 pods）填進 service.name，不是應用的名稱。
      # 先清掉，下面 k8s_attributes 才會用 Pod 的 app.kubernetes.io/name 填（它不覆蓋已經有的值）
      - delete_key(resource.attributes, "service.name")
      # Prometheus 抓來的資料只知道 Pod 的 IP（server.address），補成 k8s.pod.ip 才對得到是哪個 Pod
      - set(resource.attributes["k8s.pod.ip"], resource.attributes["server.address"]) where resource.attributes["k8s.pod.ip"] == nil and resource.attributes["server.address"] != nil

  # 依「這筆資料屬於哪個 Pod」補上 K8s 資訊與 namespace 的 dept。
  # 重點：Pod 的 CPU、記憶體雖然是從節點的 kubelet 抓的，歸屬仍依那個 Pod 的 namespace，
  # 不會因為抓取對象是節點就被分到 unassigned。
  k8s_attributes:
    auth_type: serviceAccount
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
      # 應用自己用 OTLP 送來的（trace）：看連線的來源 IP 是哪個 Pod。
      # 應用自帶的 k8s.* 會先在 transform/traces-pre 拿掉，所以一定走到這一條，不能冒充別的 Pod
      - sources:
          - from: connection
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
        # 下面三個只給 log 用（中央 pipeline 的 container.*），metrics、trace 送出前會拿掉（transform/drop-log-attrs）
        - container.image.name
        - container.image.tags   # 新版改成複數（陣列）；單數的 container.image.tag 已經不會送
        - container.id
      labels:
        - tag_name: dept
          key: dept
          from: namespace
        # 服務身分：由 app-common chart 統一蓋的 label，跟 log 那邊的 service.* 對得上
        - tag_name: service.name
          key: app.kubernetes.io/name
          from: pod
        - tag_name: service.version
          key: app.kubernetes.io/version
          from: pod
        - tag_name: service.namespace
          key: app.kubernetes.io/part-of
          from: pod
        # 全部 pod label，只給 log 用：中央 pipeline 用 log-format 決定怎麼拆，也存成 kubernetes.labels。
        # metrics、trace 送出前會拿掉，不然每個 label 都會變成 time series 的維度
        - tag_name: k8s.pod.labels.$$1
          key_regex: (.*)
          from: pod

  # dept → group。清單要跟 telemetry/groups.yaml、Fluent Bit 的分流規則一致。
  # 沒有 dept（例如節點本身的資料）或不在清單裡的，一律 unassigned。
  transform/group:
    error_mode: ignore
    # metrics 和 log 用同一份規則（YAML anchor）
    log_statements: &group_rules
      - set(resource.attributes["group"], "unassigned")
      - set(resource.attributes["group"], "it") where resource.attributes["dept"] != nil and IsMatch(resource.attributes["dept"], "^(D3120|D3130)$")
      - set(resource.attributes["group"], "imc") where resource.attributes["dept"] != nil and IsMatch(resource.attributes["dept"], "^(D1110|D1120)$")
      - set(resource.attributes["data_stream.namespace"], resource.attributes["group"])
      - set(resource.attributes["k8s.cluster.name"], "${env:CLUSTER_NAME}")
      # Pod 沒有 app.kubernetes.io/name（沒套 app-common chart）的，退回用 Deployment 名稱
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"] != nil
    metric_statements: *group_rules
    trace_statements: *group_rules

  # 只給 log 用的資訊，metrics 和 trace 不要：pod label 會變成 metrics 的維度，container.id 每次重啟都變
  transform/drop-log-attrs:
    error_mode: ignore
    metric_statements: &drop_log_attrs
      - delete_matching_keys(resource.attributes, "^(k8s\\.pod\\.labels\\.|container\\.)")
    trace_statements: *drop_log_attrs

# 一個出口、一把 key；metrics 和 log 各有自己的佇列（同一個出口用在兩種 pipeline 時各一份）。
# 寫到哪個 data stream 由資料自己的 data_stream.namespace（= group）決定，不用依 group 分出口。
#
# ⚠ 用 OTLP 送到 ES 9 自己的 OTLP 入口（/_otlp/v1/metrics），不用 elasticsearch 寫入元件。
#   elasticsearch 寫入元件把「連線逾時、沒拿到 HTTP 回應」當成永久錯誤，不重試、直接丟掉；
#   實測 ES 停 3 分鐘，停機期間的 metrics 幾乎全掉（佇列有存，但沒有拿來重送）。
#   OTLP 寫入元件對任何暫時性錯誤（連不上、逾時、429、502～504）都重試，佇列放在節點上。
exporters:
  otlp_http/es:
    metrics_endpoint: ${env:ES_ENDPOINT}/_otlp/v1/metrics
    logs_endpoint: ${env:ES_ENDPOINT}/_otlp/v1/logs
    traces_endpoint: ${env:ES_ENDPOINT}/_otlp/v1/traces
    auth:
      authenticator: bearertokenauth/es
    timeout: 30s
    sending_queue:
      enabled: true
      storage: file_storage
      # 上限用筆數（log 行數、metrics 點數）算：沒有 batch processor 時，進佇列的是讀檔時的小批（實測每批約 40 行），
      # 用請求數算的話 10,000 個在每秒 200 行時 33 分鐘就滿
      sizer: items
      queue_size: 20000000
      # 一批一批送（量大時才送得動）在佇列裡湊，不用 batch processor：batch processor 在佇列前面、在記憶體裡，
      # 資料交給它時讀檔位置已經往前，Collector 當掉（OOM、kill -9）就掉最後約 1 秒（docs/pdca/phase1-collect/2026-10-durability.md）
      batch:
        flush_timeout: 1s
        min_size: 2000
        max_size: 2000
    # max_elapsed_time 0 = 一直重試到送成功為止。佇列滿了才會丟（見 queue_size）
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0

service:
  extensions: [health_check, file_storage, bearertokenauth/es]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  # pipeline 在 node.yaml、cluster.yaml
