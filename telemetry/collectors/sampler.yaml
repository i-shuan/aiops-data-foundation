# 第二層 trace-sampler（尾端取樣）的設定，跑在 StatefulSet trace-sampler（trace-sampler.yaml）。
# node Collector 已經補好 K8s、部門欄位，依 trace_id 把同一個 trace 的每一段都送到同一台（node.yaml 的
# loadbalancing/traces），這裡等整個 trace 到齊再決定留不留，留下的送進 ES（寫到哪個 group 的 data stream 由 data_stream.namespace 決定）。為什麼、實測見 docs/trace/scenarios.md。
#
# 決定的順序（sample_on_first_match：第一個符合的就決定，ES 的 scope.attributes.tailsampling.policy 記的是它）：
#   1. random    ：先隨機抽 RANDOM_PCT%，不管快慢對錯。trace baseline 只用這一份，統計才不會被「錯的、慢的全留」拉偏
#   2. error     ：有任何一段 status = ERROR
#   3. http-5xx  ：有任何一段 HTTP 狀態碼 5xx（status 沒設成 ERROR 的也抓）
#   4. exception ：有任何一段帶例外事件（吞掉例外、回 200 的也抓）
#   5. slow      ：整個 trace 超過 SLOW_MS
#   其他的都不留。
# 參數（trace-sampler.yaml 的環境變數）：
#   DECISION_WAIT：第一段到了之後等多久才決定。要比最長的請求長（實測：等 10 秒時，比 10 秒長、底下的段先到的請求會漏）
#   NUM_TRACES   ：每台記憶體裡最多放幾個還沒決定的 trace，滿了最舊的直接丟。至少「每台每秒 trace 數 × DECISION_WAIT × 2」
extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/es:
    scheme: ApiKey
    filename: /etc/es-keys/ES_WRITER_API_KEY

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  tail_sampling:
    decision_wait: ${env:DECISION_WAIT}
    num_traces: ${env:NUM_TRACES}
    expected_new_traces_per_sec: ${env:EXPECTED_TPS}
    sample_on_first_match: true
    decision_cache:                              # 決定過的 trace_id 記住，晚到的段照同一個決定（留或丟）
      sampled_cache_size: 200000
      non_sampled_cache_size: 200000
    policies:
      - name: random
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:RANDOM_PCT}
      - name: error
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: http-5xx
        type: numeric_attribute
        numeric_attribute: {key: http.response.status_code, min_value: 500, max_value: 599}
      - name: exception
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          spanevent: ['spanevent.name == "exception"']
      - name: slow
        type: latency
        latency:
          threshold_ms: ${env:SLOW_MS}
  batch: {}

exporters:
  elasticsearch/es:    # 同 common.yaml：ES 8.19 沒有 /_otlp 入口，用 elasticsearch 寫入元件
    endpoint: ${env:ES_ENDPOINT}
    mapping: {mode: otel}
    auth: {authenticator: bearertokenauth/es}
    timeout: 0           # 同 common.yaml：不給總期限，一直等到 ES 回來
    retry: {enabled: true, max_retries: 100000000, initial_interval: 1s, max_interval: 30s, retry_on_status: [401, 429, 502, 503, 504]}   # 同 common.yaml
    # 佇列寫在磁碟（PVC，trace-sampler.yaml）：ES 停機時 trace-sampler 重啟不會掉。記憶體佇列重啟時整個默默不見
    #（實測 ES 停機中重啟，3,000 個 trace 掉 2,540 個，大部分沒有任何 log；docs/pdca/phase1-collect/2026-10-trace-durability.md）
    sending_queue: {enabled: true, queue_size: 10000, storage: file_storage}
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 30s, max_elapsed_time: 0}

service:
  extensions: [health_check, bearertokenauth/es, file_storage]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [elasticsearch/es]
