# test/local-k3s/run-trace-baseline-e2e.sh 用：測試只跑幾十分鐘，所以 1 分鐘一個點、學 20 分鐘就用（只會到 all 這一層）
traces_index: traces-*.otel-*
interval: 1m
sample_per_bucket: 20
min_requests: 5
clock_skew_ms: 500
train: {timezone: Asia/Taipei, min_weeks: 2, min_days: 3, min_points: 15}
detect: {z: 5, rel_floor: 0.1}
metrics:
  calls:      {direction: both, min_abs: 0.5}
  time_ms:    {direction: up,   min_abs: 20}
  error_rate: {direction: up,   min_abs: 0.05}
