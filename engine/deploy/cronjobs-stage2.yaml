# 之後再開的 6 個（trace 每一段、跟兄弟比、資料品質、慢性病）：第一階段的 4 個在真實資料上跑穩、看過一輪誤報再一個一個打開
# （kustomization.yaml 的 resources 把這個檔的註解拿掉）。這個檔也是 deploy/gen-cronjobs.py 產生的。
---
# 跟兄弟比看最近 10 分鐘
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-peer
  labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: peer}
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: peer}
        spec:
          restartPolicy: Never
          containers:
            - name: engine
              image: aiops-engine
              args: ['detector', 'peer', '--config', 'configs/baseline/peer.yaml']
              envFrom:
                - configMapRef: {name: aiops-env}
                - secretRef: {name: aiops-secrets}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {memory: 1Gi}
              # 設定檔要蓋掉 image 裡的：打開 kustomization 的 aiops-configs，再把下面打開
              # volumeMounts: [{name: configs, mountPath: /app/configs/baseline/series.yaml, subPath: series.yaml}]
          # volumes: [{name: configs, configMap: {name: aiops-configs}}]
