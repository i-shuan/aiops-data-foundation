# 能直接跑的完整範例：一台 Grafana＋回饋表單外掛（initContainer）＋回饋表單儀表板。給本機 k3d、或沒有現成 Grafana 時用；
# 公司已經有 Grafana 的話用 plugin-init-patch.yaml 就好。
#
#   kubectl create namespace grafana
#   kubectl -n grafana create configmap grafana-plugin-installer --from-file=install-plugin.sh
#   kubectl -n grafana create configmap aiops-grafana-dashboards \
#     --from-file=../../configs/grafana/dashboards/aiops-feedback.json
#   kubectl -n grafana create configmap aiops-grafana-provisioning --from-file=aiops.yaml=../../configs/grafana/dashboards.yaml
#   kubectl -n grafana apply -f grafana-example.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      securityContext: {fsGroup: 472}
      automountServiceAccountToken: false    # Grafana 不用呼叫 K8s API，不掛 service account token
      initContainers:
        - name: install-plugins
          image: grafana/grafana:13.0.7
          command: ["sh", "/installer/install-plugin.sh"]
          env:
            - {name: PLUGIN_ID, value: volkovlabs-form-panel}
            - {name: PLUGIN_URL, value: "https://nexus.example.internal/repository/raw/grafana-plugins/volkovlabs-form-panel-6.3.1.zip"}
            - {name: PLUGIN_SHA256, value: 1eece14d67b2ffac4bbba18f5c69cde3f0f7aecef2276b0f1b33bc3cfb9998d0}
            - {name: PLUGINS_DIR, value: /var/lib/grafana/plugins}
          volumeMounts:
            - {name: grafana-plugins, mountPath: /var/lib/grafana/plugins}
            - {name: plugin-installer, mountPath: /installer, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 64Mi}
            limits: {memory: 128Mi, ephemeral-storage: 256Mi}    # 外掛 zip 約 10MB，解開不到 50MB
      containers:
        - name: grafana
          image: grafana/grafana:13.0.7
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}    # 不讓 Grafana 自己連外網裝預設外掛
          volumeMounts:
            - {name: grafana-plugins, mountPath: /var/lib/grafana/plugins}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/aiops.yaml, subPath: aiops.yaml, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/provisioning/dashboards/aiops, readOnly: true}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi}
            limits: {memory: 1Gi, ephemeral-storage: 1Gi}    # 範例沒掛 PVC，Grafana 的 sqlite、log 都在容器裡
      volumes:
        - name: grafana-plugins
          emptyDir: {}
        - name: plugin-installer
          configMap: {name: grafana-plugin-installer}
        - name: provisioning
          configMap: {name: aiops-grafana-provisioning}
        - name: dashboards
          configMap: {name: aiops-grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
