# 每個指令一個 CronJob（docs/pdca/2026-10-schedule.md 的表）。這個檔是 deploy/gen-cronjobs.py 產生的，改表要改那裡。
# 第一階段只開這 4 個（rules、detect、alert、train）；其他 6 個在 cronjobs-stage2.yaml，四個跑穩了再在 kustomization 打開。
# 共同點：concurrencyPolicy Forbid（上一次沒跑完就跳過這次）、startingDeadlineSeconds（錯過就不補跑，下一分鐘再來）、
#         activeDeadlineSeconds（卡住就砍）、只留最近 1 次成功、3 次失敗的 Pod 方便看 log。時區跟著 TZ（CronJob 的 timeZone）。
---
# 狀態變化（容器重啟、錯誤率 5%、p95 2 秒保底…）要快
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-rules
  labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: rules}
spec:
  schedule: "* * * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: rules}
        spec:
          restartPolicy: Never
          containers:
            - name: engine
              image: aiops-engine
              args: ['detector', 'rules', '--config', 'configs/baseline/rules.yaml']
              envFrom:
                - configMapRef: {name: aiops-env}
                - secretRef: {name: aiops-secrets}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {memory: 1Gi}
              # 設定檔要蓋掉 image 裡的：打開 kustomization 的 aiops-configs，再把下面打開
              # volumeMounts: [{name: configs, mountPath: /app/configs/baseline/series.yaml, subPath: series.yaml}]
          # volumes: [{name: configs, configMap: {name: aiops-configs}}]
---
# 每分鐘看最近 10 分鐘；同一筆重跑會覆蓋
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-detect
  labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: detect}
spec:
  schedule: "* * * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: detect}
        spec:
          restartPolicy: Never
          containers:
            - name: engine
              image: aiops-engine
              args: ['detector', 'detect', '--config', 'configs/baseline/series.yaml', '--window', '10m']
              envFrom:
                - configMapRef: {name: aiops-env}
                - secretRef: {name: aiops-secrets}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {memory: 1Gi}
              # 設定檔要蓋掉 image 裡的：打開 kustomization 的 aiops-configs，再把下面打開
              # volumeMounts: [{name: configs, mountPath: /app/configs/baseline/series.yaml, subPath: series.yaml}]
          # volumes: [{name: configs, configMap: {name: aiops-configs}}]
---
# 合成一件、根因分析、相似事故、LLM、心跳
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-alert
  labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: alert}
spec:
  schedule: "* * * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: alert}
        spec:
          restartPolicy: Never
          containers:
            - name: engine
              image: aiops-engine
              args: ['investigator', 'alert', '--config', 'configs/rca/rca.yaml']
              envFrom:
                - configMapRef: {name: aiops-env}
                - secretRef: {name: aiops-secrets}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {memory: 1Gi}
              # 設定檔要蓋掉 image 裡的：打開 kustomization 的 aiops-configs，再把下面打開
              # volumeMounts: [{name: configs, mountPath: /app/configs/baseline/series.yaml, subPath: series.yaml}]
          # volumes: [{name: configs, configMap: {name: aiops-configs}}]
---
# 每天學過去 4 週
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-train
  labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: train}
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: train}
        spec:
          restartPolicy: Never
          containers:
            - name: engine
              image: aiops-engine
              args: ['detector', 'train', '--config', 'configs/baseline/series.yaml']
              envFrom:
                - configMapRef: {name: aiops-env}
                - secretRef: {name: aiops-secrets}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {memory: 4Gi}
              # 設定檔要蓋掉 image 裡的：打開 kustomization 的 aiops-configs，再把下面打開
              # volumeMounts: [{name: configs, mountPath: /app/configs/baseline/series.yaml, subPath: series.yaml}]
          # volumes: [{name: configs, configMap: {name: aiops-configs}}]
