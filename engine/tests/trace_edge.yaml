# tests/trace_quality_edge_e2e.py 用：跟 configs/baseline/trace.yaml 一樣，只有點的粒度改 1 分鐘、學 40 分鐘就用
traces_index: traces-generic.otel-*
interval: 1m
sample_per_bucket: 20
min_requests: 5
clock_skew_ms: 500
sample_policy: random
rules: {repeated_calls: 20, swallowed_rate: 0.05}
train: {timezone: Asia/Taipei, min_weeks: 2, min_days: 3, min_points: 15}
detect: {z: 5, rel_floor: 0.1}
metrics:
  calls:      {direction: both, min_abs: 0.5}
  time_ms:    {direction: up,   min_abs: 20}
  error_rate: {direction: up,   min_abs: 0.05}
  swallowed_rate: {direction: up, min_abs: 0.05}
