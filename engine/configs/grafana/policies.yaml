# 依 dept 送到哪個 contact point（dept 清單跟 telemetry/groups.yaml 一致）；沒有 dept 的（資料品質、節點）送平台
apiVersion: 1
policies:
  - orgId: 1
    receiver: platform
    group_by: [alert_id]        # 一件一則：AIOps 已經依服務合併過，這裡不要再依 dept、service 合併
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: it-oncall
        object_matchers: [[source, "=", aiops], [dept, "=~", "D3120|D3130"]]
      - receiver: imc-oncall
        object_matchers: [[source, "=", aiops], [dept, "=~", "D1110|D1120"]]
      # 夜間只發 critical：加一條 mute_time_intervals，掛在 severity="warning" 的子路由上（例子見 Grafana 文件 mute timings）
