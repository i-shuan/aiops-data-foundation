# GitLab CI：各元件分開部署，每個資料夾自己一份 .gitlab-ci.yml，這裡只負責串起來
# （docs/pdca/phase1-collect/2026-11-gitlab-ci.md）。
#
# 每個 job 都是手動觸發（when: manual），而且只有該資料夾有改動才會出現在 pipeline 裡，互不影響。
# 在 GitLab 的 Settings → CI/CD → Variables 設各元件要的變數（機密的勾 Masked、Protected；檔案勾 Type: File），
# 每個資料夾的 .gitlab-ci.yml 開頭列了它要哪些。
#
# 流程（ES、AIOps、Grafana 在同一個 cluster；收值是公司現有的 Elastic APM，不在這個 repo）：
#   es-setup：在 ES／AIOps cluster 裡用 Job（elasticsearch/setup-helmchart）跑 elasticsearch-setup.sh，Runner 不用連 ES。
#             key 不經過 CI：Job 直接寫進 aiops/aiops-secrets、grafana/grafana-env，2 把都存一份在 es-setup/es-setup-keys。
#             只在第一次部署、改了 elasticsearch/code/、要換 key 時跑（每次發 key 都是新的、舊的不作廢）。
#   deploy-aiops-engine、deploy-grafana：不碰 key（Job 已經寫好）。
# 詳細：docs/pdca/phase1-collect/2026-11-es-setup-helm-job.md

stages:
  - test
  - es-setup
  - build
  - deploy

include:
  - local: elasticsearch/.gitlab-ci.yml
  - local: aiops-engine/.gitlab-ci.yml
  - local: grafana/.gitlab-ci.yml
