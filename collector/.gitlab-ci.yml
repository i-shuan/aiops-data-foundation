# collector：每個應用 cluster 部署一套 OTel Collector（collector/helmchart、設定檔在 collector/code/）。
#
# 變數：
#   KUBE_CONFIG_COLLECTOR      （Type: File）這個 cluster 的 kubeconfig
#   COLLECTOR_CLUSTER_NAME     這個 cluster 的名字（每筆資料的 k8s.cluster.name，每個 cluster 不一樣）
#   COLLECTOR_IMAGE            Nexus 的 image 路徑，例如 nexus.example.internal/otel/opentelemetry-collector-contrib
#   ES_URL                     公司 ES 的網址
#   NTP_SERVER                 公司的 NTP，例如 ntp.example.internal:123
#
#   KUBE_CONFIG_AIOPS          （Type: File）ES、AIOps 那個 cluster 的 kubeconfig：從那裡的 es-setup/es-setup-keys 讀寫入 key
#
# 寫入 key：Collector 跟應用在同一個 cluster，跟 ES／AIOps 不同 cluster，es-setup 的 Job 寫不到這裡。每次部署從
# es-setup-keys 讀出寫入 key，寫進這個 cluster 的 otel-collector/es-writer-keys（server-side apply；換 key 後重跑這個 job 就同步，
# Collector 自己換 key、不用重啟）。es-setup-keys 還沒有（還沒跑過 es-setup）就不動、沿用現有的。
# 一個 job 部署一個 cluster。有好幾個 cluster：複製這個 job（job 名、KUBE_CONFIG_COLLECTOR、COLLECTOR_CLUSTER_NAME 換掉），
# 或在 GitLab 畫面用不同的變數值各跑一次。

deploy-collector:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3.15
    entrypoint: [""]
  script:
    - |
      writer="$(KUBECONFIG="${KUBE_CONFIG_AIOPS}" kubectl -n es-setup get secret es-setup-keys -o jsonpath='{.data.writer}' 2>/dev/null || true)"
      export KUBECONFIG="${KUBE_CONFIG_COLLECTOR}"
      kubectl get namespace otel-collector >/dev/null 2>&1 || kubectl create namespace otel-collector
      if [ -n "${writer}" ]; then
        printf '%s' "${writer}" | base64 -d > writer.key
        kubectl -n otel-collector create secret generic es-writer-keys --from-file=ES_WRITER_API_KEY=writer.key --dry-run=client -o yaml \
          | kubectl apply --server-side --force-conflicts --field-manager=ci -f - >/dev/null
        rm -f writer.key
        echo "寫入 key 從 es-setup-keys 同步到 otel-collector/es-writer-keys（不印出）"
      else
        echo "讀不到 es-setup/es-setup-keys（還沒跑 es-setup？）：不動 es-writer-keys"
      fi
      helm upgrade --install collector collector/helmchart -n otel-collector \
        --set clusterName="${COLLECTOR_CLUSTER_NAME}" --set esEndpoint="${ES_URL}" --set ntpServer="${NTP_SERVER}" \
        --set image.repository="${COLLECTOR_IMAGE}" \
        --set-file config.common=collector/code/common.yaml,config.node=collector/code/node.yaml,config.cluster=collector/code/cluster.yaml
    - kubectl -n otel-collector rollout status daemonset/otel-node-collector --timeout=300s
    - kubectl -n otel-collector rollout status deployment/otel-cluster-collector --timeout=300s
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - collector/**/*
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
