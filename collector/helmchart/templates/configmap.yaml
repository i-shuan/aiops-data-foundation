{{- include "collector.config" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  common.yaml: |
{{ .Values.config.common | indent 4 }}
  node.yaml: |
{{ .Values.config.node | indent 4 }}
  cluster.yaml: |
{{ .Values.config.cluster | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-env
data:
  CLUSTER_NAME: {{ .Values.clusterName | quote }}
  ES_ENDPOINT: {{ .Values.esEndpoint | quote }}
  NTP_SERVER: {{ .Values.ntpServer | quote }}
