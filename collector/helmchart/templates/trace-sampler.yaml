# 第二層 trace-sampler（尾端取樣，設定在 sampler.yaml）：StatefulSet ＋ headless Service，
# node Collector 的 loadbalancing exporter 用 DNS 解析出每一台的 IP，依 trace_id 分配。
# 擴縮、重開時依 trace_id 的分配會變，那幾十秒內正在等的 trace 可能被拆到兩台、決定不完整。
apiVersion: v1
kind: Service
metadata:
  name: trace-sampler-headless
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: trace-sampler}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trace-sampler
  labels: {app.kubernetes.io/name: trace-sampler}
spec:
  serviceName: trace-sampler-headless
  replicas: {{ .Values.traceSampler.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: trace-sampler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: trace-sampler}
      annotations:
        {{- include "collector.checksums" . | nindent 8 }}
    spec:
      securityContext: {fsGroup: 10001}   # PVC 要讓 Collector（uid 10001）寫得進去
      containers:
        - name: otelcol
          image: {{ include "collector.image" . }}
          args:
            - --config=/conf/sampler.yaml
            # 每一段記下是哪一條規則讓它留下（tailsampling.policy），trace baseline 只用 random 那份
            - --feature-gates=processor.tailsamplingprocessor.recordpolicy
          envFrom:
            - configMapRef: {name: otel-collector-env}
          env:
            - {name: DECISION_WAIT, value: {{ .Values.traceSampler.decisionWait | quote }}}
            - {name: NUM_TRACES, value: {{ .Values.traceSampler.numTraces | quote }}}
            - {name: EXPECTED_TPS, value: {{ .Values.traceSampler.expectedTps | quote }}}
            - {name: RANDOM_PCT, value: {{ .Values.traceSampler.randomPct | quote }}}
            - {name: SLOW_MS, value: {{ .Values.traceSampler.slowMs | quote }}}
            - {name: GOMEMLIMIT, value: {{ .Values.traceSampler.goMemLimit | quote }}}
          ports:
            - {name: health, containerPort: 13133}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: metrics, containerPort: 8888}
          readinessProbe:
            httpGet: {path: /, port: health}
          resources:
            {{- toYaml .Values.traceSampler.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf}
            - {name: es-keys, mountPath: /etc/es-keys, readOnly: true}
            - {name: queue, mountPath: /var/lib/otelcol}   # 送 ES 的佇列（sampler.yaml 的 file_storage）
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
        - name: es-keys
          secret: {secretName: {{ .Values.esWriterSecret }}}
  # 每台 trace-sampler 自己一顆磁碟放送 ES 的佇列：Pod 重啟、搬到別的節點都還在。
  # 大小：佇列上限 10,000 批，每批約幾十 KB，1Gi 夠
  volumeClaimTemplates:
    - metadata: {name: queue}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.traceSampler.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.traceSampler.storage }}}}
