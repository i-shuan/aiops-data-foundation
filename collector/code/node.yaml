# 每個節點一個（DaemonSet）：
#   metrics：kubelet 的節點、Pod、容器資源用量，以及這個節點上應用自己吐的 Prometheus metrics
#   log：這個節點上所有容器的 log
#   trace：這個節點上的應用用 OTLP 送來的（Service otel-node-collector，只連到同一個節點的 Collector）
# 跟 common.yaml、aiops.yaml 一起載入：這裡的 pipeline 引用 aiops.yaml 定義的 processor（java-http、cumulativetodelta、
# hist-sum、exceptions），AIOps 專屬的 receiver、processor、metrics/cadvisor、metrics/ntp 都在 aiops.yaml。

receivers:
  kubeletstats:
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_IP}:10250
    insecure_skip_verify: true   # kubelet 憑證通常是自簽的；正式環境若有 CA 改成驗證
    collection_interval: 30s
    metric_groups: [node, pod, container]

  # 應用的 metrics：只抓這個節點上、Pod 標註 prometheus.io/scrape: "true" 的
  prometheus:
    config:
      scrape_configs:
        - job_name: pods
          scrape_interval: 30s
          kubernetes_sd_configs:
            - role: pod
              selectors:
                - role: pod
                  field: spec.nodeName=${env:K8S_NODE_NAME}
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: (.+);(\d+)
              replacement: $$1:$$2
              target_label: __address__

  # 容器的 log
  file_log:
    include: [/var/log/pods/*/*/*.log]
    # 不收自己的 log：ES 拒收時 Collector 會印錯誤，收回來再送一次就是放大迴圈
    exclude: [/var/log/pods/otel-collector_*/*/*.log]
    # 只在第一次啟動時有用：已經存在的檔從尾巴開始讀；之後發現的新檔從頭讀
    start_at: end
    include_file_path: true
    poll_interval: 200ms
    # 讀到檔案哪裡記在節點上（file_storage），重啟後接著讀
    storage: file_storage
    # 後面塞住時（佇列滿）先停止讀檔，不是丟掉
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0
    operators:
      # 解析 containerd / docker 的 log 格式、接回被切開的長行、從檔名補 namespace、Pod、容器
      - type: container
        id: container-parser

  # 應用的 trace（OpenTelemetry Java agent 等）。app-common chart 會把應用指到這裡
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 擋冒充：trace 是應用自己送的，資源欄位應用可以亂填。拿掉所有能決定「屬於哪個 Pod、哪個部門」的欄位，
  # 讓 k8s_attributes 一定依連線的來源 IP 判斷是哪個 Pod
  transform/traces-pre:
    error_mode: ignore
    trace_statements:
      - delete_matching_keys(resource.attributes, "^(k8s\\.|container\\.|data_stream\\.)")
      - delete_key(resource.attributes, "dept")
      - delete_key(resource.attributes, "group")
      - delete_matching_keys(span.attributes, "^data_stream\\.")

  # 應用用 OTLP 推來的 metrics（.NET 自動埋點：它的 Prometheus 端點只聽 localhost，Collector 抓不到）。
  # 跟 trace 一樣擋冒充：拿掉應用自填的 K8s、部門欄位，k8s_attributes 一定依連線的來源 IP 判斷是哪個 Pod
  transform/metrics-otlp-pre:
    error_mode: ignore
    metric_statements:
      - delete_matching_keys(resource.attributes, "^(k8s\\.|container\\.|data_stream\\.)")
      - delete_key(resource.attributes, "dept")
      - delete_key(resource.attributes, "group")
      - delete_key(datapoint.attributes, "dept")
      - delete_key(datapoint.attributes, "group")
      - delete_matching_keys(datapoint.attributes, "^data_stream\\.")

  # 應用用 OTLP 推來的 log：跟 trace 一樣擋冒充
  transform/logs-otlp-pre:
    error_mode: ignore
    log_statements:
      - delete_matching_keys(resource.attributes, "^(k8s\\.|container\\.|data_stream\\.)")
      - delete_key(resource.attributes, "dept")
      - delete_key(resource.attributes, "group")

  k8s_attributes:
    filter:
      node_from_env_var: K8S_NODE_NAME   # 只看自己節點上的 Pod，省記憶體

# trace 跟 log、metrics 一樣直接寫 ES（common.yaml 的 elasticsearch/es）：每一段一筆、100% 收、不取樣。
# 合成一個請求一筆由 engine 的 detector trace-merge 在 ES 端做（docs/pdca/phase1-collect/2026-10-trace-merge.md）
service:
  pipelines:
    metrics/in:
      receivers: [kubeletstats, prometheus]
      processors: [memory_limiter, transform/pre, metricstransform/java-http, transform/java-http, cumulativetodelta, transform/hist-sum, k8s_attributes, transform/group, transform/drop-log-attrs]
      exporters: [elasticsearch/es]
    metrics/otlp:
      receivers: [otlp]
      processors: [memory_limiter, transform/metrics-otlp-pre, k8s_attributes, transform/group, transform/drop-log-attrs, cumulativetodelta, transform/hist-sum]
      exporters: [elasticsearch/es]
    logs/in:
      receivers: [file_log]
      processors: [memory_limiter, k8s_attributes, transform/group]
      exporters: [elasticsearch/es]
    # 應用用 OTLP 直接送來的 log（app-common chart 的 otel.logs.exporter: otlp）：agent 送的 log record 本身就帶 trace_id、span_id，
    # 不靠 log 的輸出格式有沒有印 MDC。應用的 log pattern 是自己的純文字、沒印 trace_id 時走這條就綁得起來
    # （docs/pdca/phase1-collect/2026-10-ingest-keys-check.md）。跟 trace 一樣擋冒充：拿掉自帶的 K8s、部門欄位，依連線來源補
    logs/otlp:
      receivers: [otlp]
      processors: [memory_limiter, transform/logs-otlp-pre, k8s_attributes, transform/group]
      exporters: [elasticsearch/es]
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, transform/traces-pre, transform/exceptions, k8s_attributes, transform/group, transform/drop-log-attrs]
      exporters: [elasticsearch/es]
