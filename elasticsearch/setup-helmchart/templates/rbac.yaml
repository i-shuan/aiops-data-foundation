{{- if .Values.esSetup.enabled }}
# Job 要寫 Secret：自己 namespace 的 es-setup-keys，加上 targets 裡每個 namespace（只給 Secret 的 get、create、patch）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: es-setup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: es-setup-secrets
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, create, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: es-setup-secrets
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: es-setup-secrets}
subjects:
  - {kind: ServiceAccount, name: es-setup, namespace: {{ .Release.Namespace }}}
{{- range $name, $t := .Values.targets }}
{{- if and $t.enabled (ne $t.namespace $.Release.Namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: es-setup-secrets
  namespace: {{ $t.namespace }}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, create, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: es-setup-secrets
  namespace: {{ $t.namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: es-setup-secrets}
subjects:
  - {kind: ServiceAccount, name: es-setup, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
{{- end }}
