# elasticsearch：把結構、權限套上公司的 ES，發 4 把 API key（elasticsearch/code/scripts/elasticsearch-setup.sh）。
#
# 變數：
#   ES_URL     公司 ES 的網址，例如 https://es.example.internal:9200
#   ES_AUTH    有 manage_security 權限的帳號，帳號:密碼（Masked、Protected）
#   選填：SNAPSHOT_REPO_TYPE、SNAPSHOT_REPO_SETTINGS（要備份才給，見 elasticsearch/README.md）
#
# key 不印進 log：寫在 keys/（writer、engine、grafana、probe 是 key 本身；collector-values.yaml、engine-values.yaml、
# grafana-values.yaml 是 chart 的 values），放 artifact 1 小時，給同一條 pipeline 後面的部署 job 用。
# 健康檢查 key（keys/probe）要放進 ES 前面的 LB：從這個 artifact 手動取，不經過其他 job。

es-setup:
  stage: es-setup
  image: alpine:3.20
  when: manual
  variables:
    KEYS_OUT_DIR: keys
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - mkdir -p "${KEYS_OUT_DIR}" && chmod 700 "${KEYS_OUT_DIR}"
    - bash elasticsearch/code/scripts/elasticsearch-setup.sh
  artifacts:
    paths:
      - keys/
    expire_in: 1 hour
    access: developer          # artifact 裡有 API key：只有 Developer 以上下載（GitLab 16.11 以上；更舊的版本把專案設成只有成員可見）
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - elasticsearch/code/**/*
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"       # 沒改檔、只想重跑（例如換 key）：在 GitLab 畫面 Run pipeline
      when: manual
