# ES 前面的 LB 健康檢查範例（HAProxy）。重點只有一個：**用 API key 打 GET /、等 200**。
#
# 為什麼：ES 剛起來的 1 秒多（HTTP 已開、.security index 還沒恢復），API key 會被拒（401），
# 但 elastic 帳號能登入、/_cluster/health 也回 200（status red）。Collector 收到 401 會當成「key 錯了」、
# 不重試直接丟資料（磁碟佇列也救不了）。健康檢查用 elastic 帳號或 /_cluster/health 會在這 1 秒把流量導進去。
# 實測（docs/pdca/phase1-collect/2026-10-es-startup-401.md）：直連 ES 重啟一次掉 420 個 trace；經這份設定掉 0。
# 兩台 ES 滾動重啟也會有窗口（投票名單只有一台，重啟到它叢集就沒 master、活著那台也 401）；三台以上才能一台一台重啟不中斷。
# 不管幾台，健康檢查都要用 API key：兩台實測，舊檢查滾動重啟掉 200～280、一起重啟掉 540；這份設定都是 0。
#
# 用 elasticsearch-setup.sh 發的「健康檢查 key」（es-probe，只能 GET /）。K8s 裡沒有 LB 的話，
# 等價做法是 ES Pod 的 readinessProbe 用同一把 key（e2e/k8s/elasticsearch.yaml）。
resolvers dns
  parse-resolv-conf
  hold valid 1s
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
frontend es_in
  bind :9200
  default_backend es_nodes
backend es_nodes
  option httpchk
  http-check send meth GET uri / hdr Authorization "ApiKey ${ES_PROBE_API_KEY}"
  http-check expect status 200
  # 每 0.5 秒檢查；1 次失敗就移出、連續 2 次成功才加回來；主機名重新解析（ES 換 IP 時跟得上）
  default-server inter 500ms fall 1 rise 2 resolvers dns resolve-prefer ipv4 init-addr last,libc,none
  server es1 elasticsearch-0.example.internal:9200 check
  server es2 elasticsearch-1.example.internal:9200 check
