# 保留天數（docs/retention.md）。改這裡、重跑 elasticsearch-setup.sh 就生效。
# - 天數從「換到下一個 index（rollover）」那一刻起算；rollover 每天一次，所以實際最多多留約 1 天。
# - 已經存在的資料也會套用：還沒進入的階段一定用新的天數；正在進行中的階段，ES 能安全更新的會更新，不行的照舊走完。

# metrics：原始 30 秒一點 → 降成 5 分鐘 → 降成 1 小時 → 刪
METRICS_DOWNSAMPLE_5M_AFTER=14d
METRICS_DOWNSAMPLE_1H_AFTER=90d
METRICS_DELETE_AFTER=400d
# metrics 裡應用的直方圖（metrics-generic.otel-*：請求耗時、GC 時間）：不降解析度，原始 30 秒一點留到刪。
# ES 8.19 的 histogram 欄位降解析度時不合併、只留一筆的值，請求數、p95 會錯；baseline 要讀過去 4 週。
# 原始資料比降解析度的大很多（低流量服務約每天 92MB），所以比其他 metrics 短
METRICS_HIST_DELETE_AFTER=90d

# log 原文（k8s-*）
LOGS_DELETE_AFTER=30d
# log 統計（aiops-log-stats：每 5 分鐘、每個服務 × level × error.type 的筆數）
LOG_STATS_DELETE_AFTER=400d

# trace：100% 收、不取樣（製造業的事故檢討不能少資料）。
# raw（traces-generic.otel-*，Collector 寫的每一段一筆）只是合成前的暫存
TRACES_RAW_DELETE_AFTER=2d
# merged（traces-merged-*，一個請求一筆）：事故檢討要看的在這裡
TRACES_DELETE_AFTER=7d

# rollover：每天、或主分片超過這個大小就換一個 index
ROLLOVER_MAX_AGE=1d
ROLLOVER_MAX_SIZE=50gb
