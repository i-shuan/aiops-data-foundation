# 保留天數。改這裡、重跑 elasticsearch-setup.sh 就生效。
# Elastic APM 寫的 traces-apm*、logs-apm*、metrics-apm* 的保留是公司 ES 自己的 ILM，不在這裡。
# 天數從「換到下一個 index（rollover）」那一刻起算；rollover 每天一次，所以實際最多多留約 1 天。

# trace merged（traces-merged-*，一個請求一筆，engine 的 trace-merge 從 traces-apm-* 合成）：事故檢討要看的在這裡。
# 100% 收、不取樣（製造業的事故檢討不能少資料）；APM 的 raw 要多久由公司 ES 決定，merged 比 raw 長才有意義
TRACES_DELETE_AFTER=7d

# AIOps 自己寫的索引（aiops-*）：
# - 衍生資料的保留天數不在這裡，在 aiops-engine/code/configs/baseline/prune.yaml（detector prune 每天刪；一般索引不能用 ILM）
# - 人工判斷（aiops-incidents、aiops-feedback、aiops-tuning）不刪，只備份：每天一次 snapshot（SLM 政策 aiops-daily），
#   留 SNAPSHOT_KEEP 天。儲存庫要先有：跑 setup 時給 SNAPSHOT_REPO_TYPE（fs、s3、azure…）與 SNAPSHOT_REPO_SETTINGS（JSON），
#   沒給就跳過 snapshot 這段（儲存庫類型與位置由管 ES 的人決定）
SNAPSHOT_INDICES=aiops-incidents,aiops-feedback,aiops-tuning,aiops-baseline,aiops-alerts
SNAPSHOT_KEEP=30d
SNAPSHOT_SCHEDULE="0 30 3 * * ?"
