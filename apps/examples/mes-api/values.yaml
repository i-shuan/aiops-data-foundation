# 應用團隊只需要填這一份。不需要知道 tenant、group、token。

app:
  name: mes-api        # 服務名稱，上線後不要改
  partOf: mes          # 所屬系統
  component: api       # api / web / worker / batch / gateway

image:
  repository: nexus.aillm.spil.com.tw/docker/mes/mes-api
  tag: "2.3.1"         # 版本號，不能用 latest

replicas: 2

ports:
  http: 8080
  metrics: 9464        # OpenTelemetry Prometheus exporter 的預設 port

probes:
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

# Java 服務：用 OpenTelemetry Java agent，程式不用改就會輸出標準 metrics，並把 trace_id 寫進 log
otel:
  javaAgent:
    enabled: true
    image: nexus.aillm.spil.com.tw/docker/open-telemetry/autoinstrumentation-java:2.10.0
  # .NET 服務：javaAgent 關掉、開這個；OpenTelemetry 在程式裡設定，/metrics 開在 9464（見 docs/dotnet.md）
  # dotnet:
  #   enabled: true
  # trace 取樣比例（0～1）。預設 1.0 全部記；請求量大的服務可以調低，例如 0.1
  # traces:
  #   sampleRatio: 0.1

# log 格式。照 Java 標準（logback JSON）輸出就不用填；其他格式填名稱，例如 logfmt、secs。
# 沒有對應解析規則的格式，log 仍會完整收進去，只是不拆欄位。
# logFormat: logfmt

# 應用自己的環境變數
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
