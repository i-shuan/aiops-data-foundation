# cluster 那一份收集程式：整個 cluster 一個。
#   - 抓有標註 prometheus.io/scrape 的 pod 吐的數值
#   - K8s 回報的狀態：節點是不是 Ready、容器重啟幾次、pod 的階段
#
# 部門只認 namespace 的門牌。這份裡有幾個地方改錯了不會報錯，資料只是安靜地掉或進錯地方，
# 都標了 ⚠。tests/validate.sh 會擋下這些修改。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-cluster-collector
  namespace: obs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-cluster-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, endpoints, services, replicationcontrollers, resourcequotas, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-cluster-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-cluster-collector
subjects:
  - kind: ServiceAccount
    name: otel-cluster-collector
    namespace: obs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-cluster-collector
  namespace: obs
data:
  config.yaml: |
    extensions:
      # 送不到的資料排在這裡。目錄掛在 PVC 上，收集程式重啟也還在
      file_storage:
        directory: /var/lib/otelcol/queue
        create_directory: true

    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: pods
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: (.+);(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
      k8s_cluster:
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure]

    processors:
      # K8s 回報的狀態很多，只留看健康度要的
      filter/k8s:
        error_mode: ignore
        metrics:
          include:
            match_type: regexp
            metric_names:
              - k8s\.node\.condition.*
              - k8s\.container\.restarts
              - k8s\.container\.ready
              - k8s\.pod\.phase

      # Elasticsearch 的寫入程式不收「累計」的分布圖（處理時間就是這種），會整個丟掉、只留一行警告。
      # ⚠ 先換成「這段時間內的增量」。拿掉這一段，處理時間就不會進 Elasticsearch。
      cumulative_to_delta:
        include:
          metric_types: [histogram]

      # ⚠ 先清掉程式可能自己帶進來的身分欄位，再把抓取對象的位址放進 k8s.pod.ip。
      #   沒有 k8s.pod.ip，下一步讀門牌時對不到是哪個 pod，所有資料都會變成 DEFAULT_TENANT。
      transform/pre:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "tenant")
              - delete_key(resource.attributes, "dept")
              - delete_key(resource.attributes, "system")
              - delete_key(resource.attributes, "site")
              - delete_key(resource.attributes, "cluster")
              - delete_key(resource.attributes, "ns.tenant")
              - delete_key(resource.attributes, "ns.dept")
              - delete_key(resource.attributes, "ns.system")
              - delete_key(resource.attributes, "data_stream.namespace")
              - set(resource.attributes["k8s.pod.ip"], resource.attributes["server.address"]) where resource.attributes["k8s.pod.uid"] == nil and resource.attributes["server.address"] != nil
              - set(resource.attributes["k8s.pod.ip"], resource.attributes["net.host.name"]) where resource.attributes["k8s.pod.uid"] == nil and resource.attributes["k8s.pod.ip"] == nil and resource.attributes["net.host.name"] != nil

      # 讀 pod 所在 namespace 的門牌
      k8s_attributes:
        auth_type: serviceAccount
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name]
          labels:
            - tag_name: ns.tenant
              key: tenant
              from: namespace
            - tag_name: ns.dept
              key: dept
              from: namespace
            - tag_name: ns.system
              key: system
              from: namespace

      # ⚠ 部門怎麼定。順序不能換：
      #   1. 丟掉樣本自己帶的 tenant / site（程式自稱的不算數）
      #   2. 先一律當成 DEFAULT_TENANT
      #   3. 沒有 namespace、只有節點的，是 server 的資料 → SERVER_TENANT
      #   4. namespace 的門牌在清單裡 → 照門牌
      #   5. 最後才決定資料流：data_stream.namespace = tenant
      transform/tenant:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - delete_key(datapoint.attributes, "tenant")
              - delete_key(datapoint.attributes, "site")
              - delete_key(datapoint.attributes, "cluster")
              - delete_key(datapoint.attributes, "data_stream.namespace")
          - context: resource
            statements:
              - set(resource.attributes["tenant"], "${env:DEFAULT_TENANT}")
              - set(resource.attributes["tenant"], "${env:SERVER_TENANT}") where resource.attributes["k8s.namespace.name"] == nil and resource.attributes["k8s.node.name"] != nil
              - set(resource.attributes["tenant"], resource.attributes["ns.tenant"]) where resource.attributes["ns.tenant"] != nil and IsMatch(resource.attributes["ns.tenant"], "^(${env:ALLOWED_TENANTS})$")
              - set(resource.attributes["dept"], resource.attributes["ns.dept"]) where resource.attributes["ns.dept"] != nil
              - set(resource.attributes["system"], resource.attributes["ns.system"]) where resource.attributes["ns.system"] != nil
              - set(resource.attributes["site"], "${env:SITE}")
              - set(resource.attributes["cluster"], "${env:CLUSTER}")
              - set(resource.attributes["data_stream.namespace"], resource.attributes["tenant"])

    exporters:
      elasticsearch:
        endpoints: ["${env:ES_ENDPOINT}"]
        user: ${env:ES_USER}
        password: ${env:ES_PASSWORD}
        mapping:
          mode: otel
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 100000
        # ⚠ max_retries 寫 0 是「不重試」：Elasticsearch 一連不上資料就直接丟掉，不報錯（實測過）。
        #   給一個很大的數字、間隔最長 30 秒，等於一直重試到連上為止。
        retry:
          enabled: true
          max_retries: 100000
          initial_interval: 1s
          max_interval: 30s

      # 第二座 Elasticsearch：佔位，沒有啟用。
      # 要啟用時：拿掉註解、在 otel-site 加 ES_ENDPOINT_2、在 Secret 加第二座的帳密，
      # 再把 elasticsearch/second 加進下面每條 pipeline 的 exporters。
      # ⚠ 不要用假的位址啟用它：收集程式會一直重試，佇列越積越多。
      # elasticsearch/second:
      #   endpoints: ["${env:ES_ENDPOINT_2}"]
      #   user: ${env:ES_USER_2}
      #   password: ${env:ES_PASSWORD_2}
      #   mapping:
      #     mode: otel
      #   sending_queue:
      #     enabled: true
      #     storage: file_storage
      #     queue_size: 100000
      #   retry:
      #     enabled: true
      #     max_retries: 100000
      #     initial_interval: 1s
      #     max_interval: 30s

    service:
      extensions: [file_storage]
      pipelines:
        metrics/apps:
          receivers: [prometheus]
          processors: [cumulative_to_delta, transform/pre, k8s_attributes, transform/tenant]
          exporters: [elasticsearch]
        metrics/k8s:
          receivers: [k8s_cluster]
          processors: [filter/k8s, transform/pre, k8s_attributes, transform/tenant]
          exporters: [elasticsearch]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: otel-cluster-collector
  namespace: obs
spec:
  serviceName: otel-cluster-collector
  replicas: 1
  selector:
    matchLabels:
      app: otel-cluster-collector
  template:
    metadata:
      labels:
        app: otel-cluster-collector
    spec:
      serviceAccountName: otel-cluster-collector
      securityContext:
        fsGroup: 10001
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          envFrom:
            - configMapRef:
                name: otel-common
            - configMapRef:
                name: otel-site
          env:
            - name: ES_USER
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: password
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: queue
              mountPath: /var/lib/otelcol
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: conf
          configMap:
            name: otel-cluster-collector
  # ⚠ 佇列要放 PVC。換成 emptyDir 的話收集程式一重啟，排隊中的資料就沒了，不報錯
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
