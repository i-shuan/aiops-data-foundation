# 節點那一份收集程式：每個節點一個。
#   - server 本身：CPU、記憶體、負載、磁碟、網路 → 一律標成 SERVER_TENANT
#   - 每個 pod、每個容器用了多少 CPU 與記憶體 → 照它所在 namespace 的門牌
#   - 每個容器印的 log → 照它所在 namespace 的門牌
#   - 程式送來的 trace → 照它所在 namespace 的門牌。程式是從哪個 pod 連進來的，由收集程式自己認
#
# 標籤的規則跟 cluster 那一份一樣：transform/pre、transform/tenant 與 exporters 這幾段
# 兩份要一字不差，tests/validate.sh 會比對。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-node-collector
  namespace: obs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-node-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  # 向 kubelet 要每個 pod、每個容器的資源用量
  - apiGroups: [""]
    resources: [nodes/stats, nodes/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-node-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-node-collector
subjects:
  - kind: ServiceAccount
    name: otel-node-collector
    namespace: obs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-node-collector
  namespace: obs
data:
  config.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        create_directory: true

    receivers:
      host_metrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
          memory:
          load:
          # ⚠ 預設只回報「實體磁碟」。根目錄是 overlay 的節點（k3d 就是）會一筆都沒有，不報錯。
          #   所以連虛擬的也看，再用類型與掛載點把每個容器自己的那些濾掉。
          filesystem:
            include_virtual_filesystems: true
            include_fs_types:
              match_type: strict
              fs_types: [ext4, xfs, overlay]
            exclude_mount_points:
              match_type: regexp
              mount_points:
                - /run/.*
                - /var/lib/kubelet/pods/.*
                - /var/lib/docker/.*
                - /var/lib/containerd/.*
                - /etc/(hostname|hosts|resolv\.conf)
          network:
      kubelet_stats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      # 程式送 trace 進來的入口。自動埋點（platform/otel/instrumentation.yaml）會送到這裡
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

      # 節點上每個容器的 log 檔。路徑裡就有 namespace、pod、容器的名稱
      file_log:
        include:
          - /hostfs/var/log/pods/*/*/*.log
        # ⚠ 收集程式自己的不收。它每送一批就會印 log，收了等於自己餵自己，越印越多
        exclude:
          - /hostfs/var/log/pods/obs_otel-*/*/*.log
        include_file_path: true
        # 第一次到一個節點時，節點上已經有的 log 也讀。之後靠下面的 storage 記住讀到哪
        start_at: beginning
        # ⚠ 讀到哪要記在磁碟上。拿掉的話收集程式一重啟就從頭重讀，每一行 log 都會重複一次
        storage: file_storage
        operators:
          # 拆掉容器執行環境加在每行前面的時間與來源，並從路徑取出是哪個 pod
          - type: container
          # 整行是 JSON 的拆成欄位；不是的原樣留著，照樣送
          - type: json_parser
            if: body matches "^\\s*\\{"
            parse_from: body
            parse_to: attributes
            on_error: send_quiet

    processors:
      # server 自己的數值沒有帶節點名稱，補上。有了它，下面才會被判成 server 的資料
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert

      # 每支程式的欄位名稱不一樣，只統一兩個：等級與訊息。其餘照程式自己取的名字
      transform/logfields:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(log.attributes["level"], log.attributes["log.level"]) where log.attributes["level"] == nil and log.attributes["log.level"] != nil
              - set(log.attributes["message"], log.attributes["msg"]) where log.attributes["message"] == nil and log.attributes["msg"] != nil
              - set(log.severity_text, ConvertCase(log.attributes["level"], "upper")) where IsString(log.attributes["level"])
              - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where IsMatch(log.severity_text, "^(DEBUG|TRACE)$")
              - set(log.severity_number, SEVERITY_NUMBER_INFO) where IsMatch(log.severity_text, "^(INFO|NOTICE)$")
              - set(log.severity_number, SEVERITY_NUMBER_WARN) where IsMatch(log.severity_text, "^(WARN|WARNING)$")
              - set(log.severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(log.severity_text, "^(ERROR|ERR)$")
              - set(log.severity_number, SEVERITY_NUMBER_FATAL) where IsMatch(log.severity_text, "^(FATAL|CRITICAL|PANIC)$")

      # ⚠ 先清掉可能被帶進來的身分欄位。這一段要跟 cluster 那一份一樣
      transform/pre:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "tenant")
              - delete_key(resource.attributes, "dept")
              - delete_key(resource.attributes, "system")
              - delete_key(resource.attributes, "site")
              - delete_key(resource.attributes, "cluster")
              - delete_key(resource.attributes, "ns.tenant")
              - delete_key(resource.attributes, "ns.dept")
              - delete_key(resource.attributes, "ns.system")
              - delete_key(resource.attributes, "data_stream.namespace")
              - set(resource.attributes["k8s.pod.ip"], resource.attributes["server.address"]) where resource.attributes["k8s.pod.uid"] == nil and resource.attributes["server.address"] != nil
              - set(resource.attributes["k8s.pod.ip"], resource.attributes["net.host.name"]) where resource.attributes["k8s.pod.uid"] == nil and resource.attributes["k8s.pod.ip"] == nil and resource.attributes["net.host.name"] != nil

        log_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "tenant")
              - delete_key(resource.attributes, "dept")
              - delete_key(resource.attributes, "system")
              - delete_key(resource.attributes, "site")
              - delete_key(resource.attributes, "cluster")
              - delete_key(resource.attributes, "ns.tenant")
              - delete_key(resource.attributes, "ns.dept")
              - delete_key(resource.attributes, "ns.system")
              - delete_key(resource.attributes, "data_stream.namespace")
              - set(resource.attributes["k8s.pod.ip"], resource.attributes["server.address"]) where resource.attributes["k8s.pod.uid"] == nil and resource.attributes["server.address"] != nil
              - set(resource.attributes["k8s.pod.ip"], resource.attributes["net.host.name"]) where resource.attributes["k8s.pod.uid"] == nil and resource.attributes["k8s.pod.ip"] == nil and resource.attributes["net.host.name"] != nil

        # trace 是程式自己送來的，連「我是哪個 pod」都是它自己說的。全部丟掉，
        # 改用連線的來源位址去對是哪個 pod（下面 k8s_attributes 的第三種對法）
        trace_statements:
          - context: resource
            statements:
              - delete_key(resource.attributes, "tenant")
              - delete_key(resource.attributes, "dept")
              - delete_key(resource.attributes, "system")
              - delete_key(resource.attributes, "site")
              - delete_key(resource.attributes, "cluster")
              - delete_key(resource.attributes, "ns.tenant")
              - delete_key(resource.attributes, "ns.dept")
              - delete_key(resource.attributes, "ns.system")
              - delete_key(resource.attributes, "data_stream.namespace")
              - delete_key(resource.attributes, "k8s.pod.uid")
              - delete_key(resource.attributes, "k8s.pod.ip")
              - delete_key(resource.attributes, "k8s.pod.name")
              - delete_key(resource.attributes, "k8s.namespace.name")
              - delete_key(resource.attributes, "k8s.node.name")
              - delete_key(resource.attributes, "k8s.deployment.name")
      # 讀 pod 所在 namespace 的門牌。只看這個節點上的 pod
      k8s_attributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          # trace 用：前兩種都沒有的時候，看這筆資料是從哪個位址連進來的
          - sources:
              - from: connection
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name]
          labels:
            - tag_name: ns.tenant
              key: tenant
              from: namespace
            - tag_name: ns.dept
              key: dept
              from: namespace
            - tag_name: ns.system
              key: system
              from: namespace

      # ⚠ 部門怎麼定。順序不能換，這一段要跟 cluster 那一份一樣
      transform/tenant:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - delete_key(datapoint.attributes, "tenant")
              - delete_key(datapoint.attributes, "site")
              - delete_key(datapoint.attributes, "cluster")
              - delete_key(datapoint.attributes, "data_stream.namespace")
          - context: resource
            statements:
              - set(resource.attributes["tenant"], "${env:DEFAULT_TENANT}")
              - set(resource.attributes["tenant"], "${env:SERVER_TENANT}") where resource.attributes["k8s.namespace.name"] == nil and resource.attributes["k8s.node.name"] != nil
              - set(resource.attributes["tenant"], resource.attributes["ns.tenant"]) where resource.attributes["ns.tenant"] != nil and IsMatch(resource.attributes["ns.tenant"], "^(${env:ALLOWED_TENANTS})$")
              - set(resource.attributes["dept"], resource.attributes["ns.dept"]) where resource.attributes["ns.dept"] != nil
              - set(resource.attributes["system"], resource.attributes["ns.system"]) where resource.attributes["ns.system"] != nil
              - set(resource.attributes["site"], "${env:SITE}")
              - set(resource.attributes["cluster"], "${env:CLUSTER}")
              - set(resource.attributes["data_stream.namespace"], resource.attributes["tenant"])
        log_statements:
          - context: log
            statements:
              - delete_key(log.attributes, "tenant")
              - delete_key(log.attributes, "site")
              - delete_key(log.attributes, "cluster")
              - delete_key(log.attributes, "data_stream.namespace")
          - context: resource
            statements:
              - set(resource.attributes["tenant"], "${env:DEFAULT_TENANT}")
              - set(resource.attributes["tenant"], "${env:SERVER_TENANT}") where resource.attributes["k8s.namespace.name"] == nil and resource.attributes["k8s.node.name"] != nil
              - set(resource.attributes["tenant"], resource.attributes["ns.tenant"]) where resource.attributes["ns.tenant"] != nil and IsMatch(resource.attributes["ns.tenant"], "^(${env:ALLOWED_TENANTS})$")
              - set(resource.attributes["dept"], resource.attributes["ns.dept"]) where resource.attributes["ns.dept"] != nil
              - set(resource.attributes["system"], resource.attributes["ns.system"]) where resource.attributes["ns.system"] != nil
              - set(resource.attributes["site"], "${env:SITE}")
              - set(resource.attributes["cluster"], "${env:CLUSTER}")
              - set(resource.attributes["data_stream.namespace"], resource.attributes["tenant"])
        trace_statements:
          - context: span
            statements:
              - delete_key(span.attributes, "tenant")
              - delete_key(span.attributes, "site")
              - delete_key(span.attributes, "cluster")
              - delete_key(span.attributes, "data_stream.namespace")
          - context: resource
            statements:
              - set(resource.attributes["tenant"], "${env:DEFAULT_TENANT}")
              - set(resource.attributes["tenant"], "${env:SERVER_TENANT}") where resource.attributes["k8s.namespace.name"] == nil and resource.attributes["k8s.node.name"] != nil
              - set(resource.attributes["tenant"], resource.attributes["ns.tenant"]) where resource.attributes["ns.tenant"] != nil and IsMatch(resource.attributes["ns.tenant"], "^(${env:ALLOWED_TENANTS})$")
              - set(resource.attributes["dept"], resource.attributes["ns.dept"]) where resource.attributes["ns.dept"] != nil
              - set(resource.attributes["system"], resource.attributes["ns.system"]) where resource.attributes["ns.system"] != nil
              - set(resource.attributes["site"], "${env:SITE}")
              - set(resource.attributes["cluster"], "${env:CLUSTER}")
              - set(resource.attributes["data_stream.namespace"], resource.attributes["tenant"])

    exporters:
      elasticsearch:
        endpoints: ["${env:ES_ENDPOINT}"]
        user: ${env:ES_USER}
        password: ${env:ES_PASSWORD}
        mapping:
          mode: otel
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 100000
        # ⚠ max_retries 寫 0 是「不重試」：Elasticsearch 一連不上資料就直接丟掉，不報錯（實測過）。
        #   給一個很大的數字、間隔最長 30 秒，等於一直重試到連上為止。
        retry:
          enabled: true
          max_retries: 100000
          initial_interval: 1s
          max_interval: 30s

    service:
      extensions: [file_storage]
      pipelines:
        metrics/host:
          receivers: [host_metrics]
          processors: [transform/pre, resource/node, transform/tenant]
          exporters: [elasticsearch]
        metrics/kubelet:
          receivers: [kubelet_stats]
          processors: [transform/pre, k8s_attributes, transform/tenant]
          exporters: [elasticsearch]
        logs/containers:
          receivers: [file_log]
          processors: [transform/logfields, transform/pre, k8s_attributes, transform/tenant]
          exporters: [elasticsearch]
        traces/apps:
          receivers: [otlp]
          processors: [transform/pre, k8s_attributes, transform/tenant]
          exporters: [elasticsearch]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-collector
  namespace: obs
spec:
  selector:
    matchLabels:
      app: otel-node-collector
  template:
    metadata:
      labels:
        app: otel-node-collector
    spec:
      serviceAccountName: otel-node-collector
      # 要讀主機的 /proc、/sys 與磁碟，也要寫主機上的佇列目錄，所以用 root
      securityContext:
        runAsUser: 0
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          envFrom:
            - configMapRef:
                name: otel-common
            - configMapRef:
                name: otel-site
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ES_USER
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: password
          ports:
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: conf
          configMap:
            name: otel-node-collector
        - name: hostfs
          hostPath:
            path: /
        # ⚠ 佇列放在節點的磁碟上。換成 emptyDir 的話 pod 一重建，排隊中的資料就沒了
        - name: queue
          hostPath:
            path: /var/lib/otelcol-node
            type: DirectoryOrCreate
---
# 程式送 trace 的位址。
# ⚠ internalTrafficPolicy: Local：只轉給「送的那個 pod 所在節點」上的收集程式。
#   拿掉的話會被轉到別的節點，那一個收集程式只認得自己節點上的 pod，對不到，trace 全部變成預設的部門。
apiVersion: v1
kind: Service
metadata:
  name: otel-node-collector
  namespace: obs
spec:
  selector:
    app: otel-node-collector
  internalTrafficPolicy: Local
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
