# 自動埋點的設定。要先裝 OpenTelemetry Operator（指令見 .agents/project/commands.md）。
#
# app 在 pod 上加一個標註，Operator 就會在 pod 啟動時把埋點塞進去，image 不用改：
#   instrumentation.opentelemetry.io/inject-python: "otel-collector/python"
# 目前只有 Python 的。其他語言各加一段（java、dotnet、nodejs），標註的名字也跟著換。
#
# ⚠ 自動埋點只認得常見的框架。不認得的那一段不會有 trace，也不會報錯。
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: python
  namespace: otel-collector
spec:
  # 送給節點那一份收集程式。這個 Service 只會轉給同一個節點上的那一個
  exporter:
    endpoint: http://otel-node-collector.otel-collector.svc:4318
  propagators:
    - tracecontext
    - baggage
  # 這一步全收。要抽樣時改這裡
  sampler:
    type: parentbased_always_on
  python:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      # 只要 trace。數值由收集程式去抓、log 由收集程式讀檔，不走這條路
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
      # 健康檢查每幾秒打一次，不記
      - name: OTEL_PYTHON_EXCLUDED_URLS
        value: healthz,readyz
