# VMAgent 共用 values（remoteWrite 目標等共用設定）
# externalLabels.cluster 由 applicationsets/cluster-addons/applicationset.yaml 的
# helm.parameters 根據 list generator 的 {{ .cluster }} 自動注入。
#
# ──────────────────────────────────────────────────────────────
# 這份是在原始模板上加了「同 cluster 內分流」所需的東西，
# 只動了下面幾個區塊，其他原封不動：
#
#   1. vmagent.spec.scrapeClasses       新增。抓取時把 namespace 的 dept / tenant / system label 帶進資料
#   2. vmagent.spec.inlineRelabelConfig  新增。送出前依 tenant 填 vm_account_id（租戶對照表在這裡）
#   3. vmagent.spec.remoteWrite          兩條：中科站、二林站各一條，都寫 multitenant 端點
#   4. vmagent.spec.statefulMode 等      新增。送不到時排隊的資料放 PVC，vmagent 重啟也不會消失
#   5. kube-state-metrics                新增 metricLabelsAllowlist
#
# 這份每個 cluster 都一樣。廠區（site）每個 cluster 不同，另外疊一個小檔：
#   -f platform/victoriametrics/vmstack-values.yaml -f platform/victoriametrics/site-ctsp.yaml      （二林的 cluster 用 site-erlin.yaml）
# 沒疊的話樣本上不會有 site，而且不報錯。
#
# 整條資料流見 README.md。
#
# ⚠ 套之前先 kubectl get storageclass：要有預設的 StorageClass，而且給得出 50Gi。
#   沒有的話 vmagent 的 PVC 會卡在 Pending，vmagent 起不來，整個 cluster 的 metrics 會停。
# ⚠ 上線順序：先把 vmauth-token 這個 Secret 建好兩個 key（ctsp、erlin，兩座各發給這個 cluster 的那一把），再套這份。
#   順序反過來的話 vmagent 找不到 key，remoteWrite 起不來，整個 cluster 的 metrics 會停。
#   token 結尾多一個換行就會一直 401，錯誤訊息不會說原因：kubectl describe secret 看 byte 數。
# ⚠ 改完不會馬上生效：operator 更新設定後，vmagent 要等 kubelet 同步（最多一分鐘左右）才重新載入。
#   實際載入的規則看 vmagent 的 /remotewrite-relabel-config。
# ⚠ CRD 沒帶 schema，欄位打錯不會報錯，只會靜默失效。
# ──────────────────────────────────────────────────────────────

global:
  image:
    registry: nexus.aillm.spil.com.tw/docker
    imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: nexus-devops-secret

grafana:
  enabled: false

alertmanager:
  enabled: false

vmalert:
  enabled: false

syncJob:
  enabled: false

victoria-metrics-operator:
  enabled: true
  # 注意：原始模板這裡的縮排有問題，requests / limits 跟 resources 同層，
  # 等於 resources 是空的、operator 實際上沒有吃到任何 requests/limits。
  # 下面是修正後的縮排。
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  rbac:
    create: true
    namespaced: false

defaultRules:
  create: false

vmsingle:
  enabled: false

vmcluster:
  enabled: false

vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s

    externalLabels:
      {} # cluster 由 ApplicationSet 的 helm.parameters 注入；site 由 platform/victoriametrics/site-<廠區>.yaml 疊上來

    # ── 送不到時排隊的資料放哪 ────────────────────────────────
    # 每個目的地各有一個佇列，一座停機不影響另一座。恢復後自動補送。
    # statefulMode 讓 vmagent 變成 StatefulSet 並掛 PVC：不開的話佇列在 pod 裡，
    # vmagent 一重啟（升級、OOM、節點搬移）排隊中的資料就沒了，而且不報錯。
    #
    # 大小怎麼定：maxDiskUsagePerURL ÷ 每小時的暫存量 = 那個目的地撐得住的小時數。
    #   每小時的暫存量要在該 cluster 量：停掉一個目的地一段時間，看
    #   vmagent_remotewrite_pending_data_bytes 每小時長多少。20GiB 是起始值，目標撐 8 小時。
    # ⚠ 超過上限時最舊的資料會被丟掉，不報錯。
    # ⚠ PVC 要裝得下兩個目的地的上限加起來。tests/validate.sh 會檢查。
    statefulMode: true
    statefulStorage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi
    remoteWriteSettings:
      maxDiskUsagePerURL: 20GiB

    # ── 抓取：把 namespace 的 label 貼到每一筆資料上 ─────────
    # 這些 label 由 ArgoCD（platform/argocd/applicationset.yaml）或 chart 自己的 namespace.yaml
    # 依 app/<app>/k8s/values.yaml 貼到 namespace 上。vmagent 只讀 namespace 的 label，
    # 不知道 values.yaml 的存在，也不維護任何 app、namespace 清單。
    scrapeClasses:
      - name: default
        default: true
        attachMetadata:
          namespace: true
        relabelConfigs:
          # dept：這份資料是誰的（歸屬）。
          - source_labels: [__meta_kubernetes_namespace_label_dept]
            target_label: dept
          # tenant：這份資料寫進哪個租戶。一個 namespace 只有一個。
          - source_labels: [__meta_kubernetes_namespace_label_tenant]
            target_label: tenant
          # 沒貼 tenant 的 namespace 在這裡就補成 platform，讓每個 target 都有 tenant。
          # ⚠ 這條不能省。target 沒有 tenant 的話，app 自己吐的 tenant="tsid" 會被原樣留下，
          #   接著被下面的對照換成 1001，等於任何 pod 都能寫進別人的租戶，而且不報錯。
          #   target 有 tenant 時，app 自己吐的會被改名成 exported_tenant。
          # ⚠ regex 寫 ^$，不要寫空字串：空字串若被當成沒寫，預設是「全部符合」，
          #   每個租戶都會被改成 platform。
          - source_labels: [tenant]
            regex: "^$"
            target_label: tenant
            replacement: platform
          # system 只是分析用的維度，不影響寫進哪個租戶。
          # namespace 沒標的話不會產生這個 label（不是 system=""）。
          - source_labels: [__meta_kubernetes_namespace_label_system]
            target_label: system

    # ── 送出前：tenant → AccountID ────────────────────────────
    # 租戶對照只有這一份。tests/validate.sh 從這裡讀出允許的 tenant，不另外維護清單。
    # 新增租戶：在「兜底」那兩條前面加一條，AccountID 不能跟別人重複。
    #
    # 寫入走 multitenant 端點，vminsert 依每筆樣本的 vm_account_id 決定租戶。
    # vmauth 只驗 token，不檢查 vm_account_id，所以租戶隔離靠的是下面這幾條的順序：
    #   1. 先清掉進來的 vm_account_id / vm_project_id（app 自己吐的不算數）
    #   2. 依 tenant 填 vm_account_id
    #   3. 對不到的（打錯字、不在清單裡）tenant 和 vm_account_id 一起改成兜底
    # 順序錯了不會報錯，資料只是安靜地進到錯的租戶。
    inlineRelabelConfig:
      - action: labeldrop
        regex: vm_account_id|vm_project_id
      - source_labels: [tenant]
        regex: tsid
        target_label: vm_account_id
        replacement: "1001"
      - source_labels: [tenant]
        regex: bsid
        target_label: vm_account_id
        replacement: "1002"
      - source_labels: [tenant]
        regex: icsd
        target_label: vm_account_id
        replacement: "1003"
      - source_labels: [tenant]
        regex: imc
        target_label: vm_account_id
        replacement: "1004"
      # 兜底：node-exporter、kube-state-metrics、平台元件、沒貼或貼錯 tenant 的 namespace。
      # 這兩條要在最後，而且 tenant 那條要在前面（它看的是 vm_account_id 還是空的）。
      - source_labels: [vm_account_id]
        regex: "^$"
        target_label: tenant
        replacement: platform
      - source_labels: [vm_account_id]
        regex: "^$"
        target_label: vm_account_id
        replacement: "1000"

    # ── 寫出：兩條，中科站、二林站各一條 ───────────────────────
    # 同一份資料兩座都寫。任一座停機或跨廠網路斷掉時，另一座照常，斷的那條先排隊。
    #
    # ⚠ 兩個 url 都是佔位（.invalid 結尾，解析不到）。主機名稱與路徑待 Infra 確認，
    #   確認前不能上線：照這份套上去，兩條都送不出去。
    #   /insert/multitenant/prometheus/api/v1/write 是 vminsert 的標準路徑。
    # token 兩座各一把、每個 cluster 各一把：key 的名字就是目的地的廠區。
    #   兩座的 vmauth 各自發、各自撤銷，一座的 token 外洩不影響另一座。
    # 允許的廠區（platform/victoriametrics/site-*.yaml 可以寫的值）也是從這兩個 key 推出來的。
    remoteWrite:
      # 中科站
      - url: https://vmauth-ctsp.placeholder.invalid/insert/multitenant/prometheus/api/v1/write
        tlsConfig:
          insecureSkipVerify: true
        bearerTokenSecret:
          name: vmauth-token
          key: ctsp
      # 二林站
      - url: https://vmauth-erlin.placeholder.invalid/insert/multitenant/prometheus/api/v1/write
        tlsConfig:
          insecureSkipVerify: true
        bearerTokenSecret:
          name: vmauth-token
          key: erlin

kube-state-metrics:
  image:
    registry: nexus.aillm.spil.com.tw/docker
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.20.0
    pullPolicy: IfNotPresent
  # ── 新增 ──────────────────────────────────────────────
  metricLabelsAllowlist:
    # 查詢時把 pod 對回服務與版本。
    - pods=[app.kubernetes.io/name,app.kubernetes.io/version,app.kubernetes.io/part-of,app.kubernetes.io/component]
    # 讓 kube_namespace_labels 帶出 namespace 上的歸屬，AIOps 可以用它把資料對回部門。
    # 不影響分流。想知道哪些 namespace 掉進 fallback，查 kube_namespace_labels{label_tenant=""}。
    - namespaces=[dept,tenant,system]
  # ──────────────────────────────────────────────────────

prometheus-node-exporter:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux

  image:
    registry: nexus.aillm.spil.com.tw/docker
    repository: prometheus/node-exporter
    tag: v1.12.1
    pullPolicy: IfNotPresent
