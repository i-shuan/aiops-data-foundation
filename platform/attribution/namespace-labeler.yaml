# 每個 cluster 跑一份。定期依對照表把 dept / group 標到 namespace 上。
#
# 安裝前要先把腳本和對照表放進 ConfigMap（對照表維持 git 裡那三個檔案是唯一來源）：
#
#   kubectl -n vm-monitoring create configmap ns-labeler-script \
#     --from-file=label-namespaces.sh=platform/attribution/label-namespaces.sh \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n vm-monitoring create configmap ns-labeler-registry \
#     --from-file=platform/attribution/registry/ \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 正式環境由 CD 渲染這兩個 ConfigMap，改對照表 = 改 git = 下一輪自動生效。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ns-labeler
  namespace: vm-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ns-labeler
rules:
  # 只要得到 namespace 和改 namespace 的 label，不碰任何 namespace 裡面的東西。
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ns-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ns-labeler
subjects:
  - kind: ServiceAccount
    name: ns-labeler
    namespace: vm-monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ns-labeler
  namespace: vm-monitoring
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ns-labeler
          restartPolicy: Never
          containers:
            - name: labeler
              # 要用「有 shell」的映像。rancher/kubectl 只有 kubectl 一個執行檔，
              # 掛腳本進去會直接 StartError: exec "sh": executable file not found。
              image: alpine/k8s:1.30.0
              command: ["sh", "/script/label-namespaces.sh"]
              env:
                # kubectl 會想寫 ~/.kube/cache，根檔案系統唯讀時要指到可寫的地方。
                - name: HOME
                  value: /tmp
                # 解析 namespace 名稱用。新廠要在這裡加 cluster 代號。
                - name: CLUSTERS
                  value: "central zk el"
                - name: ENVS
                  value: "prod staging dev"
                # 先設 true 觀察一段時間，確認要動的都是預期內的再改 false。
                - name: DRY_RUN
                  value: "false"
              volumeMounts:
                - {name: script, mountPath: /script}
                - {name: registry, mountPath: /registry}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          volumes:
            - {name: script, configMap: {name: ns-labeler-script}}
            - {name: registry, configMap: {name: ns-labeler-registry}}
            - {name: tmp, emptyDir: {}}
