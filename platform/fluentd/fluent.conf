# 本機 k3d 實測通過的 Fluentd 設定（Fluentd v1.17、Elasticsearch 8.15.3 Basic）
#
# 注意：下面三處 ApiKey 用 #{ENV[...]} 的寫法「還沒驗證過」。
# custom_headers 的值是以 JSON 解析，不是雙引號字串，環境變數可能不會被展開。
# 實測時是把 key 直接寫在設定裡的。正式環境建議改成：
# 整份 fluent.conf 放 Secret（由 CD 渲染好真值），而不是 ConfigMap 加環境變數。
#
# 驗證結果與踩到的坑見 docs/efk.md。

<source>
  @type tail
  path /var/log/containers/*.log
  exclude_path ["/var/log/containers/fluentd*.log"]
  pos_file /var/log/fluentd-pos.log
  tag kube.*
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$/
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>

<filter kube.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

<filter kube.**>
  @type kubernetes_metadata
</filter>

<filter kube.**>
  @type record_transformer
  enable_ruby true
  <record>
    namespace ${record.dig("kubernetes","namespace_name")}
    pod       ${record.dig("kubernetes","pod_name")}
    container ${record.dig("kubernetes","container_name")}
    app       ${(record.dig("kubernetes","labels") || {})["app.kubernetes.io/name"]}
    version   ${(record.dig("kubernetes","labels") || {})["app.kubernetes.io/version"]}
    dept      ${((record.dig("kubernetes","namespace_labels") || {})["dept"]) || "unassigned"}
    system    ${((record.dig("kubernetes","namespace_labels") || {})["system"]) || "unknown"}
    cluster   zk
  </record>
  remove_keys kubernetes,docker,logtag,stream
</filter>

<match kube.**>
  @type rewrite_tag_filter
  <rule>
    key     dept
    pattern /^D3120$/
    tag     it.${tag}
  </rule>
  <rule>
    key     dept
    pattern /^D1110$/
    tag     imc.${tag}
  </rule>
  <rule>
    key     dept
    pattern /^.*$/
    tag     unassigned.${tag}
  </rule>
</match>

# group 直接取 tag 前綴，不另外維護對照表
<filter it.** imc.** unassigned.**>
  @type record_transformer
  enable_ruby true
  <record>
    group ${tag.split(".").first}
  </record>
</filter>

<match it.**>
  @type elasticsearch
  host elasticsearch.logging.svc
  port 9200
  scheme http
  custom_headers {"Authorization":"ApiKey #{ENV["IT_ES_API_KEY"]}"}
  logstash_format true
  logstash_prefix k8s-it
  suppress_type_name true
  verify_es_version_at_startup false
  default_elasticsearch_version 8
  <buffer>
    flush_interval 5s
  </buffer>
</match>

<match imc.**>
  @type elasticsearch
  host elasticsearch.logging.svc
  port 9200
  scheme http
  custom_headers {"Authorization":"ApiKey #{ENV["IMC_ES_API_KEY"]}"}
  logstash_format true
  logstash_prefix k8s-imc
  suppress_type_name true
  verify_es_version_at_startup false
  default_elasticsearch_version 8
  <buffer>
    flush_interval 5s
  </buffer>
</match>

<match unassigned.**>
  @type elasticsearch
  host elasticsearch.logging.svc
  port 9200
  scheme http
  custom_headers {"Authorization":"ApiKey #{ENV["UNASSIGNED_ES_API_KEY"]}"}
  logstash_format true
  logstash_prefix k8s-unassigned
  suppress_type_name true
  verify_es_version_at_startup false
  default_elasticsearch_version 8
  <buffer>
    flush_interval 5s
  </buffer>
</match>
