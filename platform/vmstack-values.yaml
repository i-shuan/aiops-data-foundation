# VMAgent 共用 values（remoteWrite 目標等共用設定）
# externalLabels.cluster 由 applicationsets/cluster-addons/applicationset.yaml 的
# helm.parameters 根據 list generator 的 {{ .cluster }} 自動注入。
#
# ──────────────────────────────────────────────────────────────
# 這份是在原始模板上加了「同 cluster 內分流」所需的東西，
# 只動了兩個區塊，其他原封不動：
#
#   1. vmagent.spec.scrapeClasses   新增。抓取時把 namespace 的 dept / group / system label 帶進資料
#   2. vmagent.spec.remoteWrite     從一條拆成三條，依 group 各自過濾、各自帶 token
#   3. kube-state-metrics           新增 metricLabelsAllowlist
#
# 整條資料流見 README.md。
#
# ⚠ 上線順序：先把 vmauth-token 這個 Secret 建好三個 key（it / imc / platform），再套這份。
#   順序反過來的話 vmagent 找不到 key，remoteWrite 起不來，整個 cluster 的 metrics 會停。
#   token 結尾多一個換行就會一直 401，錯誤訊息不會說原因：kubectl describe secret 看 byte 數。
# ⚠ 改完不會馬上生效：operator 更新設定後，vmagent 要等 kubelet 同步（最多一分鐘左右）才重新載入。
#   實際載入的規則看 vmagent 的 /remotewrite-url-relabel-config。
# ⚠ CRD 沒帶 schema，欄位打錯不會報錯，只會靜默失效。
# ──────────────────────────────────────────────────────────────

global:
  image:
    registry: nexus.aillm.spil.com.tw/docker
    imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: nexus-devops-secret

grafana:
  enabled: false

alertmanager:
  enabled: false

vmalert:
  enabled: false

syncJob:
  enabled: false

victoria-metrics-operator:
  enabled: true
  # 注意：原始模板這裡的縮排有問題，requests / limits 跟 resources 同層，
  # 等於 resources 是空的、operator 實際上沒有吃到任何 requests/limits。
  # 下面是修正後的縮排。
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  rbac:
    create: true
    namespaced: false

defaultRules:
  create: false

vmsingle:
  enabled: false

vmcluster:
  enabled: false

vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s

    externalLabels:
      {} # cluster 由 ApplicationSet 的 helm.parameters 注入

    # ── 新增 ──────────────────────────────────────────────
    # 抓取時把 namespace 的 label 貼到每一筆資料上。
    # 沒有這段，下面三條 remoteWrite 的過濾條件全部對不到東西，
    # 結果是 IT / IMC 兩條都送不出去，全部落到兜底那條。
    #
    # 這些 label 由 ArgoCD 依每個 app 的 applications/<app>/helm/values.yaml 貼到 namespace 上
    # （platform/applicationset.yaml）。vmagent 只讀 namespace 的 label，
    # 不知道 values.yaml 的存在，也不維護任何 app、namespace 或部門清單。
    scrapeClasses:
      - name: default
        default: true
        attachMetadata:
          namespace: true
        relabelConfigs:
          # dept：這份資料是誰的（歸屬）。只有一個值。
          - source_labels: [__meta_kubernetes_namespace_label_dept]
            target_label: dept
          # group：這份資料要送到哪些 tenant（誰看得到）。分流就是看這個。
          # 可以是單一值（it）也可以是多個，用點隔開（it.imc = 兩個都送）。
          - source_labels: [__meta_kubernetes_namespace_label_group]
            target_label: group
          # system 只是分析用的維度，不是分流依據，下面的 remoteWrite 不看它。
          # namespace 沒標的話這個值是空的，relabel 會直接不產生這個 label
          # （metrics 上是「沒有 system」，不是 unknown；log 那邊才填 unknown）。
          - source_labels: [__meta_kubernetes_namespace_label_system]
            target_label: system
    # ──────────────────────────────────────────────────────

    # ── 改動 ──────────────────────────────────────────────
    # 原本一條、一把 token，所以整個 cluster 的資料全進同一個 tenant。
    # 改成三條：vmagent 只抓一次，資料複製三份，每份各自過濾後帶自己的 token 送出。
    # tenant 由中央 vmauth 依 token 決定，這邊不碰 tenant 設計。
    #
    # 過濾依據是 group，不是 dept。原因：
    #   - 一個 namespace 只有一個 dept，依 dept 分就不可能「兩個 tenant 都送」。
    #   - 依 dept 分的話，部門清單要寫死在這裡，每次改組都要改這份、重啟 vmagent。
    #     依 group 分的話，這份裡沒有部門清單，部門進出都不用動。
    #
    # regex 寫法：'(.*\.)?it(\..*)?' 表示「group 以點切開後，其中一段是 it」。
    #   it       → 符合
    #   it.imc   → 符合
    #   imc      → 不符合
    # 不要寫成 'it'：那只認單一值，it.imc 會被 IT 漏掉。
    # 也不要寫成 '.*it.*'：那會把名字裡剛好含 it 的 group 也算進來。
    # YAML 用單引號、一個反斜線。從雙引號的範例 "(.*\\.)?it" 複製過來時要把反斜線減半，
    # 不然會變成比對字面上的反斜線，it.imc 又被 IT 漏掉，而且不會報錯。
    #
    # 允許寫哪些 group 也是從這裡推出來的：tests/validate.sh 讀這三條 remoteWrite，
    # 允許 it、imc、it.imc（順序照這裡）和 fallback 的 platform。
    #
    # 只有新增 tenant（中央多發一把 token）時才要改這份：多加一條 remoteWrite，
    # 並把名字加進兜底那條的 drop regex。
    remoteWrite:
      # IT
      - url: https://vmauth.aillm.spil.com.tw/prometheus/api/v1/write
        tlsConfig:
          insecureSkipVerify: true
        bearerTokenSecret:
          name: vmauth-token
          key: it
        inlineUrlRelabelConfig:
          - action: keep
            source_labels: [group]
            regex: '(.*\.)?it(\..*)?'
          # 存進 tenant 的 group 一律改成那個 tenant 的名字。
          # 共用的資料在 IT tenant 裡是 group=it、在 IMC tenant 裡是 group=imc。
          - target_label: group
            replacement: it

      # IMC
      - url: https://vmauth.aillm.spil.com.tw/prometheus/api/v1/write
        tlsConfig:
          insecureSkipVerify: true
        bearerTokenSecret:
          name: vmauth-token
          key: imc
        inlineUrlRelabelConfig:
          - action: keep
            source_labels: [group]
            regex: '(.*\.)?imc(\..*)?'
          - target_label: group
            replacement: imc

      # 兜底：node-exporter、kube-state-metrics、平台元件、還沒標 label 的 namespace。
      # 這條不能省，省了那些節點層級的資料會整批消失。
      # drop 的 regex 必須列出上面所有 tenant 的名字。
      # 漏一個的話，那個 tenant 的資料會同時進兜底，而且不會有錯誤訊息。
      - url: https://vmauth.aillm.spil.com.tw/prometheus/api/v1/write
        tlsConfig:
          insecureSkipVerify: true
        bearerTokenSecret:
          name: vmauth-token
          key: platform
        inlineUrlRelabelConfig:
          - action: drop
            source_labels: [group]
            regex: '(.*\.)?(it|imc)(\..*)?'
          - target_label: group
            replacement: platform
    # ──────────────────────────────────────────────────────

kube-state-metrics:
  image:
    registry: nexus.aillm.spil.com.tw/docker
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.20.0
    pullPolicy: IfNotPresent
  # ── 新增 ──────────────────────────────────────────────
  metricLabelsAllowlist:
    # 查詢時把 pod 對回服務與版本。
    - pods=[app.kubernetes.io/name,app.kubernetes.io/version,app.kubernetes.io/part-of,app.kubernetes.io/component]
    # 讓 kube_namespace_labels 帶出 namespace 上的歸屬，AIOps 可以用它把資料對回部門。
    # 不影響分流。想知道哪些 namespace 掉進 fallback，查 kube_namespace_labels{label_group=""}。
    - namespaces=[dept,group,system]
  # ──────────────────────────────────────────────────────

prometheus-node-exporter:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux

  image:
    registry: nexus.aillm.spil.com.tw/docker
    repository: prometheus/node-exporter
    tag: v1.12.1
    pullPolicy: IfNotPresent
