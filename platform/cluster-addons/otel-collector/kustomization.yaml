# 每個應用 cluster 一套 OpenTelemetry Collector，收 metrics、依 namespace 的 dept 分到各 group 的 data stream。
# 設計說明見 docs/metrics.md。
#
# 部署前要先有：
#   1. Secret es-writer-keys（跟 log 用同一組 key，由 platform/central/elasticsearch-setup.sh 產生）
#   2. 下面 otel-collector-env 的 CLUSTER_NAME、ES_ENDPOINT 改成實際值
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otel-collector
resources:
  - namespace.yaml
  - rbac.yaml
  - node-collector.yaml
  - cluster-collector.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - common.yaml
      - node.yaml
      - cluster.yaml
  - name: otel-collector-env
    literals:
      - CLUSTER_NAME=change-me
      - ES_ENDPOINT=https://elasticsearch.example.internal:9200
images:
  - name: otelcol
    newName: otel/opentelemetry-collector-contrib   # 換成 Nexus 的路徑
    newTag: 0.162.0
