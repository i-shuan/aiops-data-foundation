# 每個節點一個（DaemonSet）：
#   metrics：kubelet 的節點、Pod、容器資源用量，以及這個節點上應用自己吐的 Prometheus metrics
#   log：這個節點上所有容器的 log
#   trace：這個節點上的應用用 OTLP 送來的（Service otel-node-collector，只連到同一個節點的 Collector）
# 跟 common.yaml 一起載入。

receivers:
  kubeletstats:
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_IP}:10250
    insecure_skip_verify: true   # kubelet 憑證通常是自簽的；正式環境若有 CA 改成驗證
    collection_interval: 30s
    metric_groups: [node, pod, container]

  # 應用的 metrics：只抓這個節點上、Pod 標註 prometheus.io/scrape: "true" 的
  prometheus:
    config:
      scrape_configs:
        - job_name: pods
          scrape_interval: 30s
          kubernetes_sd_configs:
            - role: pod
              selectors:
                - role: pod
                  field: spec.nodeName=${env:K8S_NODE_NAME}
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: (.+);(\d+)
              replacement: $$1:$$2
              target_label: __address__

  # CPU 被限流（CFS throttling）：kubelet 的 stats 沒有，要從 kubelet 內建的 cAdvisor 抓。
  # Pod 設了 CPU limit 時，瞬間用量碰到上限就會被凍結到下一個 100ms，平均 CPU 看起來不高、延遲卻變長。
  # 只留兩個數字：總共幾個週期、其中幾個被限流（cAdvisor 一個節點有上千種指標，其他都不要）
  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 30s
          scheme: https
          metrics_path: /metrics/cadvisor
          tls_config: {insecure_skip_verify: true}   # 同 kubeletstats：kubelet 憑證通常是自簽的
          authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
          static_configs: [{targets: ["${env:K8S_NODE_IP}:10250"]}]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: container_cpu_cfs_(throttled_)?periods_total
              action: keep
            - source_labels: [container]           # Pod 層級的加總（container 空白或 POD）不要，只看各容器
              regex: (|POD)
              action: drop
            - regex: (id|image|name)                 # cgroup 路徑、image、容器 ID：值太多，不要
              action: labeldrop

  # 容器的 log
  file_log:
    include: [/var/log/pods/*/*/*.log]
    # 不收自己的 log：ES 拒收時 Collector 會印錯誤，收回來再送一次就是放大迴圈
    exclude: [/var/log/pods/otel-collector_*/*/*.log]
    # 只在第一次啟動時有用：已經存在的檔從尾巴開始讀；之後發現的新檔從頭讀
    start_at: end
    include_file_path: true
    poll_interval: 200ms
    # 讀到檔案哪裡記在節點上（file_storage），重啟後接著讀
    storage: file_storage
    # 後面塞住時（佇列滿）先停止讀檔，不是丟掉
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0
    operators:
      # 解析 containerd / docker 的 log 格式、接回被切開的長行、從檔名補 namespace、Pod、容器
      - type: container
        id: container-parser

  # 應用的 trace（OpenTelemetry Java agent 等）。app-common chart 會把應用指到這裡
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # cAdvisor 的資料是「節點」吐的，每一筆屬於哪個 Pod 寫在 namespace、pod、container 這三個 label。
  # 先依這三個 label 分組、搬到資源欄位，k8s_attributes 才能依 Pod 名稱補上部門、服務名稱
  groupbyattrs/cadvisor:
    keys: [namespace, pod, container]
  transform/cadvisor:
    error_mode: ignore
    metric_statements:
      - set(resource.attributes["k8s.namespace.name"], resource.attributes["namespace"])
      - set(resource.attributes["k8s.pod.name"], resource.attributes["pod"])
      - set(resource.attributes["k8s.container.name"], resource.attributes["container"])
      - delete_matching_keys(resource.attributes, "^(namespace|pod|container|service\\.name|service\\.instance\\.id|server\\..*|url\\.scheme|dept|group)$$")

  # 應用的直方圖（例如 Java agent 的 http.server.request.duration）是 Prometheus 格式，從應用啟動一直累加。
  # 換成「這次抓取比上次多了多少」，ES 才能直接加總任一段時間：每 5 分鐘幾個請求、p95 多少（AIOps baseline 用）。
  # 每個節點的 Collector 只抓自己節點的 Pod，同一條序列一定由同一個 Collector 算。
  # Collector 重啟後，每條序列的第一次抓取沒有「上一次」可以比，那一點會少掉（30 秒）。
  # 計數器（counter）不換：ES 存累加值也能算速率，不改原本的資料。
  cumulativetodelta:
    include:
      metric_types: [histogram]

  # log 與 trace 一批一批送，量大時才送得動
  batch:
    send_batch_size: 2000
    timeout: 1s

  # 擋冒充：trace 是應用自己送的，資源欄位應用可以亂填。拿掉所有能決定「屬於哪個 Pod、哪個部門」的欄位，
  # 讓 k8s_attributes 一定依連線的來源 IP 判斷是哪個 Pod
  transform/traces-pre:
    error_mode: ignore
    trace_statements:
      - delete_matching_keys(resource.attributes, "^(k8s\\.|container\\.|data_stream\\.)")
      - delete_key(resource.attributes, "dept")
      - delete_key(resource.attributes, "group")
      - delete_matching_keys(span.attributes, "^data_stream\\.")

  # 例外事件抄到 span 的屬性上：ES 的 OTLP 入口不存 span 的事件（實測），例外的種類、訊息會不見。
  # 抄上來之後，「吞掉的例外」（有例外事件、但 status 不是 ERROR、回 200）在 ES 裡才查得到（docs/trace/scenarios.md）。
  # 堆疊（exception.stacktrace）不抄：很長，要看細節用 trace_id 找 log。
  transform/exceptions:
    error_mode: ignore
    trace_statements:
      - set(span.attributes["exception.type"], spanevent.attributes["exception.type"]) where spanevent.name == "exception"
      - set(span.attributes["exception.message"], spanevent.attributes["exception.message"]) where spanevent.name == "exception"

  # 應用用 OTLP 推來的 metrics（.NET 自動埋點：它的 Prometheus 端點只聽 localhost，Collector 抓不到）。
  # 跟 trace 一樣擋冒充：拿掉應用自填的 K8s、部門欄位，k8s_attributes 一定依連線的來源 IP 判斷是哪個 Pod
  transform/metrics-otlp-pre:
    error_mode: ignore
    metric_statements:
      - delete_matching_keys(resource.attributes, "^(k8s\\.|container\\.|data_stream\\.)")
      - delete_key(resource.attributes, "dept")
      - delete_key(resource.attributes, "group")
      - delete_key(datapoint.attributes, "dept")
      - delete_key(datapoint.attributes, "group")
      - delete_matching_keys(datapoint.attributes, "^data_stream\\.")

  k8s_attributes:
    filter:
      node_from_env_var: K8S_NODE_NAME   # 只看自己節點上的 Pod，省記憶體

exporters:
  # trace 不直接寫 ES：依 trace_id 送到第二層 trace-sampler（尾端取樣，sampler.yaml）。同一個 trace 的每一段
  # （不同服務、不同節點送來的）都會到同一台，它等整個 trace 到齊再決定留不留，再依 group 寫進 ES。
  loadbalancing/traces:
    routing_key: traceID
    protocol:
      otlp:
        tls: {insecure: true}
        timeout: 10s
    resolver:
      dns:
        hostname: trace-sampler-headless.otel-collector.svc.cluster.local   # headless Service：解析出每一台的 IP
        port: "4317"
        interval: 5s
    # trace-sampler 重開、擴縮時，送不出去的先排隊、換到新的那台
    sending_queue: {enabled: true, queue_size: 10000}
    retry_on_failure: {enabled: true, max_elapsed_time: 120s}

connectors:
  # log 依 group 交給各自的出口，每筆只會符合一條
  routing/logs:
    default_pipelines: [logs/unassigned]
    table:
      - condition: resource.attributes["group"] == "it"
        pipelines: [logs/it]
      - condition: resource.attributes["group"] == "imc"
        pipelines: [logs/imc]

service:
  pipelines:
    metrics/in:
      receivers: [kubeletstats, prometheus]
      processors: [memory_limiter, transform/pre, cumulativetodelta, k8s_attributes, transform/group, transform/drop-log-attrs]
      exporters: [routing/group]
    metrics/otlp:
      receivers: [otlp]
      processors: [memory_limiter, transform/metrics-otlp-pre, k8s_attributes, transform/group, transform/drop-log-attrs, cumulativetodelta]
      exporters: [routing/group]
    metrics/cadvisor:
      receivers: [prometheus/cadvisor]
      processors: [memory_limiter, groupbyattrs/cadvisor, transform/cadvisor, k8s_attributes, transform/group, transform/drop-log-attrs]
      exporters: [routing/group]
    logs/in:
      receivers: [file_log]
      processors: [memory_limiter, k8s_attributes, transform/group, batch]
      exporters: [routing/logs]
    logs/it:
      receivers: [routing/logs]
      exporters: [otlp_http/it]
    logs/imc:
      receivers: [routing/logs]
      exporters: [otlp_http/imc]
    logs/unassigned:
      receivers: [routing/logs]
      exporters: [otlp_http/unassigned]
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, transform/traces-pre, transform/exceptions, k8s_attributes, transform/group, transform/drop-log-attrs, batch]
      exporters: [loadbalancing/traces]
