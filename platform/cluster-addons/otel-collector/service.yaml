# 應用送 trace 的入口。internalTrafficPolicy: Local：只連到同一個節點上的 Collector，
# 這樣 Collector 才能用連線的來源 IP 對到是哪個 Pod（它只認得自己節點上的 Pod），也不用跨節點。
apiVersion: v1
kind: Service
metadata:
  name: otel-node-collector
spec:
  selector:
    app.kubernetes.io/name: otel-node-collector
  internalTrafficPolicy: Local
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
