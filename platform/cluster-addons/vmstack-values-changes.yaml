# 要合併進現有 cluster-addons 的 vmstack（victoria-metrics-k8s-stack）values。
# 只列出要改的部分，其他設定維持原樣。
#
# vmagent 本身維持 enabled: true，分流靠 remoteWrite 拆成多條，見 docs/vmagent.md。
#
# 這一份是「每個 cluster 都一樣」的內容，只有 externalLabels.cluster 每廠不同。

vmagent:
  enabled: true
  spec:
    # 不要在這裡寫死 cluster。這份 values 是所有 cluster 共用的，
    # cluster 名字由 ArgoCD ApplicationSet 的 helm.parameters
    # 依 list generator 的 {{ .cluster }} 在部署時注入。
    # 寫死的話其他廠的資料會全部掛上錯誤的 cluster 名。
    externalLabels: {}

    # 抓取時把 namespace 的 dept label 帶進每一筆資料。
    # 沒有這段，下面的 remoteWrite 過濾條件全部對不到東西。
    scrapeClasses:
      - name: default
        default: true
        attachMetadata:
          namespace: true
        relabelConfigs:
          - source_labels: [__meta_kubernetes_namespace_label_dept]
            target_label: dept

    # 三條出口，各自過濾、各自帶 token。tenant 由中央 vmauth 依 token 決定。
    # 三段 regex 要從 platform/attribution/registry/groups.tsv 渲染，不要手寫。
    remoteWrite:
      - url: https://vmauth.aillm.spil.com.tw/prometheus/api/v1/write
        tlsConfig: {insecureSkipVerify: true}
        bearerTokenSecret: {name: vmauth-token, key: it}
        inlineUrlRelabelConfig:
          - action: keep
            source_labels: [dept]
            regex: "D3120|D3130"
          - target_label: group
            replacement: it

      - url: https://vmauth.aillm.spil.com.tw/prometheus/api/v1/write
        tlsConfig: {insecureSkipVerify: true}
        bearerTokenSecret: {name: vmauth-token, key: imc}
        inlineUrlRelabelConfig:
          - action: keep
            source_labels: [dept]
            regex: "D1110|D1120"
          - target_label: group
            replacement: imc

      # 兜底：node-exporter、平台元件、還沒標 label 的 namespace。
      # drop 的 regex 必須跟上面所有 keep 的 regex 完全對應，
      # 漏一個部門就變成那個部門的資料同時進兩個 tenant。
      - url: https://vmauth.aillm.spil.com.tw/prometheus/api/v1/write
        tlsConfig: {insecureSkipVerify: true}
        bearerTokenSecret: {name: vmauth-token, key: platform}
        inlineUrlRelabelConfig:
          - action: drop
            source_labels: [dept]
            regex: "D3120|D3130|D1110|D1120"
          - target_label: group
            replacement: platform

kube-state-metrics:
  metricLabelsAllowlist:
    # 給 kube-state-metrics 與 cadvisor 這類「關於 pod」的資料用，
    # 查詢時可以把 pod 對回服務與版本。
    - pods=[app.kubernetes.io/name,app.kubernetes.io/version,app.kubernetes.io/part-of,app.kubernetes.io/component]
    # 讓 kube_namespace_labels 帶出歸屬，AIOps 用它把資料對回部門，
    # K8s events 也要靠它補歸屬。label 名稱依實際採用的為準。
    # 另外，kube_namespace_labels{label_dept=""} 是「這個 namespace 沒有歸屬」的
    # 唯一告警來源，allowlist 漏設的話告警永遠不會響。見 docs/attribution.md。
    #
    # 另外確認 kube-state-metrics 的 VMServiceScrape 有開 honorLabels，
    # 沒開的話指標裡的 namespace 會被換成 KSM 自己的 namespace，告警會指錯對象。
    - namespaces=[dept,group]
