# 兩種 Collector 共用的部分：讀 namespace 的 dept、決定 group、依 group 寫進各自的 data stream。
# 節點那一份（node.yaml）與 cluster 那一份（cluster.yaml）都會一起載入這份，分部門的規則只有這一處。
#
# 資料流名稱：metrics-<來源>.otel-<group>，例如 metrics-kubeletstatsreceiver.otel-it。
# ES 9 內建的 metrics-otel@template（metrics-*.otel-*）會把它建成 time series data stream。

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # 送不出去的資料放在節點上，Collector 重啟或 ES 暫時連不上都不會掉
  file_storage:
    directory: /var/lib/otelcol-metrics
    create_directory: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # 擋冒充：應用自己帶的 dept、group 或指定 data stream 的欄位一律不算數，
  # 歸屬只看 namespace 的 dept label
  transform/pre:
    error_mode: ignore
    metric_statements:
      - delete_key(datapoint.attributes, "dept")
      - delete_key(datapoint.attributes, "group")
      - delete_key(datapoint.attributes, "data_stream.dataset")
      - delete_key(datapoint.attributes, "data_stream.namespace")
      - delete_key(resource.attributes, "dept")
      - delete_key(resource.attributes, "group")
      - delete_key(resource.attributes, "data_stream.dataset")
      - delete_key(resource.attributes, "data_stream.namespace")
      # Prometheus receiver 會把抓取工作的名稱（例如 pods）填進 service.name，不是應用的名稱。
      # 先清掉，下面 k8s_attributes 才會用 Pod 的 app.kubernetes.io/name 填（它不覆蓋已經有的值）
      - delete_key(resource.attributes, "service.name")
      # Prometheus 抓來的資料只知道 Pod 的 IP（server.address），補成 k8s.pod.ip 才對得到是哪個 Pod
      - set(resource.attributes["k8s.pod.ip"], resource.attributes["server.address"]) where resource.attributes["k8s.pod.ip"] == nil and resource.attributes["server.address"] != nil

  # 依「這筆資料屬於哪個 Pod」補上 K8s 資訊與 namespace 的 dept。
  # 重點：Pod 的 CPU、記憶體雖然是從節點的 kubelet 抓的，歸屬仍依那個 Pod 的 namespace，
  # 不會因為抓取對象是節點就被分到 unassigned。
  k8s_attributes:
    auth_type: serviceAccount
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
      labels:
        - tag_name: dept
          key: dept
          from: namespace
        # 服務身分：由 app-common chart 統一蓋的 label，跟 log 那邊的 service.* 對得上
        - tag_name: service.name
          key: app.kubernetes.io/name
          from: pod
        - tag_name: service.version
          key: app.kubernetes.io/version
          from: pod
        - tag_name: service.namespace
          key: app.kubernetes.io/part-of
          from: pod

  # dept → group。清單要跟 platform/groups.yaml、Fluent Bit 的分流規則一致。
  # 沒有 dept（例如節點本身的資料）或不在清單裡的，一律 unassigned。
  transform/group:
    error_mode: ignore
    metric_statements:
      - set(resource.attributes["group"], "unassigned")
      - set(resource.attributes["group"], "it") where resource.attributes["dept"] != nil and IsMatch(resource.attributes["dept"], "^(D3120|D3130)$")
      - set(resource.attributes["group"], "imc") where resource.attributes["dept"] != nil and IsMatch(resource.attributes["dept"], "^(D1110|D1120)$")
      - set(resource.attributes["data_stream.namespace"], resource.attributes["group"])
      - set(resource.attributes["k8s.cluster.name"], "${env:CLUSTER_NAME}")
      # Pod 沒有 app.kubernetes.io/name（沒套 app-common chart）的，退回用 Deployment 名稱
      - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil and resource.attributes["k8s.deployment.name"] != nil

connectors:
  # 依 group 交給各自的出口。每筆只會符合一條，不會送兩份
  routing/group:
    default_pipelines: [metrics/unassigned]
    table:
      - condition: resource.attributes["group"] == "it"
        pipelines: [metrics/it]
      - condition: resource.attributes["group"] == "imc"
        pipelines: [metrics/imc]

# 每個 group 一個出口、一把 key、一個獨立佇列：某把 key 失效只卡住那一條。
#
# ⚠ 用 OTLP 送到 ES 9 自己的 OTLP 入口（/_otlp/v1/metrics），不用 elasticsearch 寫入元件。
#   elasticsearch 寫入元件把「連線逾時、沒拿到 HTTP 回應」當成永久錯誤，不重試、直接丟掉；
#   實測 ES 停 3 分鐘，停機期間的 metrics 幾乎全掉（佇列有存，但沒有拿來重送）。
#   OTLP 寫入元件對任何暫時性錯誤（連不上、逾時、429、502～504）都重試，佇列放在節點上。
exporters:
  otlp_http/it:
    metrics_endpoint: ${env:ES_ENDPOINT}/_otlp/v1/metrics
    headers:
      Authorization: ApiKey ${env:IT_ES_API_KEY}
    timeout: 30s
    sending_queue: &queue
      enabled: true
      storage: file_storage
      queue_size: 10000
    # max_elapsed_time 0 = 一直重試到送成功為止。佇列滿了才會丟（見 queue_size）
    retry_on_failure: &retry
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0
  otlp_http/imc:
    metrics_endpoint: ${env:ES_ENDPOINT}/_otlp/v1/metrics
    headers:
      Authorization: ApiKey ${env:IMC_ES_API_KEY}
    timeout: 30s
    sending_queue: *queue
    retry_on_failure: *retry
  otlp_http/unassigned:
    metrics_endpoint: ${env:ES_ENDPOINT}/_otlp/v1/metrics
    headers:
      Authorization: ApiKey ${env:UNASSIGNED_ES_API_KEY}
    timeout: 30s
    sending_queue: *queue
    retry_on_failure: *retry

service:
  extensions: [health_check, file_storage]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics/it:
      receivers: [routing/group]
      exporters: [otlp_http/it]
    metrics/imc:
      receivers: [routing/group]
      exporters: [otlp_http/imc]
    metrics/unassigned:
      receivers: [routing/group]
      exporters: [otlp_http/unassigned]
