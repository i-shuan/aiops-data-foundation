apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-metrics
rules:
  # k8s_attributes：補 Pod 資訊、讀 namespace 的 dept
  # k8s_cluster：讀各種物件的狀態
  # prometheus：找要抓的 Pod
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, replicationcontrollers, resourcequotas, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  # kubeletstats：向 kubelet 要資源用量
  - apiGroups: [""]
    resources: [nodes/stats, nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-metrics
subjects:
  - kind: ServiceAccount
    name: otel-metrics
    namespace: otel-metrics
