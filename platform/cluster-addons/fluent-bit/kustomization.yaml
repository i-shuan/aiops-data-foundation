# 每個應用 cluster 一套 Fluent Bit，負責收 container log、依 namespace 的 dept 分流到各 group 的 index。
# 設計說明見 docs/elasticsearch.md。
#
# 部署前要先有：
#   1. Secret es-writer-keys（由 platform/central/elasticsearch-setup.sh 產生的 API key）
#   2. 下面 fluent-bit-env 的 CLUSTER_NAME、ES_HOST 改成實際值
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logging
resources:
  - namespace.yaml
  - rbac.yaml
  - daemonset.yaml
configMapGenerator:
  - name: fluent-bit-config
    files:
      - fluent-bit.yaml
  - name: fluent-bit-env
    literals:
      - CLUSTER_NAME=change-me        # 小寫，會變成 index 名稱的一部分：k8s-{group}-{cluster}
      - ES_HOST=elasticsearch.example.internal
      - ES_PORT=9200
      - ES_TLS=on
      - ES_TLS_VERIFY=on
images:
  - name: fluent-bit
    newName: cr.fluentbit.io/fluent/fluent-bit   # 換成 Nexus 的路徑
    newTag: 4.1.1                                # 最低 4.1：es output 從 4.1 才支援 http_api_key
