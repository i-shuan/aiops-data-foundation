# Fluent Bit 設定。原則：這裡只做「收」和「分流」，欄位整理一律交給中央 ES 的 k8s-logs pipeline，
# 規則要改時不用重新部署每個 cluster。

service:
  flush: 1
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  health_check: on
  # 送不出去的資料先落地，ES 停機或某把 key 失效時不會掉資料
  storage.path: /var/fluent-bit/state/flb-storage/
  storage.sync: normal
  storage.backlog.mem_limit: 50M

pipeline:
  inputs:
    - name: tail
      tag: kube.*
      path: /var/log/containers/*.log
      # 不收自己的 log：ES 拒收時 Fluent Bit 會印出錯誤，收回來再送一次就變成放大迴圈。
      # Fluent Bit 自己的狀態看 :2020 的 metrics。
      exclude_path: /var/log/containers/fluent-bit-*_logging_*.log
      multiline.parser: cri, docker
      db: /var/fluent-bit/state/tail.db
      skip_long_lines: on
      refresh_interval: 10
      storage.type: filesystem

  filters:
    - name: kubernetes
      match: kube.*
      merge_log: off            # 不在這裡拆 JSON，交給中央 pipeline
      keep_log: on
      labels: on                # pod label：服務名稱與版本來自 app-common chart
      annotations: off
      namespace_labels: on      # namespace label：dept 由此而來（3.x 以後才有）
      k8s-logging.exclude: on   # Pod 加 annotation fluentbit.io/exclude: "true" 可以不收
      buffer_size: 0

    - name: record_modifier
      match: kube.*
      record: cluster ${CLUSTER_NAME}

    # 分流：依序比對，第一條符合的就決定去向，所以不會一筆送兩個 group。
    # dept 清單要跟 platform/groups.yaml 一致；最後一條兜底，沒標 dept 或不在清單的都進 unassigned。
    - name: rewrite_tag
      match: kube.*
      rule:
        - $kubernetes_namespace['labels']['dept'] ^(D3120|D3130)$ group.it false
        - $kubernetes_namespace['labels']['dept'] ^(D1110|D1120)$ group.imc false
        - $kubernetes['namespace_name'] .* group.unassigned false
      emitter_name: route_by_group
      emitter_storage.type: filesystem

    - name: modify
      match: group.it
      add: group it
    - name: modify
      match: group.imc
      add: group imc
    - name: modify
      match: group.unassigned
      add: group unassigned

  # 每個 group 一條出口、一把 key、一個獨立的重試佇列：某把 key 失效只卡住那一條
  outputs:
    - name: es
      match: group.it
      index: k8s-it-${CLUSTER_NAME}
      http_api_key: ${IT_ES_API_KEY}
      host: ${ES_HOST}
      port: ${ES_PORT}
      tls: ${ES_TLS}
      tls.verify: ${ES_TLS_VERIFY}
      write_operation: create   # data stream 只接受 create
      suppress_type_name: on
      buffer_size: 512KB
      trace_error: off          # 排查 ES 拒收原因時才打開，會把整批資料印出來
      retry_limit: no_limits
      storage.total_limit_size: 2G

    - name: es
      match: group.imc
      index: k8s-imc-${CLUSTER_NAME}
      http_api_key: ${IMC_ES_API_KEY}
      host: ${ES_HOST}
      port: ${ES_PORT}
      tls: ${ES_TLS}
      tls.verify: ${ES_TLS_VERIFY}
      write_operation: create
      suppress_type_name: on
      buffer_size: 512KB
      trace_error: off
      retry_limit: no_limits
      storage.total_limit_size: 2G

    - name: es
      match: group.unassigned
      index: k8s-unassigned-${CLUSTER_NAME}
      http_api_key: ${UNASSIGNED_ES_API_KEY}
      host: ${ES_HOST}
      port: ${ES_PORT}
      tls: ${ES_TLS}
      tls.verify: ${ES_TLS_VERIFY}
      write_operation: create
      suppress_type_name: on
      buffer_size: 512KB
      trace_error: off
      retry_limit: no_limits
      storage.total_limit_size: 2G
