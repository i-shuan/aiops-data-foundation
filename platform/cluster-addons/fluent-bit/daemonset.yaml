apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists          # 每個節點都要收，包含 control plane
      containers:
        - name: fluent-bit
          image: fluent-bit
          args: ["-c", "/fluent-bit/etc/conf/fluent-bit.yaml"]
          envFrom:
            - configMapRef:
                name: fluent-bit-env
          env:
            # 每個 group 一把寫入 key，只能寫自己的 index
            - name: IT_ES_API_KEY
              valueFrom: {secretKeyRef: {name: es-writer-keys, key: IT_ES_API_KEY}}
            - name: IMC_ES_API_KEY
              valueFrom: {secretKeyRef: {name: es-writer-keys, key: IMC_ES_API_KEY}}
            - name: UNASSIGNED_ES_API_KEY
              valueFrom: {secretKeyRef: {name: es-writer-keys, key: UNASSIGNED_ES_API_KEY}}
          ports:
            - name: metrics           # /api/v2/metrics/prometheus，看每條出口的重試與丟棄
              containerPort: 2020
          livenessProbe:
            httpGet: {path: /, port: metrics}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: metrics}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/conf}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: state, mountPath: /var/fluent-bit/state}
      volumes:
        - name: config
          configMap: {name: fluent-bit-config}
        - name: varlog
          hostPath: {path: /var/log}
        # 讀取位置與送不出去的資料放在節點上，Pod 重啟或 ES 暫時連不上都不會掉資料
        - name: state
          hostPath: {path: /var/fluent-bit/state, type: DirectoryOrCreate}
