# 對照表。registry/*.tsv 是唯一來源，改 git 就等於改設定。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ns-labeler.name" . }}-registry
  labels:
    {{- include "ns-labeler.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "registry/*.tsv" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ns-labeler.name" . }}-script
  labels:
    {{- include "ns-labeler.labels" . | nindent 4 }}
data:
  label-namespaces.sh: |
{{ .Files.Get "scripts/label-namespaces.sh" | indent 4 }}
