apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ns-labeler.name" . }}
  labels:
    {{- include "ns-labeler.labels" . | nindent 4 }}
---
# ClusterRole 是 cluster 範圍的物件，名稱要帶 release 名避免跟別的東西撞。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ns-labeler.name" . }}
  labels:
    {{- include "ns-labeler.labels" . | nindent 4 }}
rules:
  # 只要得到 namespace 和改 namespace 的 label。
  # 碰不到 namespace 裡面的任何東西。
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ns-labeler.name" . }}
  labels:
    {{- include "ns-labeler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ns-labeler.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ns-labeler.name" . }}
    namespace: {{ .Release.Namespace }}
