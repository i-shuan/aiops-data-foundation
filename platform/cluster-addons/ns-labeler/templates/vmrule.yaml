{{- if .Values.vmrule.enabled }}
# 只有在有 vmalert 會評估規則的地方才該開這個。
# 各 cluster 的 vmalert 是關的，在那邊建了也不會有人評估，
# 告警永遠不會響而且不會報錯。
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "ns-labeler.name" . }}
  labels:
    {{- include "ns-labeler.labels" . | nindent 4 }}
spec:
  groups:
    - name: attribution
      rules:
        - alert: NamespaceMissingAttribution
          # 用 label_dept 不是 dept。同一條指標上兩個都有，意思完全不同：
          # dept 是抓取時蓋上的「kube-state-metrics 這個 pod 屬於誰」，
          # label_dept 才是「這一列講的那個 namespace 屬於誰」。
          expr: kube_namespace_labels{label_dept=""} == 1
          for: {{ .Values.vmrule.for }}
          labels:
            severity: warning
          annotations:
            summary: "{{ `{{ $labels.namespace }}` }} 沒有歸屬，資料正在進 unassigned"
            description: >-
              在 ns-labeler 的 registry/apps.tsv 補一行，或在 namespaces.tsv 標成例外。
              補登記之前的資料已經寫進別的 tenant 和 index，不會搬回來。
{{- end }}
