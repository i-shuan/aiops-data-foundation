apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ns-labeler.name" . }}
  labels:
    {{- include "ns-labeler.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "ns-labeler.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "ns-labeler.name" . }}
          restartPolicy: Never
          containers:
            - name: labeler
              image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["sh", "/script/label-namespaces.sh"]
              env:
                - name: CLUSTERS
                  value: {{ .Values.clusters | join " " | quote }}
                - name: ENVS
                  value: {{ .Values.envs | join " " | quote }}
                - name: DRY_RUN
                  value: {{ .Values.dryRun | quote }}
                # kubectl 會想寫 ~/.kube/cache，根檔案系統唯讀時要指到可寫的地方。
                - name: HOME
                  value: /tmp
              volumeMounts:
                - {name: script, mountPath: /script}
                - {name: registry, mountPath: /registry}
                - {name: tmp, mountPath: /tmp}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          volumes:
            - name: script
              configMap: {name: {{ include "ns-labeler.name" . }}-script}
            - name: registry
              configMap: {name: {{ include "ns-labeler.name" . }}-registry}
            - name: tmp
              emptyDir: {}
