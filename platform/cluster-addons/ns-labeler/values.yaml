# 這份全廠共用，不需要每個 cluster 一份。
#
# 在 devops repo 裡的位置是 cluster-addons/ns-labeler/values.yaml，
# chart 本體發佈到內部 Helm repo 並釘選版本（cluster-addons 的驗證規則要求
# helm.repoURL / chart / version / valueFiles 齊全，不支援 git 內的本地 chart）。

# ── 對照表 ────────────────────────────────────────────────
# 放 values 而不是包進 chart，是為了讓「改一個部門歸屬」只要改這裡走 PR，
# 不必發一版新 chart。
registry:
  # app → 部門、系統。
  # 這裡的 app 是「namespace 去掉 cluster 前綴和 env 後綴剩下的那一段」，
  # 不是 Deployment 的名字：zk-mes-prod → mes
  # 新 app 上線在這裡加一行，而且要比 app 部署先合進去。
  #
  #   dept    分流依據，一定要有。
  #   system  分析用的維度：這個 app 屬於哪個業務系統。可以省，省了 log 上填 unknown。
  #
  # 加新的 label 之前先看 docs/attribution.md 的「想再加 label 之前」。
  # 會變的東西不要放進來：label 是寫入當下焊進資料的，之後改了舊資料不會跟著變。
  apps:
    mes: {dept: D3120, system: mes}
    wip: {dept: D1110, system: wip}

  # namespace → 部門、系統。例外用，優先順序高於 apps。
  # 平台自己的 namespace 也寫在這裡，這樣「沒有歸屬」就真的只剩該修的那些。
  namespaces:
    kube-system: {dept: PLATFORM, system: platform}
    kube-public: {dept: PLATFORM, system: platform}
    kube-node-lease: {dept: PLATFORM, system: platform}
    default: {dept: PLATFORM, system: platform}
    vm-monitoring: {dept: PLATFORM, system: platform}
    logging: {dept: PLATFORM, system: platform}

  # 部門 → group。group 對應中央 vmauth 的 tenant。
  # 改組時大多只要改這一段。
  groups:
    D3120: it
    D3130: it
    D1110: imc
    D1120: imc
    PLATFORM: platform
# ──────────────────────────────────────────────────────────

image:
  # 一定要用「有 shell」的映像。只有 kubectl 執行檔的極簡映像會直接
  # StartError: exec "sh": executable file not found，而且訊息不會說是映像的問題。
  #
  # 上線前要先把它鏡像進 Nexus，或換成內部已有、含 shell 與 kubectl 的映像。
  registry: nexus.aillm.spil.com.tw/docker
  repository: alpine/k8s
  tag: "1.30.0"
  pullPolicy: IfNotPresent

schedule: "*/10 * * * *"

# 第一次上線設 true，跑幾輪看它想動什麼，確認都是預期內的再改 false。
dryRun: false

# namespace 名稱解析用：去掉 cluster 前綴、env 後綴之後剩下的就是 app。
#   zk-mes-prod → mes
#
# 這是「全部 cluster 的代號」，不是這一台所在的 cluster，
# 所以不需要像 externalLabels.cluster 那樣由 ApplicationSet 注入。
# 擴廠時在這裡加一個代號。
clusters:
  - central
  - zk
  - el

envs:
  - prod
  - staging
  - dev

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# 「namespace 沒有歸屬」的告警。
#
# 預設關閉，因為各 cluster 的 vmalert 是關的（見 cluster-addons 的 vmstack values），
# 本地就算建了 VMRule 也沒有人會去評估它，告警永遠不會響而且不會報錯。
# 這條規則要部署在中央有 vmalert 或 Grafana 告警的那一側。
vmrule:
  enabled: false
  # 新建 namespace 到下一輪對帳之間會有空窗，要大於 schedule 的間隔。
  for: 30m
