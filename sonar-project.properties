# SonarQube 掃描設定（docs/pdca/2026-10-sonar.md）。
# 用法（先在 engine/ 跑 pytest --cov=. --cov-report=xml:../coverage.xml 產生覆蓋率）：
#   docker run --rm --network host -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN=<token> \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
sonar.projectKey=aiops-data-foundation
sonar.projectName=aiops-data-foundation
sonar.sourceEncoding=UTF-8

# 正式的程式和設定：engine（④～⑨）、telemetry（①②③）、sdk（應用的 chart）。
# e2e/ 是測試環境用的模擬服務和 manifest（故意沒設 limits、用 busybox、寫 /tmp），不當正式程式掃。
sonar.sources=engine,telemetry,sdk
sonar.exclusions=**/__pycache__/**,**/.run/**,engine/tests/**
sonar.tests=engine/tests
sonar.test.inclusions=engine/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
