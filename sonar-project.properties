# SonarQube 掃描設定（docs/pdca/meta/2026-10-sonar.md）。
# 用法（先在 aiops-engine/code/ 跑 pytest --cov=. --cov-report=xml:../coverage.xml 產生覆蓋率）：
#   docker run --rm --network host -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN=<token> \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
sonar.projectKey=aiops-data-foundation
sonar.projectName=aiops-data-foundation
sonar.sourceEncoding=UTF-8

# 正式的程式和設定：engine（④～⑨）、elasticsearch（補在公司 ES 上的結構與 key）、grafana。
sonar.sources=aiops-engine/code,elasticsearch/code,grafana/code
sonar.exclusions=**/__pycache__/**,**/.run/**,**/.venv/**,**/.cache/**,aiops-engine/code/tests/**
sonar.tests=aiops-engine/code/tests
sonar.test.inclusions=aiops-engine/code/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
