{{- /*
沒有 ArgoCD，所以 Namespace 由 chart 自己建立。
observability 寫什麼就貼什麼：不查表、不推導。沒寫或空的欄位不產生 label（不會有 system=""）。
*/}}
{{- $keys := list "dept" "tenant" "system" }}
{{- $obs := .Values.observability | default dict }}
{{- range $k, $_ := $obs }}
{{- if not (has $k $keys) }}
{{- fail (printf "observability.%s 不認得，只能是 dept、tenant、system（打錯字的欄位會被默默忽略）" $k) }}
{{- end }}
{{- end }}
{{- $labels := dict }}
{{- range $k := $keys }}
{{- with get $obs $k }}{{ $_ := set $labels $k (toString .) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace 必填" .Values.namespace }}
  {{- with $labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
