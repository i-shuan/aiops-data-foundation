# ── 給 ArgoCD 讀的：platform/argocd/applicationset.yaml 掃這個檔案產生 Application ──
# chart 本身不會用到這兩段，Helm 會直接忽略。
argocd:
  namespace: yms-sim-dev
  project: ai-platform
  environment: development     # production 不可自動同步
  owner: yms-team
  criticality: medium
  autoSync: true

# ── 這個 app 的 observability identity，唯一的來源 ──
# 部署時照原值變成 namespace 的 label，vmagent 依 tenant 決定寫進哪個 AccountID。
observability:
  dept: D1120                  # 必填：這份資料是誰的
  tenant: imc                  # 必填：tsid / bsid / icsd / imc / platform
  system: yms                  # 選填：業務系統

# ── 以下是一般的 Helm values ──

app:
  name: yms-sim                # 必須跟 app/ 底下的資料夾同名
  partOf: yms                  # 所屬系統
  component: worker            # api / web / worker / batch / gateway

image:
  repository: nexus.aillm.spil.com.tw/docker/yms/yms-sim
  tag: "0.1.0"         # 由 CI 在 build 之後覆寫，不能用 latest

replicas: 1

ports:
  metrics: 9464

probes:
  readiness:
    tcpSocket:
      port: metrics
  liveness:
    tcpSocket:
      port: metrics
    initialDelaySeconds: 15

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Python 服務，不用 Java agent
otel:
  javaAgent:
    enabled: false
