{{- /*
【VictoriaMetrics 相關】這個檔不是在部署 app，是給平台的 vmagent 看的登記單：
「這個 Service 的 /metrics 要來抓」。VMServiceScrape 是 VictoriaMetrics operator 的資源，
cluster 沒裝 operator 的話這個檔會套不上去。
它只負責「要被抓」。資料寫進哪個租戶、送到哪一站，都在 platform/victoriametrics/ 決定，跟這個檔無關。

依 platform/victoriametrics/vmstack-values.yaml，既有 vmagent 是這樣選到它的：
  - 沒設 serviceScrapeSelector / serviceScrapeNamespaceSelector，k8s-stack chart 預設 selectAllByDefault: true
    → 所有 namespace 的 VMServiceScrape 都會被選到，不需要特定 metadata label
  - scrapeClass「default」是 default: true，自動套用，抓的時候把 namespace 的 dept / tenant / system 帶進資料
    → 這裡不要寫 scrapeClass，寫了別的名字反而會換掉它，門牌就帶不進去
*/}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}   # 對的是 Service 的 label
  endpoints:
    - port: metrics                                    # 對的是 Service port 的名字
      path: /metrics
      # 跟正式 chart 一樣：Pod 的標準 label 蓋到每一筆 metrics 上，欄位名稱跟 log 一致
      relabelConfigs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          target_label: app
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          target_label: version
