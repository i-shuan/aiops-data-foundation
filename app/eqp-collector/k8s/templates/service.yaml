apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}   # VMServiceScrape 用這個 label 找 Service
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.app.name }}   # 跟 Deployment 的 Pod label 一樣
  ports:
    # 只開 metrics。8080 是 kubelet probe 直接打 Pod，不經過 Service
    - name: metrics                                  # VMServiceScrape 用這個名字找 port
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
