# 部署前要先有：
#   1. image：cd aiops-engine && docker build -t <nexus>/aiops-engine:<tag> .（下面 image 換成實際路徑）
#   2. Secret（手動建，不進 git）：
#        kubectl -n aiops create secret generic aiops-secrets \
#          --from-literal=ES_API_KEY=<elasticsearch/kibana-dev-tools.txt 第 3 段發的 engine key>
#   3. esUrl 改成實際值；LLM 的設定在下面 llm、API 的 token 在 api.token（key 寫在不進 git 的 values-local.yaml，部署時 -f 帶進來）
#   4. 設定檔要跟 image 裡的不一樣時用 configOverrides（--set-file configOverrides.baseline.series=aiops-engine/configs/baseline/series.yaml；
#      排程表是 configOverrides.schedule.schedule）
#
# 一個 image、一份 values：mode 決定裝成什麼樣（docs/pdca/meta/2026-11-api-beat-worker.md；畫面全在 Grafana，grafana/）：
#   single       一隻 pod 兩個 container：scheduler（排程器自己跑 configs/<plugin>/schedule.yaml 的工作）＋ api。不用 Redis；
#                只能 1 個副本（多一個每個工作就跑兩份）；換 image 先停舊的（Recreate），中間缺幾十秒。開發、離線廠區用
#   distributed  Superset 式：api（N 份）、beat（1 份，每分鐘只把工作丟進佇列）、worker 依佇列 realtime／alert／batch 各一個 Deployment
#                （各自 replicas、resources；alert 固定 1 份 concurrency 1）、redis（佇列）。train 跟每分鐘的工作分開跑、api 跟排程分開掛
#
# 先只寫入、不通知：Grafana 那邊先不設 contact point（或 policies 全送到一個沒人看的 webhook），跑 2～4 週，
# 用 python3 -m main detector metrics --from … --to … 記下基準，再開通知。
mode: single

image:
  repository: nexus.example.internal/aiops/aiops-engine
  tag: 0.1.0

esUrl: https://elasticsearch.example.internal:9200
tz: Asia/Taipei
# 情境（common/scenario/README.md）：observability（IT：服務、API、trace）、factory（工廠：ML／FDC 判好的異常、MES 履歷、機台 alarm）、
# metrics_only（只有 ML／FDC 的異常、沒有履歷）。環境變數 AIOPS_PLUGIN 跟著設，排程表換成那個情境的
plugin: observability
# observability 的原始資料是誰寫的：otel（我們的 Collector：metrics-*.otel-*、k8s-*、traces-generic.otel-*）或 apm（Elastic APM：
# metrics-apm.*、logs-apm.*、traces-apm-*；設定檔 configs/apm/，怎麼接見那個資料夾的 README.md）。其他 plugin 不看這個。
# 兩種並存寫 otel,apm（逗號隔開，第一個是主要的：排程表、RCA 設定的 indices.logs 跟它；怎麼設定見 configs/mixed/README.md）
source: otel
secret: aiops-secrets          # ES_API_KEY
esApiKey: ""                   # 部署時給：chart 建上面這個 Secret；空的就不建、沿用手動建的

# LLM 摘要（llm/summary.py）。provider、model、baseUrl 放 ConfigMap aiops-env；apiKey 由 chart 建成 Secret aiops-llm。
# apiKey 這裡永遠留空：真的 key 寫在 values-local.yaml（.gitignore 擋掉），helm 加 -f values-local.yaml
llm:
  provider: template           # template（不叫模型）／openai／anthropic
  model: ""                    # 空的用程式預設：openai gpt-4o-mini、anthropic claude-sonnet-4-5
  baseUrl: ""                  # 空的用公網 api.openai.com／api.anthropic.com；內網走閘道時填閘道網址（不含 /v1）
  apiKey: ""

configOverrides: {}            # {baseline: {series: <內容>}} → 掛在 /app/configs/baseline/series.yaml 蓋掉 image 裡的

# 排程：single 的排程器、distributed 的 beat 共用這段。第一階段只開 stage 1 的 4 個（rules、detect、alert、train）；跑穩、看過一輪誤報再
# stage: 2 開其他。排程表（頻率、逾時、重試、佇列）在 configs/<plugin>/schedule.yaml，不在這裡。
scheduler:
  stage: 1
  resources:                   # single：工作都在這個 container 裡跑，train 要 4Gi；distributed 的 beat 只丟工作，用 beatResources
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 6Gi}
  beatResources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  terminationGracePeriodSeconds: 120   # 收到停止後等還在跑的工作收尾（alert 最多 600 秒，但換版時寧願少一輪）

# api（code/api/）：沒有頁面的薄 API＋老師傅回饋的備用網頁。Grafana 的回饋表單、「重跑根因分析」按鈕從瀏覽器打它；ML／FDC 用 POST /api/anomalies 推異常。
# rca.yaml 的 alerts.feedback_url、report_url 填這個 Service 的網址：http://aiops-api.aiops.svc:8080/feedback?alert={alert_id}
# 要讓人從公司網路點得到：再加 Ingress（或 NodePort）指到這個 Service
api:
  enabled: true
  replicas: 1                  # distributed 才看；single 固定跟排程器同一隻 pod
  port: 8080
  corsOrigin: https://grafana.example.internal    # Grafana 從瀏覽器直接打 /api/*：填 Grafana 的網址（逗號分隔；不用就留空）
  token: ""                    # AIOPS_API_TOKEN：POST /api/anomalies 要帶 Authorization: Bearer <token>；空的那個端點關著。寫在 values-local.yaml
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# worker（distributed 才有）：key 是佇列名（code/tasks/），每個佇列一個 Deployment。工作就是開子行程跑 python3 -m <args>，記憶體給那個佇列裡最重的工作
workers:
  realtime:                    # 每幾分鐘的：rules、detect、trace-merge、ingest、peer、trace-*、quality、paths-merge
    replicas: 1
    concurrency: 2
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2Gi}
  alert:                       # 收斂＋根因分析＋LLM：固定 1 份、concurrency 1（兩筆異常同時進來才不會各開一件）
    replicas: 1
    concurrency: 1
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 2Gi}
  batch:                       # 每天、每週的：train（4Gi）、trace-train、chronic、prune、shift
    replicas: 1
    concurrency: 1
    resources:
      requests: {cpu: 100m, memory: 1Gi}
      limits: {memory: 6Gi}

# 佇列（distributed 才有）。chart 裝一個 Redis（不持久化：佇列裡只有「這一分鐘該跑的」，掉了下一分鐘 beat 再丟）；
# 用公司現有的就 enabled: false、url 填它
redis:
  enabled: true
  image: redis:7-alpine
  url: ""                      # redis://host:6379/0；空的用 chart 裝的那個
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
