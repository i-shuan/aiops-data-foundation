# 部署前要先有：
#   1. image：cd aiops-engine/code && docker build -t <nexus>/aiops-engine:<tag> .（下面 image 換成實際路徑）
#   2. Secret（手動建，不進 git）：
#        kubectl -n aiops create secret generic aiops-secrets \
#          --from-literal=ES_API_KEY=<elasticsearch-setup.sh 發的「AIOps baseline key」> \
#          --from-literal=LLM_API_KEY=<沒有就給空字串>
#   3. esUrl 改成實際值；llmProvider 沒有模型就留 template
#   4. 設定檔要跟 image 裡的不一樣時用 configOverrides（--set-file configOverrides.baseline.series=aiops-engine/code/configs/baseline/series.yaml；
#      排程表是 configOverrides.schedule.schedule）
#
# 一隻 pod、兩個 container（同一個 image）：scheduler（排程器，照 configs/schedule/schedule.yaml 跑定期工作）、feedback（回饋網頁）。
# 只能 1 個副本（多一個會重複跑）；換 image 時先停舊的（Recreate），中間缺幾十秒、錯過的分鐘不補跑。
#
# 先只寫入、不通知：Grafana 那邊先不設 contact point（或 policies 全送到一個沒人看的 webhook），跑 2～4 週，
# 用 python3 -m detector metrics --from … --to … 記下基準，再開通知。
image:
  repository: nexus.example.internal/aiops/aiops-engine
  tag: 0.1.0

esUrl: https://elasticsearch.example.internal:9200
llmProvider: template          # template（不叫模型）／anthropic／openai；anthropic 要再給 LLM_CHAT_MODEL、ANTHROPIC_BASE_URL
tz: Asia/Taipei
secret: aiops-secrets          # ES_API_KEY、LLM_API_KEY

configOverrides: {}            # {baseline: {series: <內容>}} → 掛在 /app/configs/baseline/series.yaml 蓋掉 image 裡的

# 排程器：第一階段只開 stage 1 的 4 個（rules、detect、alert、train）；跑穩、看過一輪誤報再 stage: 2 開其他 6 個。
# 排程表（頻率、逾時、重試）在 code/configs/schedule/schedule.yaml，不在這裡。
scheduler:
  stage: 1
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 6Gi}       # train 要 4Gi，同時每分鐘的 rules／detect／alert 還在跑；平時用不到，只有 02:00 那段
  terminationGracePeriodSeconds: 120   # 收到停止後等還在跑的工作收尾（alert 最多 600 秒，但換版時寧願少一輪）

# 老師傅的回饋入口（feedback_web）：通知裡的連結點進來填。rca.yaml 的 alerts.feedback_url、report_url 填這個 Service 的網址：
#   feedback_url: http://aiops-feedback.aiops.svc:8080/feedback?alert={alert_id}
# 要讓人從公司網路點得到：再加 Ingress（或 NodePort）指到這個 Service；表單沒有登入，放內網就好
feedback:
  enabled: true
  port: 8080
  corsOrigin: https://grafana.example.internal    # Grafana 儀表板的回饋表單從瀏覽器直接打 /api/*：填 Grafana 的網址（逗號分隔；不用就留空）
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
