{{- if eq (include "aiops.mode" .) "single" }}
# mode: single——一隻 pod：scheduler（定期工作，自己跑）＋ api。兩個 container 各有自己的記憶體上限，train 撐爆 scheduler 時 api 不受影響
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-engine
  labels: {app.kubernetes.io/name: aiops-engine}
spec:
  replicas: 1          # 一定要 1，多一個每個工作就跑兩份
  strategy:
    type: Recreate     # 換版先停舊的，新舊不會同時排
  selector:
    matchLabels: {app.kubernetes.io/name: aiops-engine}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aiops-engine}
      annotations:
        checksum/env: {{ include (print .Template.BasePath "/env.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds }}
      {{- if .Values.archive.enabled }}
      securityContext: {fsGroup: 10001}     # 歸檔的 PVC 給 image 的使用者寫
      {{- end }}
      containers:
        - name: scheduler
          image: {{ include "aiops.image" . }}
          args: ["main", "scheduler", "--config", {{ include "aiops.schedule" . | quote }}, "--stage", {{ .Values.scheduler.stage | quote }}, "--alive-file", "/tmp/scheduler-alive"]
          {{- include "aiops.envFrom" . | nindent 10 }}
          # 排程器每分鐘醒來更新 /tmp/scheduler-alive；超過 3 分鐘沒更新就是卡死，重啟
          livenessProbe:
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/scheduler-alive) )) -lt 180"]
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- with include "aiops.archiveMount" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "aiops.configMounts" . }}
            {{- . | nindent 12 }}
            {{- end }}
        {{- if .Values.api.enabled }}
        {{- include "aiops.apiContainer" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with include "aiops.archiveVolume" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with include "aiops.configVolumes" . }}
        {{- . | nindent 8 }}
        {{- end }}
{{- if .Values.api.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-api
spec:
  selector: {app.kubernetes.io/name: aiops-engine}
  ports:
    - {name: http, port: {{ .Values.api.port }}, targetPort: http}
{{- end }}
{{- end }}
