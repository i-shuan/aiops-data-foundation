apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-env
data:
  ES_URL: {{ .Values.esUrl | quote }}
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  {{- with .Values.llm.model }}
  LLM_CHAT_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.llm.baseUrl }}
  {{- if eq $.Values.llm.provider "anthropic" }}
  ANTHROPIC_BASE_URL: {{ . | quote }}
  {{- else }}
  OPENAI_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  TZ: {{ .Values.tz | quote }}
  AIOPS_SOURCE: {{ .Values.source | default "otel" | quote }}    # 原始資料的格式（core/source.py）
  AIOPS_DOMAIN: {{ .Values.domain | default "it" | quote }}      # 領域：it（服務）或 factory（機台）；回饋表單的分類表、措辭（core/domain.py）
  ENGINE_VERSION: {{ .Values.image.tag | quote }}    # 每筆異常帶的 engine_version（core/version.py）；跟 image 同一個 tag
---
# LLM 的 key：values-local.yaml 的 llm.apiKey（不進 git）。空的也建，pod 的 envFrom 才不用分兩種
apiVersion: v1
kind: Secret
metadata:
  name: aiops-llm
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
{{- if .Values.configOverrides }}
---
# 蓋掉 image 裡的設定檔：configOverrides.<資料夾>.<檔名> → /app/configs/<資料夾>/<檔名>.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-configs
data:
  {{- range $dir, $files := .Values.configOverrides }}
  {{- range $name, $body := $files }}
  {{ $dir }}__{{ $name }}.yaml: |
{{ $body | indent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
