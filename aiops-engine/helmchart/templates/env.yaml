apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-env
data:
  ES_URL: {{ .Values.esUrl | quote }}
  LLM_PROVIDER: {{ .Values.llmProvider | quote }}
  TZ: {{ .Values.tz | quote }}
{{- if .Values.configOverrides }}
---
# 蓋掉 image 裡的設定檔：configOverrides.<資料夾>.<檔名> → /app/configs/<資料夾>/<檔名>.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-configs
data:
  {{- range $dir, $files := .Values.configOverrides }}
  {{- range $name, $body := $files }}
  {{ $dir }}__{{ $name }}.yaml: |
{{ $body | indent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
