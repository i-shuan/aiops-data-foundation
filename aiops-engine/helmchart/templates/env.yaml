apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-env
data:
  ES_URL: {{ .Values.esUrl | quote }}
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  {{- with .Values.llm.model }}
  LLM_CHAT_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.llm.baseUrl }}
  {{- if eq $.Values.llm.provider "anthropic" }}
  ANTHROPIC_BASE_URL: {{ . | quote }}
  {{- else }}
  OPENAI_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  TZ: {{ .Values.tz | quote }}
  AIOPS_ARCHIVE_DIR: {{ ternary "/var/lib/aiops/archive" "off" .Values.archive.enabled | quote }}   # prune 刪之前歸檔到哪；off = 直接刪
  {{- with .Values.pgSchema }}
  AIOPS_PG_SCHEMA: {{ . | quote }}
  {{- end }}
  {{- with .Values.embedding.url }}
  EMBEDDING_URL: {{ . | quote }}
  EMBEDDING_MODEL: {{ $.Values.embedding.model | quote }}
  {{- end }}
  AIOPS_PLUGIN: {{ .Values.plugin | default "observability" | quote }}   # 情境：observability／factory／metrics_only（core/plugin.py、code/plugins/README.md）
  AIOPS_SOURCE: {{ .Values.source | default "otel" | quote }}    # observability 的原始資料格式：otel／apm（plugins/observability）
  ENGINE_VERSION: {{ .Values.image.tag | quote }}    # 每筆異常帶的 engine_version（core/version.py）；跟 image 同一個 tag
  {{- if eq (include "aiops.mode" .) "distributed" }}
  AIOPS_BROKER_URL: {{ include "aiops.brokerUrl" . | quote }}    # 佇列（code/tasks/）：beat 丟、worker 拿、api 丟 alert；single 不設
  {{- end }}
---
# API 的 token：values-local.yaml 的 api.token（不進 git）。POST /api/anomalies 要帶 Authorization: Bearer <token>；空的那個端點關著。空的也建，envFrom 才不用分兩種
apiVersion: v1
kind: Secret
metadata:
  name: aiops-api
type: Opaque
stringData:
  AIOPS_API_TOKEN: {{ .Values.api.token | quote }}
---
# LLM 的 key：values-local.yaml 的 llm.apiKey（不進 git）。空的也建，pod 的 envFrom 才不用分兩種
apiVersion: v1
kind: Secret
metadata:
  name: aiops-llm
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  EMBEDDING_API_KEY: {{ .Values.embedding.apiKey | quote }}     # 相似事故的向量（沒設 embedding.url 就用不到）
{{- if .Values.configOverrides }}
---
# 蓋掉 image 裡的設定檔：configOverrides.<資料夾>.<檔名> → /app/configs/<資料夾>/<檔名>.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-configs
data:
  {{- range $dir, $files := .Values.configOverrides }}
  {{- range $name, $body := $files }}
  {{ $dir }}__{{ $name }}.yaml: |
{{ $body | indent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
