{{- if .Values.esApiKey }}
# CI 部署時從 values 建（elasticsearch-setup.sh 的 KEYS_OUT_DIR 寫的 engine-values.yaml，不進 git）；沒給就不建，沿用手動建的 Secret。
# resource-policy: keep：之後的部署沒帶 key 時，helm 不會把這個 Secret 刪掉。
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ES_API_KEY: {{ .Values.esApiKey | quote }}
{{- end }}
