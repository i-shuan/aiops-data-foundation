{{- range .Values.jobs }}
{{- if or (eq (int .stage) 1) $.Values.stage2 }}
{{- $frequent := eq (index (splitList " " .schedule) 1) "*" }}
---
# {{ .why }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-{{ .name }}
  labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: {{ .name }}}
spec:
  schedule: {{ .schedule | quote }}
  timeZone: {{ $.Values.tz }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ min (int .deadline) 300 }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 每天、每週跑一次的：失敗了不重試就要等一整天（train 失敗 → baseline 舊一天），所以 Job 內重試 2 次；
      # 每幾分鐘跑的不重試：下一輪就是重試，Job 內重試只會跟下一輪擠在一起（Forbid 會讓下一輪被跳過）
      backoffLimit: {{ if $frequent }}0{{ else }}2{{ end }}
      activeDeadlineSeconds: {{ .deadline }}
      template:
        metadata:
          labels: {app.kubernetes.io/name: aiops-engine, app.kubernetes.io/component: {{ .name }}}
        spec:
          restartPolicy: Never
          containers:
            - name: engine
              image: {{ include "aiops.image" $ }}
              args: {{ toJson .args }}
              envFrom:
                - configMapRef: {name: aiops-env}
                - secretRef: {name: {{ $.Values.secret }}}
              resources:
                requests: {{ toJson $.Values.jobResources.requests }}
                limits: {memory: {{ .memory | default $.Values.jobResources.memoryLimit }}}
              {{- with include "aiops.configMounts" $ }}
              volumeMounts:
                {{- . | nindent 16 }}
              {{- end }}
          {{- with include "aiops.configVolumes" $ }}
          volumes:
            {{- . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
