# fine_e2e.py 用：30 秒一點（資料是預先統計好的，每 30 秒一筆：requests 請求數、latency_ms 平均延遲）
interval: 30s
history_weeks: 2
fine_history: 14d
adaptive:
  resolutions: [30s, 1m, 5m, 15m, 30m, 1h]
  min_events: {rate: 20, count: 10}
  coverage: 0.3
status: {confirm_points: 2, confirm_span: 30m}
train: {timezone: Asia/Taipei}
detect: {z: 5, rel_floor: 0.05}
series:
  - name: fine.latency
    index: aiops-fine
    by: [api]
    value: {avg: latency_ms}
    events: {sum: requests}
    kind: rate
    direction: up
    min_abs: 30
  - name: fine.requests
    index: aiops-fine
    by: [api]
    value: {sum: requests}
    events: value
    fill_zero: true
    direction: both
    min_abs: 5
