# engine 自己的資料（PostgreSQL）：超過保留天數的每天清一次（python3 -m main detector prune --config configs/baseline/prune.yaml）。
# 排程表（configs/schedule/schedule.yaml）每天 03:30 跑。天數是估的；為什麼這些要清、哪些不清見 docs/data-storage-reference.md。
#
# 不在這裡的（不清）：事故、回饋、調整、對照覆寫（人工判斷，事故紀錄要長留，備份交給 PostgreSQL 的備份）、
# 基準線（每天 train 覆蓋）、進度（一筆）。
#
# pack：超過保留天數的資料不是直接刪，而是一天打包成一筆 gzip（約 1/6～1/8 大）放進 PostgreSQL 的 aiops_packed，細筆才刪；
# 要查舊的用 detector db restore 讀回原表。keep_days 是打包的資料再留幾天（null = 不刪）。寫 pack: null = 不打包、超過天數直接刪。
pack:
  keep_days: 365
tables:
  - table: anomalies     # 異常總表：回饋、回測最多看 4 週；事故的 anomaly_ids 對不到舊異常時只影響「每個異常各一筆回饋」，退回一件一筆
    keep_days: 90
  - table: alerts        # 事故（一件一筆，含 RCA 報告）：只刪已結案的、依結案時間；開著的件、心跳、detect-status 不會被刪
    keep_days: 180
