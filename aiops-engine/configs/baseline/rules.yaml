# 規則：狀態變化、離極限多遠（detector/rules.py）。不用學、不用歷史。
# 每分鐘跑一次：python3 -m aiops detector rules --config configs/baseline/rules.yaml
# 觸發的寫進 aiops-anomalies（series = rule.<name>，level = rule，另有 severity、message）。
#
# 門檻是常見的起始值，依現場的誤報、漏報再調。

interval: 1m      # 同一條規則、同一個對象，1 分鐘內只記一筆（重跑不會重複）
lookback: 10m     # 讀最近多久的資料（要比每條規則的 for 長）

# 共用的維度（resource.attributes.*）
_ns: &ns resource.attributes.k8s.namespace.name
_pod: &pod resource.attributes.k8s.pod.name
_ctr: &ctr resource.attributes.k8s.container.name
_node: &node resource.attributes.k8s.node.name
_svc: &svc resource.attributes.service.name

rules:
  # ── 保底：一定是壞了的固定門檻（docs/pdca/phase1-collect/2026-10-ingest-simplify.md）──
  # baseline 要累積資料才準（同星期×同小時要 2 週，退到每天同小時要 3 天）；這兩條不用學，上線第一天就有用。
  # 門檻刻意寬：只抓「不用比歷史也知道是壞了」的；比平常差一點點的交給 baseline。
  - name: http.error_rate_floor
    title: API 錯誤率超過 5%
    severity: critical
    type: window
    lookback: 5m
    index: metrics-*.otel-*
    filter: {exists: {field: metrics.http.server.request.duration}}
    by: [*svc, attributes.http.request.method, attributes.http.route]
    value: {hist_ratio: {field: metrics.http.server.request.duration,
                         query: {range: {attributes.http.response.status_code: {gte: 500}}}}}
    op: ">="
    threshold: 0.05
    min_events: 20          # 5 分鐘不到 20 個請求的不判斷（錯 1 個就 5%）
    show: pct

  - name: http.latency_p95_floor
    title: API p95 超過 2 秒
    severity: warning
    type: window
    lookback: 5m
    index: metrics-*.otel-*
    filter: {exists: {field: metrics.http.server.request.duration}}
    by: [*svc, attributes.http.request.method, attributes.http.route]
    value: {percentile: {field: metrics.http.server.request.duration, percent: 95}}
    op: ">="
    threshold: 2
    min_events: 20
    show: seconds

  # ── 狀態變化（K8s 物件狀態，k8s_cluster 每 30 秒）──
  - name: container.restarted
    title: 容器重啟
    severity: critical
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.container.restarts
    report_gone: true         # Pod 刪掉了也照報：重啟過、失敗過就是發生過
    type: increase            # 這段時間重啟次數增加了
    op: ">="
    threshold: 1
    by: [*ns, *pod, *ctr]
    context: [*svc, *node]

  - name: deployment.unavailable
    title: Deployment 可用副本不夠
    severity: critical
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.deployment.available
    other: metrics.k8s.deployment.desired
    type: compare             # 要的 − 可用
    op: ">="
    threshold: 1
    for: 3m                   # 換版滾動時會短暫不足，3 分鐘裡大部分時間都不夠才算
    min_ratio: 0.8            # 一直重啟的服務每次會短暫起來幾十秒，不能要求「全部」都不夠
    by: [*ns, resource.attributes.k8s.deployment.name]
    context: [*svc]

  - name: statefulset.unavailable
    title: StatefulSet ready 的 Pod 不夠
    severity: critical
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.statefulset.ready_pods
    other: metrics.k8s.statefulset.desired_pods
    type: compare
    op: ">="
    threshold: 1
    for: 3m
    min_ratio: 0.8
    by: [*ns, resource.attributes.k8s.statefulset.name]

  - name: daemonset.unavailable
    title: DaemonSet 有節點沒跑起來
    severity: warning
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.daemonset.ready_nodes
    other: metrics.k8s.daemonset.desired_scheduled_nodes
    type: compare
    op: ">="
    threshold: 1
    for: 3m
    min_ratio: 0.8
    by: [*ns, resource.attributes.k8s.daemonset.name]

  # k8s.pod.phase：1 Pending、2 Running、3 Succeeded、4 Failed、5 Unknown
  - name: pod.failed
    title: Pod 失敗
    severity: critical
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.pod.phase
    type: value
    op: "=="
    threshold: 4
    by: [*ns, *pod]
    context: [*svc, *node]

  - name: pod.pending
    title: Pod 一直排不上去（Pending）
    severity: warning
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.pod.phase
    type: value
    op: "=="
    threshold: 1
    for: 5m                   # 拉 image、排程本來就要一點時間
    by: [*ns, *pod]
    context: [*svc]

  - name: job.failed
    title: Job 有 Pod 失敗
    severity: warning
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.job.failed_pods
    report_gone: true         # Pod 刪掉了也照報：重啟過、失敗過就是發生過
    type: increase
    op: ">="
    threshold: 1
    by: [*ns, resource.attributes.k8s.job.name]

  - name: node.not_ready
    title: 節點 NotReady
    severity: critical
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.node.condition_ready
    type: value
    op: "=="
    threshold: 0
    for: 1m
    by: [*node]

  # 主機時鐘偏移（node Collector 的 ntp receiver，30 分鐘量一次，單位奈秒）：根因分析靠「誰先變壞」排順序，
  # 時鐘偏了順序就錯。快、慢都算（abs）。docs/pdca/phase1-collect/2026-10-time-alignment.md
  - name: node.clock_offset
    title: 主機時鐘偏移超過 100 毫秒
    severity: warning
    index: metrics-ntpreceiver.otel-*
    field: metrics.ntp.offset
    type: value
    abs: true
    op: ">="
    threshold: 100000000      # 100ms（奈秒）
    show: ns_as_ms
    by: [*node]
    lookback: 40m             # 30 分鐘才量一次
    fresh: 40m

  - name: node.clock_offset_critical
    title: 主機時鐘偏移超過 1 秒
    severity: critical
    index: metrics-ntpreceiver.otel-*
    field: metrics.ntp.offset
    type: value
    abs: true
    op: ">="
    threshold: 1000000000     # 1 秒（奈秒）
    show: ns_as_ms
    by: [*node]
    lookback: 40m
    fresh: 40m

  - name: node.memory_pressure
    title: 節點記憶體壓力
    severity: critical
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.node.condition_memory_pressure
    type: value
    op: "=="
    threshold: 1
    by: [*node]

  - name: node.disk_pressure
    title: 節點磁碟壓力
    severity: critical
    index: metrics-k8sclusterreceiver.otel-*
    field: metrics.k8s.node.condition_disk_pressure
    type: value
    op: "=="
    threshold: 1
    by: [*node]

  - name: scrape.down
    title: 抓不到應用的 metrics（服務掛了或 metrics port 壞了）
    severity: warning
    index: metrics-prometheusreceiver.otel-*
    field: metrics.up
    type: value
    op: "=="
    threshold: 0
    for: 1m
    by: [*ns, *pod]
    context: [*svc]

  # ── 離極限多遠（kubelet 每 30 秒）──
  # 容器有設記憶體上限時，kubelet 給 available = 上限 − working_set；沒設上限就沒有 available，這條不判斷
  - name: container.memory_near_limit
    title: 容器記憶體快到上限（會被 OOM kill）
    severity: warning
    index: metrics-kubeletstatsreceiver.otel-*
    field: metrics.container.memory.working_set
    den: [metrics.container.memory.working_set, metrics.container.memory.available]
    type: ratio
    op: ">="
    threshold: 0.9
    for: 2m
    by: [*ns, *pod, *ctr]
    context: [*svc, *node]

  # 趨勢：最近 30 分鐘一路往上（Theil–Sen 斜率；三段的低點一段比一段高，GC 鋸齒回得到原來低點的不算），
  # 照這個速度 6 小時內會到上限（working_set + available）。memory_near_limit 要到 90% 才報，這條在還沒到之前先講；
  # 不用跟其他 Pod 比，單 Pod 的服務、新舊 Pod 記憶體本來就不同的也能用。新容器要有滿 30 分鐘的資料才判斷（啟動期 heap 長大不算）
  - name: container.memory_leak
    title: 容器記憶體一直漲，照這個速度幾小時內會到上限（像洩漏）
    severity: warning
    index: metrics-kubeletstatsreceiver.otel-*
    field: metrics.container.memory.working_set
    den: [metrics.container.memory.working_set, metrics.container.memory.available]
    type: slope
    for: 30m
    lookback: 35m
    min_points: 40          # 30 秒一點，30 分鐘 61 點；缺一些也行
    op: "<="
    threshold: 6            # 小時
    show: hours
    by: [*ns, *pod, *ctr]
    context: [*svc, *node]

  - name: node.memory_high
    title: 節點記憶體快滿
    severity: warning
    index: metrics-kubeletstatsreceiver.otel-*
    field: metrics.k8s.node.memory.working_set
    den: [metrics.k8s.node.memory.working_set, metrics.k8s.node.memory.available]
    type: ratio
    op: ">="
    threshold: 0.9
    for: 5m
    by: [*node]

  - name: node.disk_high
    title: 節點磁碟快滿
    severity: warning
    index: metrics-kubeletstatsreceiver.otel-*
    field: metrics.k8s.node.filesystem.usage
    den: [metrics.k8s.node.filesystem.capacity]
    type: ratio
    op: ">="
    threshold: 0.85
    for: 5m
    by: [*node]

  - name: node.disk_full
    title: 節點磁碟幾乎滿了（log 寫不出去會卡住服務）
    severity: critical
    index: metrics-kubeletstatsreceiver.otel-*
    field: metrics.k8s.node.filesystem.usage
    den: [metrics.k8s.node.filesystem.capacity]
    type: ratio
    op: ">="
    threshold: 0.95
    for: 1m
    by: [*node]

  # CPU 被限流（kubelet 的 cAdvisor）：設了 CPU limit 的容器，瞬間用量碰到上限就被凍結到下一個 100ms。
  # 平均 CPU 看起來不高（實測 35%），延遲卻變長。業界常用 25% 的週期被限流當門檻
  - name: container.cpu_throttled
    title: 容器 CPU 被限流（limit 太低，突波被凍結）
    severity: warning
    index: metrics-prometheusreceiver.otel-*
    field: metrics.container_cpu_cfs_throttled_periods_total
    den: [metrics.container_cpu_cfs_periods_total]
    type: increase_ratio      # 這段時間被限流的週期 ÷ 全部週期
    op: ">="
    threshold: 0.25
    for: 5m
    by: [*ns, *pod, *ctr]
    context: [*svc, *node]

  # ── Java 應用（OpenTelemetry Java agent 2.x 實測的名稱，見 docs/metrics/README.md）──
  # heap 的老年代「GC 之後」還很滿：GC 清不掉，是真的不夠或洩漏（只看 used 會被還沒回收的垃圾騙）
  - name: jvm.old_gen_after_gc_high
    title: JVM 老年代 GC 後還很滿（記憶體洩漏或 heap 不夠）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.jvm_memory_used_after_last_gc_bytes
    den: [metrics.jvm_memory_limit_bytes]
    filter: [{regexp: {attributes.jvm_memory_pool_name: ".*(Old|Tenured).*"}}]
    type: ratio
    op: ">="
    threshold: 0.8
    for: 2m
    by: [*ns, *pod, attributes.jvm_memory_pool_name]
    context: [*svc]

  # major GC（老年代的 GC，會停住整個程式）越來越頻繁：老年代清不太掉，每次清完很快又滿。
  # 實測（heap 128MB 的洩漏）：平常 4 分鐘 1 次 → OOM 前每分鐘 2、4、8 次；但每次只 70ms，「GC 時間比例」不到 1%
  - name: jvm.major_gc_frequent
    title: JVM major GC 太頻繁（老年代清不掉）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.jvm_gc_duration_seconds
    hist_count: true          # 數次數，不是時間
    filter: [{term: {attributes.jvm_gc_action: "end of major GC"}}]
    type: total
    op: ">="
    threshold: 5              # 5 分鐘內 5 次以上
    for: 5m
    by: [*ns, *pod]
    context: [*svc]

  # GC 佔掉的時間：每秒裡有多少秒在 GC（Stop-the-World 時請求全部停住）。
  # heap 大（幾 GB）時一次 full GC 要好幾秒，這條才有意義；heap 小的時候看上面的次數
  - name: jvm.gc_overhead
    title: JVM 花太多時間在 GC
    severity: warning
    index: metrics-*.otel-*
    field: metrics.jvm_gc_duration_seconds_sum   # Collector 從直方圖抽出來的總和（ES 8.19 的 histogram 不存 sum；node.yaml transform/hist-sum）
    type: rate                # 這段時間 GC 的秒數加總 ÷ 經過的秒數
    op: ">="
    threshold: 0.1
    for: 3m
    by: [*ns, *pod]
    context: [*svc]

  # 連線池（HikariCP；agent 2.x 的名稱是 db_client_connections_*）
  - name: db.pool_exhausted
    title: 資料庫連線池用光了
    severity: critical
    index: metrics-*.otel-*
    field: metrics.db_client_connections_usage
    filter: [{term: {attributes.state: used}}]
    join: {field: metrics.db_client_connections_max}      # 上限存在另一種文件
    den: [metrics.db_client_connections_max]
    type: ratio
    op: ">="
    threshold: 0.9
    for: 1m
    by: [*ns, *pod, attributes.pool_name]
    context: [*svc]

  - name: db.pool_waiting
    title: 有請求在排隊等資料庫連線
    severity: warning
    index: metrics-*.otel-*
    field: metrics.db_client_connections_pending_requests
    type: value
    op: ">="
    threshold: 1
    for: 1m
    min_ratio: 0.8
    by: [*ns, *pod, attributes.pool_name]
    context: [*svc]

  # ── .NET 應用（OpenTelemetry .NET 自動埋點 v1.12.0、.NET 9 實測的名稱；用 OTLP 推，名稱是點分隔的原名）──
  # Gen2（老年代）GC 越來越頻繁：Gen2 清不太掉，跟 Java 的 major GC 同一個意思
  - name: dotnet.gen2_gc_frequent
    title: .NET Gen2 GC 太頻繁（記憶體清不掉）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.dotnet.gc.collections
    filter: [{term: {attributes.gc.heap.generation: gen2}}]
    type: increase            # 累計次數：5 分鐘內增加幾次
    op: ">="
    threshold: 5
    for: 5m
    by: [*ns, *pod]
    context: [*svc]

  # 記憶體不夠時丟 OutOfMemoryException。實測洩漏有兩種結局（同一支程式、同樣的設定，兩次不一樣）：
  #   1. 被容器的 OOM 砍掉、K8s 重開 → container.restarted 抓
  #   2. GC heap 碰到上限（容器記憶體的 75%）後程式不會結束：每個請求都丟 OutOfMemoryException、回 500，Gen2 GC 不停跑 → 這條抓
  #      （跟 Java 沒加 -XX:+ExitOnOutOfMemoryError 一樣，變成「活著但什麼都做不了」）
  - name: dotnet.out_of_memory
    title: .NET 丟出 OutOfMemoryException
    severity: critical
    index: metrics-*.otel-*
    field: metrics.dotnet.exceptions
    filter: [{term: {attributes.error.type: OutOfMemoryException}}]   # 實測：.NET 寫的是短名稱，沒有 System.
    type: increase
    op: ">="
    threshold: 1
    for: 5m
    by: [*ns, *pod]
    context: [*svc]

  # 執行緒池飢餓：同步等非同步（.Result、.Wait()）把執行緒卡住，工作在佇列裡排隊；CPU 很低、請求卻進不來
  - name: dotnet.thread_pool_starvation
    title: .NET 執行緒池飢餓（工作在排隊）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.dotnet.thread_pool.queue.length
    type: value
    op: ">="
    threshold: 10
    for: 2m
    min_ratio: 0.8
    by: [*ns, *pod]
    context: [*svc]

  # 執行緒暴增：.NET 6 以後偵測到「同步等 Task」（.Wait()、.Result）會馬上多開執行緒，佇列反而不會排（實測：佇列一直 0，
  # 執行緒 6 → 44 條、p95 2.5ms → 1.75 秒）。每個被卡住的請求佔一條執行緒，看「執行緒 ÷ CPU 核數」
  - name: dotnet.thread_pool_growth
    title: .NET 執行緒暴增（請求在同步等待，可能是 .Result／.Wait()）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.dotnet.thread_pool.thread.count
    join: {field: metrics.dotnet.process.cpu.count}
    den: [metrics.dotnet.process.cpu.count]
    type: ratio
    op: ">="
    threshold: 16             # 一核 16 條以上；平常非同步的服務大約一核幾條
    show: number              # 顯示「44」（條／核），不是 4400%
    for: 2m
    min_ratio: 0.8
    by: [*ns, *pod]
    context: [*svc]

  # ── .NET 8 以前（.NET 6、8）：自動埋點的 runtime 指標名稱是 process.runtime.dotnet.*（上面四條是 .NET 9 以後的 dotnet.*）。
  #    一個服務只會有其中一種名稱，不會重複報。HTTP、連線池兩版同名。
  - name: dotnet8.gen2_gc_frequent
    title: .NET Gen2 GC 太頻繁（記憶體清不掉）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.process.runtime.dotnet.gc.collections.count
    filter: [{term: {attributes.generation: gen2}}]
    type: increase
    op: ">="
    threshold: 5
    for: 5m
    by: [*ns, *pod]
    context: [*svc]

  # .NET 8 的例外數沒有分種類，看不出是不是 OutOfMemoryException；記憶體洩漏到底、程式沒結束時每個請求都丟例外
  - name: dotnet8.exceptions_burst
    title: .NET 例外暴增
    severity: warning
    index: metrics-*.otel-*
    field: metrics.process.runtime.dotnet.exceptions.count
    type: increase
    op: ">="
    threshold: 500            # 5 分鐘 500 次以上；依服務平常的量調，量差很多的話改用 baseline
    for: 5m
    by: [*ns, *pod]
    context: [*svc]

  - name: dotnet8.thread_pool_starvation
    title: .NET 執行緒池飢餓（工作在排隊）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.process.runtime.dotnet.thread_pool.queue.length
    type: value
    op: ">="
    threshold: 10
    for: 2m
    min_ratio: 0.8
    by: [*ns, *pod]
    context: [*svc]

  - name: dotnet8.thread_pool_growth
    title: .NET 執行緒暴增（請求在同步等待，可能是 .Result／.Wait()）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.process.runtime.dotnet.thread_pool.threads.count
    join: {field: metrics.process.cpu.count}
    den: [metrics.process.cpu.count]
    type: ratio
    op: ">="
    threshold: 16
    show: number
    for: 2m
    min_ratio: 0.8
    by: [*ns, *pod]
    context: [*svc]

  # 連線池（Npgsql 等用 OTLP 推的）：名稱跟 Java 的一樣是 db.client.connections.*，只是點分隔、維度叫 pool.name
  - name: db.pool_exhausted_otlp
    title: 資料庫連線池用光了
    severity: critical
    index: metrics-*.otel-*
    field: metrics.db.client.connections.usage
    filter: [{term: {attributes.state: used}}]
    join: {field: metrics.db.client.connections.max}
    den: [metrics.db.client.connections.max]
    type: ratio
    op: ">="
    threshold: 0.9
    for: 1m
    by: [*ns, *pod, attributes.pool.name]
    context: [*svc]

  # ── 訊息佇列（kafka_exporter 的名稱：kafka_consumergroup_lag_sum{consumergroup, topic}）──
  - name: kafka.consumer_lag
    title: Kafka 消費落後太多
    severity: warning
    index: metrics-*.otel-*
    field: metrics.kafka_consumergroup_lag_sum
    type: value
    op: ">="
    threshold: 10000          # 依每個 topic 的量調；量差很多的話改用 baseline（跟平常比）
    for: 3m
    min_ratio: 0.8
    by: [attributes.consumergroup, attributes.topic]

  - name: kafka.consumer_lag_growing
    title: Kafka 消費落後一直增加（消費者跟不上）
    severity: warning
    index: metrics-*.otel-*
    field: metrics.kafka_consumergroup_lag_sum
    type: delta               # 5 分鐘內落後淨增加超過 5,000 筆（消費者停了或變慢）。落後是量測值不是計數器，
                              # 用 increase 的話落後變少（追上來）會被當成歸零重來，反而報
    op: ">="
    threshold: 5000
    for: 5m
    by: [attributes.consumergroup, attributes.topic]

  # ── 機台與 EAP（名稱是平台提案，EAP 的 exporter 要照這個開，見 docs/metrics/README.md）──
  - name: eap.secs_disconnected
    title: 機台 SECS 通訊斷線
    severity: critical
    index: metrics-*.otel-*
    field: metrics.eap_secs_communicating
    type: value
    op: "=="
    threshold: 0
    for: 1m
    by: [attributes.equipment_id]
    context: [*svc]

  - name: eap.plc_scan_slow
    title: PLC 掃描週期超過規格
    severity: warning
    index: metrics-*.otel-*
    field: metrics.plc_scan_cycle_time_ms
    type: value
    op: ">="
    threshold: 50             # 規格上限（ms），依機型設；正常約 8ms
    for: 2m
    min_ratio: 0.8
    by: [attributes.equipment_id]
    context: [*svc]

  - name: eap.secs_retransmits
    title: SECS 封包重傳變多
    severity: warning
    index: metrics-*.otel-*
    field: metrics.eap_secs_retransmits_total
    type: increase
    op: ">="
    threshold: 10
    for: 5m
    by: [attributes.equipment_id]
    context: [*svc]
