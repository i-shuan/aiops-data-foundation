# 資料來源是 Elastic APM 時的 trace 設定（detector/trace.py、trace_merge.py）。寫法跟 configs/baseline/trace.yaml 一樣。
# raw 是 traces-apm-*（transaction、span 各一筆；detect/store/models.py 依索引名用 APM 的欄位轉：trace.id、parent.id、*.duration.us、
# event.outcome、span.destination.service.resource）。合成後的 traces-merged-* 跟 OTel 來源同一種格式，後面的全部照舊。
# 只寫跟預設值（detect/config/trace.py）不同的鍵。
raw_index: traces-apm-*
merge:
  settle_seconds: 30     # apm-server 批次送、ES refresh；比 Collector 多等一點

rules:
  repeated_calls: 20
  swallowed_rate: 0.05   # APM 的例外是獨立文件（logs-apm.error），沒接回 span，這條在 APM 資料上不會觸發（README）

