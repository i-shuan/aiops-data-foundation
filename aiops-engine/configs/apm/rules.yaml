# 資料來源是 Elastic APM 時的規則（detector/rules.py）。寫法跟 configs/baseline/rules.yaml 一樣。
# APM 只有應用層的資料：保底的錯誤率、p95 兩條能用；K8s 狀態（重啟、Pending、節點）、kubelet、cAdvisor、ntp、JVM／.NET runtime
# 那些 APM 不收，沒列。agent 有送 system metrics（metrics-apm.app.*）或 JVM metrics 時再加。

_tx: &tx metrics-apm.transaction.1m-*
_hist: &hist transaction.duration.histogram
_txf: &txf {bool: {filter: [{term: {metricset.name: transaction}}, {term: {transaction.type: request}}]}}
_txby: &txby [service.name, transaction.name]

rules:
  - name: http.error_rate_floor
    title: API 錯誤率超過 5%
    severity: critical
    type: window
    lookback: 5m
    index: *tx
    filter: *txf
    by: *txby
    value: {hist_ratio: {field: *hist, query: {term: {event.outcome: failure}}}}
    op: ">="
    threshold: 0.05
    min_events: 20
    show: pct

  - name: http.latency_p95_floor
    title: API p95 超過 2 秒
    severity: warning
    type: window
    lookback: 5m
    index: *tx
    filter: *txf
    by: *txby
    value: {percentile: {field: *hist, percent: 95}}
    scale: 1.0e-6          # 微秒 → 秒，threshold 寫秒
    op: ">="
    threshold: 2
    min_events: 20
    show: seconds
