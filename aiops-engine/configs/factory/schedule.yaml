# 工廠版的排程表（chart 的 values source: factory 會用這份；格式見 configs/schedule/schedule.yaml）。
# 沒有 train／detect／rules／peer／trace-*：異常由 ML、FDC 判，engine 從 ⑤ 開始接（ingest）；trace 換成履歷（paths-merge）。
timezone: Asia/Taipei
jobs:
  - name: ingest
    stage: 1
    cron: "* * * * *"
    queue: realtime
    timeout: 50
    args: [main, detector, ingest, --config, configs/factory/ingest.yaml, --window, 10m]
    why: ML 的異常跳點、FDC 鳴叫 → aiops-anomalies（最近 10 分鐘，重讀不重複）
  - name: alert
    stage: 1
    cron: "* * * * *"
    queue: alert
    timeout: 600
    args: [main, investigator, alert, --config, configs/factory/rca.yaml]
    why: 同機台合成一件、前後站、根因分析（慢在哪一站、壞 lot 的共同點、alarm／PM）、分類、心跳
  - name: paths-merge
    stage: 1
    cron: "*/5 * * * *"
    queue: realtime
    timeout: 240
    args: [main, detector, paths-merge, --config, configs/factory/paths.yaml, --window, 1d]
    why: MES 進出站＋S6F11 → 一個 lot 一筆履歷（lot-paths）
  - name: prune
    stage: 2
    cron: "30 3 * * *"
    queue: batch
    timeout: 600
    args: [main, detector, prune, --config, configs/baseline/prune.yaml]
    why: aiops-* 沒有 ILM，超過保留天數的每天清一次
