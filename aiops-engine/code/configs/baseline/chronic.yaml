# 慢性病清單（plugins/observability/chronic/chronic.py）：天天噴錯、沒人修的。baseline 會把它們學成平常、永遠不報，所以另外列出來讓人修。
# 每週跑一次（例如週一早上）：python3 -m detector chronic --config configs/baseline/chronic.yaml
# 結果寫 aiops-chronic（每週一份），並印成報告；修掉的下週自然消失。

days: 7          # 看最近幾天
min_days: 6      # 至少幾天有出現才算慢性病（7 天裡 6 天：週末量少那天沒出現也算）
top: 10          # 每個來源列前幾名
timezone: Asia/Taipei

sources:
  # 錯誤 log：依服務 × 例外種類（error.type；沒有的歸成「（無）」）
  - name: chronic.log_errors
    title: 天天有錯誤 log
    type: log
    index: k8s-*
    filter: {terms: {log.level: [error, fatal]}}
    by: [resource.attributes.service.name, error.type]
    keys: [service, error_type]
    min_per_day: 20      # 每天至少 20 筆才算那天「有」（零星一兩筆不算慢性病）

  # 規則、跟兄弟比：N+1、吞掉的例外、CPU 被限流、記憶體快滿、只有一個 Pod 壞……天天觸發
  - name: chronic.anomalies
    title: 天天觸發的規則
    type: anomalies
    levels: [rule, peer]
    min_per_day: 1

# 負責人：依對象找第一個符合的（match 欄位可用別名：service、namespace…）。沒有符合的顯示「未指定」
# 資料從哪來（sources/providers.py；格式、假資料見 interfaces/README.md、fake-data/README.md）：
#   owners         直接寫在這裡的（優先）
#   owners_source  讀檔案或 URL；多個來源合在一起，某個失敗只印警告
owners: []
owners_source:
  - provider: file
    path: fake-data/owners.json      # 【假資料】換成真的：改成 {provider: http, url: …}，或換掉這個檔
