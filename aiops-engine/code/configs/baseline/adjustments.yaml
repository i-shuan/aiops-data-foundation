# 調整（detector/adjust/adjust.py）：哪些資料不學、從哪裡重新學、哪些時段放寬。統計公式不動，用這些修正。
# 長期、人維護的規則寫這裡（進版控）；事故、換版這類事件用指令寫進 ES 的 aiops-tuning：
#   python3 -m detector adjust add --kind exclude_window --match service=^mes-api$ \
#       --start 2026-10-20T02:00:00+08:00 --end 2026-10-20T05:00:00+08:00 --reason "DB 鎖表事故"
#   python3 -m detector adjust add --kind reset_point --match service=^mes-api$ --at 2026-10-22T10:00:00+08:00 --reason "v2 上線"
#   python3 -m detector adjust list
# 之後 learning loop（值班回饋、CI/CD）也寫 aiops-tuning，status: proposed，人 approve 才生效。
#
# 共同欄位：
#   id        同 id 後面蓋前面（設定檔先、ES 後）
#   kind      exclude_window | reset_point | recurring_override（override 是 tune 的，寫在 series.yaml 的 overrides）
#   series    哪些序列，正規表示式（不寫就是全部，包含 trace.segment.*）
#   match     哪些對象，正規表示式；欄位可以用別名：service、namespace、pod、deployment、route、method
#   status    active（預設）| proposed（不生效，要 approve）
#   source    manual | feedback | cicd
#   expires_at 到期自動失效（選填）
#   時間沒寫時區（2026-10-20T02:00）就是台北時間（series.yaml 的 train.timezone）；adjust add 的 --start／--end／--at 也一樣
#   reason、by
#
# kind 各自的欄位：
#   exclude_window      start、end；apply_to: [train]（預設，不學）或 [train, detect]（也不報，例如維護中）
#   reset_point         reset_at：之前的歷史不學；之後 warmup（預設 24h）內不判斷，之後 baseline 要是重新學的才判斷
#   recurring_override  schedule: {cron: 開始時間（台北時間）, duration, days_of_month: [-1] = 每月最後一天}
#                       effect: {z | min_abs | mute: true, train: keep（預設）| exclude}
#                       只會放寬（變少報），不會變嚴；要調嚴用 tune

