# 根因分析讀哪裡
indices:
  anomalies: aiops-anomalies      # aiops-engine/code/configs/baseline 的 detect 寫的
  traces: traces-merged-*      # 一個請求一筆（detector trace-merge 合成）；raw 的每一段一筆只留 2 天
  logs: k8s-*
timezone: Asia/Taipei             # 報告裡的時間
compare_with: 7d                  # 「平常」= 一週前同一段時間
ref_gap: 10m                      # 一週前沒有資料時：改用出事前、同樣長的一段，中間空 10 分鐘（避開剛開始變壞的時候）
sample: 200                       # 出事時挑最慢的 200 個（再加最多 100 個出錯的）請求來比
interval: 5m                      # 跟 baseline 一樣：異常的時間是那 5 分鐘的開始

# 報告第 2 節：出事前的趨勢（前 6 段、每段 10 分鐘的 p95：一路往上＝慢慢惡化、平的然後跳＝突然）
trend: {windows: 6, window: 10m}
# 報告第 3 節之後：慢的請求有什麼共同點（出事時那批最慢的 vs 平常那批）
commonality:
  resource: [k8s.pod.name, service.version, k8s.node.name]   # 從 span 的 resource 看（值前面帶服務名）
  attrs: [lot.id, db.statement]                              # 從 span 的 attributes 看（業務 ID、SQL）
  min_share: 0.6                                             # 慢的請求裡至少六成有同一個值
  min_lift: 2                                                # 而且是平常比例的 2 倍以上（只有 1 個 Pod 時兩邊都 100%，不會列）

# 事件整合（python3 -m investigator alert）：同一個服務、時間接在一起的異常合成一件，寫 aiops-alerts；Grafana 讀它發通知
alerts:
  close_after: 30m                # 這個服務 30 分鐘沒有新的異常 → 這件結束（resolved）；30 分鐘內的都併進同一件
  lookback: 2h                    # 每次讀最近多久的異常
  # 嚴重度（investigator/alerts/severity.py）：critical／high／warning 依幾類黃金訊號、持續多久、換版後多久；只通知 critical、high
  # severity: {window: 15, min_coverage: 0.8, min_duration: 10, min_span_critical: 3, min_points_per_class: 2, deploy_grace: 10}
  # deploy_grace: false           # OTel 來源沒有 service.version 的 1 分鐘指標時關掉（查不到也只是不設上限）
  rca: true                       # 新的一件跑一次根因分析，結論寫進摘要、全文存 report（失敗不擋這一件；相似事故、LLM 也一樣）
  rca_retry: true                 # 開件太快、trace 還沒合成完（晚 1～2 分鐘）時第一份報告是空的：沒有 trace 的件隔一陣子重跑
  rca_retry_after: 2m             #   隔多久重跑一次
  rca_retry_max: 5                #   最多跑幾次（含第一次）；服務本來就沒埋點的，不會永遠重跑
  similar: true                   # 附上老師傅確認過的相似事故（investigator/similar/similar.py）
  llm: true                       # LLM 摘要（core/llm.py）：provider 由環境變數 LLM_PROVIDER 決定（template 不叫模型）；下面可以蓋過
  # llm_provider: template
  chain: true                     # 跨服務（一層）：下游出事連帶上游異常時只開一件、留下游；呼叫關係從這段時間的 trace 算
  chain_sample: 100               # 算呼叫關係時每個服務取最近幾個請求的 trace
  # feedback_url: http://aiops-api.aiops.svc:8080/feedback?alert={alert_id}   # 備用回饋網頁（aiops-engine/code/api）；通知裡的連結
  # report_url: http://aiops-api.aiops.svc:8080/report?alert={alert_id}       # 報告全文
