# 工廠版 ④ 接收器（detector ingest，程式 detector/ingest.py）：ML 團隊判好的異常跳點、FDC 鳴叫 → aiops-anomalies。
# engine 不自己判 FDC 感測值。右邊的欄位名全是假設（沒有 ML 輸出、FDC 的樣本），拿到樣本換右邊；左邊的 keys 名字
# （equipment、chamber、recipe、step、lot、parameter）是後面收斂、根因分析認的，不要改。
# 離線跑假資料：最上層加 source: {kind: file, format: events, files: {factory-ml-anomalies-*: data/ml.ndjson, …}} 與 store: {kind: file, dir: …}。
timezone: Asia/Taipei

inputs:
  # ML 團隊的異常跳點：一個 run（一個 lot 在一個 chamber 跑一個 recipe step）一個參數一筆
  - name: ml
    index: factory-ml-anomalies-*
    time_field: "@timestamp"
    filter: {term: {is_anomaly: true}}
    id_field: run_id                         # 同一筆重送不重複；沒有這欄就刪掉這行（改用時間＋對象＋序列＋值）
    series: "fdc.{parameter}"                # fdc.pressure、fdc.temperature…；嚴重度的參數家族看這個名字（rca.yaml 的 severity.classes）
    keys: {equipment: equipment_id, chamber: chamber_id, recipe: recipe_id, step: step_id, lot: lot_id, parameter: parameter}
    value: value
    expected: expected
    score: score                             # ML 的離群分數 → z；報告、Grafana 顯示用，不拿來判
    level: ml
    status: {field: grade, map: {strong: anomaly, weak: warning}, default: anomaly}   # weak 只併進已開著的件，不自己開
    severity: {field: grade, map: {strong: high, weak: warning}, default: warning}
    direction: {field: direction, default: up}
    message: "{parameter}={value}（平常 {expected}，score {score}）：{equipment_id} {chamber_id} {recipe_id}"   # 「：」前面是通知標題

  # FDC 鳴叫系統：參數超出 OOC／OOS 界限的紀錄
  - name: fdc
    index: factory-fdc-alarms-*
    time_field: "@timestamp"
    id_field: alarm_id
    series: "fdc.{parameter}"
    keys: {equipment: equipment_id, chamber: chamber_id, recipe: recipe_id, step: step_id, lot: lot_id, parameter: parameter}
    value: value
    expected: target
    level: fdc
    status: anomaly
    severity: {field: alarm_level, map: {OOS: critical, OOC: warning}, default: warning}   # OOS 直接 critical（rca.yaml 的 critical_levels 有 fdc）
    direction: {field: direction, default: up}
    message: "FDC {alarm_level} {parameter}={value}（界限 {limit}）：{equipment_id} {chamber_id} {recipe_id}"
