# IT 可觀測性（預設，AIOPS_PLUGIN=observability、AIOPS_SOURCE=otel）：對象是服務、「API」是 method＋route、
# trace 的呼叫關係決定誰連帶誰、版號第一次出現當換版。原始資料是我們的 Collector 寫的（k8s-*、metrics-*.otel-*、traces-generic.otel-*）。
name: observability
source: otel
schedule: configs/schedule/schedule.yaml

owner:                                   # dept／group 歸屬查哪裡（detect/store/owner_repo.py）
  index: metrics-*.otel-*
  namespace: resource.attributes.k8s.namespace.name
  service: resource.attributes.service.name
  dept: resource.attributes.dept
  group: resource.attributes.group
log:                                     # 根因分析讀 log 的欄位（incident/store/log_repo.py）；service.name、trace_id 是 alias，_source 裡沒有，用 fields 取
  index: k8s-*                           # 只有「OTel 是並存時的次要來源」才用（AIOPS_SOURCE=apm,otel）；主要來源用 rca.yaml 的 indices.logs
  service: resource.attributes.service.name
  level: log.level
  trace_id: trace_id
  message: [message]
  problem_levels: [warn, error, fatal]
  problem_query: null

domain:
  entity: 服務
  unit: 請求
  trace: Trace
  new_value_hint: 換版後的新 Pod、新版本
  categories:
    - [db, "DB（慢查詢、鎖、連線池、統計資訊）"]
    - [network, "網路（延遲、斷線、DNS）"]
    - [config_change, 設定變更]
    - [deploy, 版本更新]
    - [external, "外部系統（供應商、其他部門的服務）"]
    - [resource, "資源不足（CPU、記憶體、磁碟）"]
    - [bug, 程式錯誤]
    - [data, "資料問題（髒資料、量暴增）"]
    - [other, 其他]
  fp_reasons:
    - [batch, "月底 / 定時批次本來就這樣"]
    - [loadtest, "壓測、演練"]
    - [known_slow, 這支 API 本來就慢]
    - [low_volume, "量太少，幾筆就跳"]
    - [deploy, 換版期間]
    - [other, 其他]
  checked: ["Oracle AWR / 慢查詢", DB 連線池, "主機 CPU / 記憶體 / 磁碟", "網路 / DNS", Kibana log, trace 瀑布圖,
            Kafka lag, "近期的版本更新 / 設定變更", "上游 / 下游服務", 外部系統狀態]
  # 每一類根因「先查什麼」（報告最前面列；同一類已確認的事故裡老師傅勾過的 checked 排前面，不夠才用這裡的）
  checklists:
    db: ["Oracle AWR / 慢查詢", DB 連線池, 有沒有鎖表或長交易, 批次排程是不是剛好在跑, 統計資訊是不是過期]
    network: ["網路 / DNS", 同一台 node 上的其他服務有沒有一起慢, 防火牆 / LB 有沒有變更]
    config_change: ["近期的版本更新 / 設定變更", ConfigMap / 環境變數 / feature flag, 誰改的、能不能先退回]
    deploy: ["近期的版本更新 / 設定變更", 新版的 Pod 跟舊版比（trace 共同點的 service.version）, 能不能先退版]
    external: [外部系統狀態, 呼叫外部的逾時與重試設定, 供應商的公告]
    resource: ["主機 CPU / 記憶體 / 磁碟", Pod 有沒有被限流（throttling）或 OOM, 同儕的 Pod 是不是只有一隻異常]
    bug: [Kibana log, 例外的堆疊從哪一行開始, 只發生在某支 API 或某種輸入嗎]
    data: [量是不是暴增（流量、批次筆數）, 有沒有髒資料或特別大的單]

# 異常的 keys 裡哪個是服務（baseline、規則、peer、quality、trace 的寫法都不一樣）；caller／callee 是 trace 分段的
entity_keys: [resource.attributes.service.name, service, entry.service, service.name, caller, callee]
route: http
chain: {strategy: "incident.strategy.it_topology:CallEdges"}         # 跨服務（一層）：trace 裡誰呼叫誰
change: {strategy: "incident.strategy.it_deployment:VersionFirstSeen"} # 版號（service.version）第一次出現
critical_levels: [rule, peer, quality]
severity_classes: null                                           # null＝incident/alert_severity.CLASSES（黃金訊號）
sections: [anomalies, entries, segments, slowest, logs, changes, topology, conclusion]
commands: {}
