{{- /*
只負責「這個 Service 的 :9464/metrics 要被抓」。不寫 tenant、token、remoteWrite、group。

依 platform/vmstack-values.yaml，既有 vmagent 是這樣選到它的：
  - 沒設 serviceScrapeSelector / serviceScrapeNamespaceSelector，k8s-stack chart 預設 selectAllByDefault: true
    → 所有 namespace 的 VMServiceScrape 都會被選到，不需要特定 metadata label
  - scrapeClass「default」是 default: true，自動套用，抓的時候把 namespace 的 dept / group / system 帶進資料
    → 這裡不要寫 scrapeClass，寫了別的名字反而會換掉它
  - 依 group 分流是 vmagent 的三條 remoteWrite 做的，跟這個檔案無關
*/}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}   # 對的是 Service 的 label
  endpoints:
    - port: metrics                                    # 對的是 Service port 的名字
      path: /metrics
      # 跟正式 chart 一樣：Pod 的標準 label 蓋到每一筆 metrics 上，欄位名稱跟 log 一致
      relabelConfigs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          target_label: app
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          target_label: version
