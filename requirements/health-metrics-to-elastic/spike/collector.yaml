# 試驗用：一個 OpenTelemetry Collector，抓有標註的 pod，讀 namespace 的門牌，送進 Elasticsearch。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: obs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, endpoints, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: obs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: obs
data:
  config.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol/queue
        create_directory: true

    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: pods
              scrape_interval: 10s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: (.+);(\d+)
                  replacement: $$1:$$2
                  target_label: __address__

    processors:
      # 抓來的資料只知道對方的位址。先把位址放進 k8s.pod.ip，下一步才對得到是哪個 pod
      transform/podip:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["k8s.pod.ip"], attributes["server.address"]) where attributes["server.address"] != nil
              - set(attributes["k8s.pod.ip"], attributes["net.host.name"]) where attributes["k8s.pod.ip"] == nil and attributes["net.host.name"] != nil

      # 讀 pod 所在 namespace 的門牌
      k8sattributes:
        auth_type: serviceAccount
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name]
          labels:
            - tag_name: ns.tenant
              key: tenant
              from: namespace
            - tag_name: ns.dept
              key: dept
              from: namespace
            - tag_name: ns.system
              key: system
              from: namespace

      # 部門只認 namespace 的門牌：先丟掉程式自己帶的，再照門牌填；不在清單裡的一律算 platform
      transform/tenant:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - delete_key(attributes, "tenant")
              - delete_key(attributes, "site")
              - delete_key(attributes, "data_stream.namespace")
          - context: resource
            statements:
              - set(attributes["tenant"], "platform")
              - set(attributes["tenant"], attributes["ns.tenant"]) where attributes["ns.tenant"] != nil and IsMatch(attributes["ns.tenant"], "^(tsid|bsid|icsd|imc|platform)$")
              - set(attributes["dept"], attributes["ns.dept"]) where attributes["ns.dept"] != nil
              - set(attributes["system"], attributes["ns.system"]) where attributes["ns.system"] != nil
              - set(attributes["site"], "ctsp")
              - set(attributes["data_stream.namespace"], attributes["tenant"])

    exporters:
      elasticsearch:
        endpoints: [http://elasticsearch.obs.svc:9200]
        user: elastic
        password: ${env:ES_PASSWORD}
        mapping:
          mode: otel
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 100000
        # max_retries 寫 0 是「不重試」：Elasticsearch 一連不上資料就直接丟掉（實測過）。
        # 這裡給一個很大的數字，間隔最長 30 秒，等於一直重試到連上為止
        retry:
          enabled: true
          max_retries: 100000
          initial_interval: 1s
          max_interval: 30s
      debug:
        verbosity: basic

    service:
      extensions: [file_storage]
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [transform/podip, k8sattributes, transform/tenant]
          exporters: [elasticsearch]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: obs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          env:
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: password
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: queue
              mountPath: /var/lib/otelcol
          resources:
            limits:
              memory: 400Mi
      volumes:
        - name: conf
          configMap:
            name: otel-collector
        - name: queue
          emptyDir: {}
