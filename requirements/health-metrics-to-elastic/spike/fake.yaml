# 一個只回固定文字的假程式。NS、BODY 由 sed 換掉。有標註 prometheus.io/scrape 才會被抓。
apiVersion: v1
kind: ConfigMap
metadata: {name: fake, namespace: NS}
data:
  metrics: |
    BODY
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fake, namespace: NS}
spec:
  replicas: 1
  selector: {matchLabels: {app: fake}}
  template:
    metadata:
      labels: {app: fake}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fake
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: www, mountPath: /www}]
      volumes:
        - name: www
          configMap: {name: fake}
