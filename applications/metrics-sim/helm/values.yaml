# ── 給 ArgoCD 讀的：platform/applicationset.yaml 掃這個檔案產生 Application ──
# chart 本身不會用到這兩段，Helm 會直接忽略。
argocd:
  namespace: metrics-sim-dev
  project: ai-platform
  environment: development     # production 不可自動同步
  owner: platform-observability
  criticality: low
  autoSync: true

# ── 這個 app 的 observability identity，唯一的來源 ──
# 部署時照原值變成 namespace 的 label，vmagent 依 tenant 決定寫進哪個 AccountID。
observability:
  dept: PLATFORM               # 必填：這份資料是誰的
  tenant: platform             # 必填：tsid / bsid / icsd / imc / platform
  system: sim                  # 選填：業務系統

# ── 以下是一般的 Helm values ──

app:
  name: metrics-sim
  partOf: sim
  component: worker

image:
  repository: nexus.aillm.spil.com.tw/docker/sim/metrics-sim
  tag: "0.1.0"

replicas: 1

ports:
  metrics: 9464

probes:
  readiness:
    tcpSocket:
      port: metrics
  liveness:
    tcpSocket:
      port: metrics
    initialDelaySeconds: 10

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

otel:
  javaAgent:
    enabled: false

env:
  - name: SENSORS
    value: "4"
  - name: INTERVAL_SECONDS
    value: "5"
