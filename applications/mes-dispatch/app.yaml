# MES 下貨服務。格式照 devops repo 的 applications/<app>/app.yaml，可以整個資料夾直接搬過去。
# owner、dept 是範例值，搬過去時換成實際的。
apiVersion: platform.example.com/v1alpha1   # 對照你們現有的 app.yaml 填
kind: ArgoApplicationConfig
project: ai-platform
namespace: mes-dispatch-prod
environment: production
owner: mes-team
criticality: high

# production 不可自動同步 / prune（validate_application.py 的規則 3）
sync:
  automated: false
  prune: false
  selfHeal: false

helm:
  local: true            # chart 在同資料夾的 helm/
  valueFiles:
    - values.yaml        # 相對於 helm/

# ── 這個 app 的資料屬於誰、要送給誰 ────────────────────
# ApplicationSet 會把它貼到 namespace 上，vmagent 和 Fluentd 讀的就是那個。
# 規則見 platform/argocd/README.md。
observability:
  dept: D3120            # 必填，只有一個值
  system: mes            # 選填，分析用
  # group: it.imc        # 只有要同時給多個 tenant 看時才寫
