# ── 給 ArgoCD 讀的：platform/applicationset.yaml 掃這個檔案產生 Application ──
# chart 本身不會用到這兩段，Helm 會直接忽略。
argocd:
  namespace: mes-dispatch-prod
  project: ai-platform
  environment: production      # production 不可自動同步
  owner: mes-team
  criticality: high
  autoSync: false

# ── 這個 app 的 observability identity，唯一的來源 ──
# 部署時照原值變成 namespace 的 label，vmagent 依 group 決定送去哪個 tenant。
observability:
  dept: D3120                  # 必填：這份資料是誰的
  group: it                    # 必填：送到哪些 tenant。it / imc / it.imc / platform
  system: mes                  # 選填：業務系統

# ── 以下是一般的 Helm values ──

app:
  name: mes-dispatch           # 必須跟 services/ 底下的資料夾同名
  partOf: mes                  # 所屬系統
  component: api               # api / web / worker / batch / gateway

image:
  repository: nexus.aillm.spil.com.tw/docker/mes/mes-dispatch
  tag: "2.3.1"         # 版本號，不能用 latest

replicas: 2

ports:
  http: 8080
  metrics: 9464        # OpenTelemetry Prometheus exporter 的預設 port

probes:
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

# Java 服務：用 OpenTelemetry Java agent，程式不用改就會輸出標準 metrics，並把 trace_id 寫進 log
otel:
  javaAgent:
    enabled: true
    image: nexus.aillm.spil.com.tw/docker/open-telemetry/autoinstrumentation-java:2.10.0

# 應用自己的環境變數
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
