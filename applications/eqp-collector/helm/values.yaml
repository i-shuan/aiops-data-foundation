# 這次測試的設定來源。沒有 ArgoCD，namespace 和它的 label 由這個 chart 自己建立。
#
# 測其他租戶時只改 observability.tenant，再 helm upgrade 同一個 release：
#   tsid / bsid / icsd / imc → 寫進各自的 AccountID
#   platform、其他值或不寫   → 寫進兜底的 platform

namespace: eqp-collector-dev

observability:               # 照原值貼到 Namespace label，不查表、不推導；沒寫的欄位不會產生 label
  dept: D1110
  tenant: imc
  system: eqp

app:
  name: eqp-collector

image:
  repository: equipment-collector
  tag: test
  pullPolicy: Never          # image 是用 tar 手動 import 到 node 的，不會去 Nexus 拉

# 只能是 1：每個副本都會收全部 EQUIPMENT，開 2 個就重複收值。
replicas: 1

# image 只 import 到部分 node 時，把 Pod 釘在有 image 的那台，例如：
#   nodeSelector:
#     kubernetes.io/hostname: <node 名稱>
nodeSelector: {}

ports:
  http: 8080                 # /healthz、/readyz，只給 kubelet probe 用
  metrics: 9464              # vmagent 抓這裡

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 128Mi

env:                         # METRICS_PORT、HTTP_PORT 要跟上面的 ports 一樣，不一樣 chart 會直接失敗
  EQUIPMENT: "EQP001,EQP002,EQP003"
  PARAMS: "temperature,pressure,flow"
  INTERVAL_SECONDS: "10"
  SIMULATED_FAIL_RATE: "0.03"
  METRICS_PORT: "9464"
  HTTP_PORT: "8080"
