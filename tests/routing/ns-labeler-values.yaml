# 測試用的對照表，疊在 ns-labeler 預設的 values 上（helm 會合併 map）。
#
# 每一個 app 對應一個要驗證的情境。namespace 名稱是 zk-<app>-prod。
registry:
  apps:
    # 只送 IT：dept 屬於 IT，group 由 registry.groups 推出來
    sim-it:   {dept: D3120, system: sim}
    # 只送 IMC
    sim-imc:  {dept: D1110, system: sim}
    # 兩個都送：歸屬還是 IT（dept），但指定 group 送兩邊。
    # 故意不填 system，驗證「中間欄位空著時後面的欄位不會錯位」。
    sim-both: {dept: D3120, group: it.imc}

    # 以下兩個是「寫錯」的情境，ns-labeler 應該拒絕標，資料要掉進兜底，
    # 不能因為打錯字就送進錯的 tenant。
    sim-typo: {dept: D3120, system: sim, group: it.imcc}
    sim-plat: {dept: D3120, system: sim, group: it.platform}

    # sim-none 故意不登記：沒有歸屬 → 兜底

  namespaces:
    route-test: {dept: PLATFORM, system: platform}
