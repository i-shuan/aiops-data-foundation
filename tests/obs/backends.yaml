# 測試用的東西：一座單節點的 Elasticsearch，加三個假程式。每個假程式有兩個容器：
# fake 回固定文字給收集程式抓（數值），logger 每 2 秒印一行 log。
# fake-none 與 fake-spoof 另外有 tracer：每 3 秒自己送一段亂填身分的 trace。
# logger 收到 TERM 會結束，K8s 會把它重啟：run.sh restart 用這個驗容器重啟前後的 log。
# 正式的收集設定不在這裡，在 platform/otel/。run.sh 套用時只換位址與 cluster 名稱。
#
# 密碼不寫在這裡：run.sh 當場隨機產生，放進 Secret es-credentials。
# Elasticsearch 放在自己的 namespace，跟收集程式分開：正式環境它也不會跟收集程式住在一起。
apiVersion: v1
kind: Namespace
metadata:
  name: elastic
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: elastic
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: elasticsearch:9.5.3
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.license.self_generated.type
              value: basic
            # 不用 mmap，就不必去改節點的 vm.max_map_count
            - name: node.store.allow_mmap
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: password
          ports:
            - containerPort: 9200
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              memory: 1500Mi
            limits:
              memory: 2Gi
  # ⚠ 資料放 PVC：停機測試會把 Elasticsearch 整個停掉再開回來，資料要還在才驗得了補送
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elastic
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
---
# 情境一：namespace 沒貼門牌，程式還自己說它是 tsid → 要進 platform，自稱的值不能留下
apiVersion: v1
kind: Namespace
metadata:
  name: fake-none
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake
  namespace: fake-none
data:
  metrics: |
    fake_value{src="fake-none",tenant="tsid",site="fake"} 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake
  namespace: fake-none
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake
  template:
    metadata:
      labels:
        app: fake
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fake
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          volumeMounts:
            - name: www
              mountPath: /www
        # 每 2 秒印一行不是 JSON 的 log：要照樣收得到
        - name: logger
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              trap 'exit 1' TERM; i=0; while true; do i=$((i+1)); echo "plain text line $i, not json"; sleep 2; done
        # 每 3 秒自己送一段 trace 給收集程式，而且通通亂填：自稱是 tsid、廠區是 fake、
        # 自稱是 demo-tsid 這個 namespace 裡的 pod。收集程式不能信，要照它實際所在的 namespace
        - name: tracer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1)); t=$(date +%s)
                body=$(printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"fake-tracer"}},{"key":"tenant","value":{"stringValue":"tsid"}},{"key":"site","value":{"stringValue":"fake"}},{"key":"data_stream.namespace","value":{"stringValue":"tsid"}},{"key":"k8s.namespace.name","value":{"stringValue":"demo-tsid"}},{"key":"k8s.pod.name","value":{"stringValue":"demo-api-impostor"}},{"key":"k8s.pod.uid","value":{"stringValue":"00000000-0000-0000-0000-000000000000"}}]},"scopeSpans":[{"spans":[{"traceId":"%016x%016x","spanId":"%016x","name":"spoof","kind":1,"startTimeUnixNano":"%s000000000","endTimeUnixNano":"%s100000000","attributes":[{"key":"tenant","value":{"stringValue":"tsid"}},{"key":"cluster","value":{"stringValue":"fake"}}]}]}]}]}' $t $i $i $t $t)
                wget -q -O /dev/null --header 'Content-Type: application/json' --post-data "$body" http://otel-node-collector.otel-collector.svc:4318/v1/traces
                sleep 3
              done
      volumes:
        - name: www
          configMap:
            name: fake
---
# 情境二：門牌打錯字（tsidd，不在清單裡）→ 要進 platform
apiVersion: v1
kind: Namespace
metadata:
  name: fake-typo
  labels:
    tenant: tsidd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake
  namespace: fake-typo
data:
  metrics: |
    fake_value{src="fake-typo"} 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake
  namespace: fake-typo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake
  template:
    metadata:
      labels:
        app: fake
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fake
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          volumeMounts:
            - name: www
              mountPath: /www
        # 每 2 秒印一行 JSON，欄位用另一種命名（log.level、message），帶序號：停機補送用序號查有沒有漏、有沒有重複
        - name: logger
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              trap 'exit 1' TERM; i=0; while true; do i=$((i+1)); printf '{"log.level":"WARN","message":"other naming","seq":"%08d"}\n' $i; sleep 2; done
      volumes:
        - name: www
          configMap:
            name: fake
---
# 情境三：冒充。namespace 貼的是 bsid，程式自己說它是 tsid、廠區是 fake。
# target_info 那一行會變成整個程式的身分欄位，另一行是掛在單一數值上的。兩種都要被擋下，
# 資料要進 bsid，而且樣本上不能留著程式自稱的值。
apiVersion: v1
kind: Namespace
metadata:
  name: fake-spoof
  labels:
    tenant: bsid
    dept: D9999
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake
  namespace: fake-spoof
data:
  metrics: |
    target_info{tenant="tsid",site="fake",cluster="fake",dept="FAKE"} 1
    fake_value{src="fake-spoof",tenant="tsid",site="fake",cluster="fake"} 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake
  namespace: fake-spoof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake
  template:
    metadata:
      labels:
        app: fake
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fake
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          volumeMounts:
            - name: www
              mountPath: /www
        # 每 2 秒印一行冒充的 log：自稱 tsid；code 故意用文字，跟範例程式的數字型別衝突
        - name: logger
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              trap 'exit 1' TERM; i=0; while true; do i=$((i+1)); echo '{"level":"error","msg":"spoof","tenant":"tsid","site":"fake","cluster":"fake","code":"E42"}'; sleep 2; done
        # 每 3 秒自己送一段 trace 給收集程式，而且通通亂填：自稱是 tsid、廠區是 fake、
        # 自稱是 demo-tsid 這個 namespace 裡的 pod。收集程式不能信，要照它實際所在的 namespace
        - name: tracer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1)); t=$(date +%s)
                body=$(printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"fake-tracer"}},{"key":"tenant","value":{"stringValue":"tsid"}},{"key":"site","value":{"stringValue":"fake"}},{"key":"data_stream.namespace","value":{"stringValue":"tsid"}},{"key":"k8s.namespace.name","value":{"stringValue":"demo-tsid"}},{"key":"k8s.pod.name","value":{"stringValue":"demo-api-impostor"}},{"key":"k8s.pod.uid","value":{"stringValue":"00000000-0000-0000-0000-000000000000"}}]},"scopeSpans":[{"spans":[{"traceId":"%016x%016x","spanId":"%016x","name":"spoof","kind":1,"startTimeUnixNano":"%s000000000","endTimeUnixNano":"%s100000000","attributes":[{"key":"tenant","value":{"stringValue":"tsid"}},{"key":"cluster","value":{"stringValue":"fake"}}]}]}]}]}' $t $i $i $t $t)
                wget -q -O /dev/null --header 'Content-Type: application/json' --post-data "$body" http://otel-node-collector.otel-collector.svc:4318/v1/traces
                sleep 3
              done
      volumes:
        - name: www
          configMap:
            name: fake
