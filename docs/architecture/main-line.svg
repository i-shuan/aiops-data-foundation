<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="880" viewBox="0 0 1180 880" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1180" height="880" fill="#ffffff"/>

  <text x="40" y="34" font-size="21" font-weight="bold" fill="#0f172a">metrics 分流：只有一條路</text>
  <text x="40" y="58" font-size="13" fill="#64748b">app.yaml 是歸屬唯一的來源。vmagent 只看 namespace 的 label，不知道 app.yaml 的存在。</text>

  <!-- ═════════ 左：主線 ═════════ -->
  <rect x="40" y="76" width="520" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="58" y="100" font-size="14.5" font-weight="bold" fill="#5b21b6">① applications/&lt;app&gt;/app.yaml　— app 團隊</text>
  <text x="72" y="124" font-size="12.5" fill="#4c1d95" font-family="Consolas,'Courier New',monospace">observability:</text>
  <text x="88" y="142" font-size="12.5" fill="#4c1d95" font-family="Consolas,'Courier New',monospace">dept: D3120     # 必填</text>
  <text x="88" y="160" font-size="12.5" fill="#4c1d95" font-family="Consolas,'Courier New',monospace">system: mes     # group 不寫就依 dept 推出</text>
  <path d="M300,172 L300,198" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <text x="310" y="190" font-size="12" fill="#64748b">PR</text>

  <rect x="40" y="200" width="520" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="58" y="224" font-size="14.5" font-weight="bold" fill="#991b1b">② CI：ci/validate.sh</text>
  <text x="58" y="246" font-size="12" fill="#7f1d1d">observability 必填、欄位名沒打錯、dept 認得、group 合法、</text>
  <text x="58" y="262" font-size="12" fill="#7f1d1d">歸屬不矛盾、同一個 namespace 沒有被兩個 app 宣告</text>
  <path d="M300,270 L300,296" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <text x="310" y="288" font-size="12" fill="#64748b">merge</text>

  <rect x="40" y="298" width="520" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="322" font-size="14.5" font-weight="bold" fill="#1e40af">③ ArgoCD ApplicationSet　— 平台</text>
  <text x="58" y="344" font-size="12" fill="#1e3a8a">templatePatch：platform/argocd/namespace-metadata.tmpl</text>
  <text x="58" y="362" font-size="12" fill="#1e3a8a">dept → group 對照只在這一份。CreateNamespace + managedNamespaceMetadata</text>
  <path d="M300,378 L300,404" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>

  <rect x="40" y="406" width="520" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="58" y="430" font-size="14.5" font-weight="bold" fill="#065f46">④ Namespace metadata.labels</text>
  <text x="72" y="456" font-size="12.5" fill="#065f46" font-family="Consolas,'Courier New',monospace">dept=D3120   group=it   system=mes</text>
  <path d="M300,476 L300,502" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <text x="310" y="494" font-size="12" fill="#64748b">抓取時讀 namespace label</text>

  <rect x="40" y="504" width="520" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="58" y="528" font-size="14.5" font-weight="bold" fill="#92400e">⑤ vmagent　— 一個 cluster 一台，每個 target 只抓一次</text>
  <text x="58" y="550" font-size="12" fill="#78350f">platform/cluster-addons/vmstack-values.yaml</text>
  <text x="58" y="568" font-size="12" fill="#78350f">三條 remoteWrite，各自依 group 過濾、各自帶自己的 token</text>

  <path d="M150,584 L150,618" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <path d="M300,584 L300,618" stroke="#d97706" stroke-width="2" marker-end="url(#mo)"/>
  <path d="M450,584 L450,618" stroke="#64748b" stroke-width="2" marker-end="url(#m)"/>
  <text x="104" y="606" font-size="11" fill="#2563eb">token: it</text>
  <text x="238" y="606" font-size="11" fill="#d97706">token: imc</text>
  <text x="386" y="606" font-size="11" fill="#64748b">token: platform</text>

  <rect x="40" y="620" width="520" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="58" y="644" font-size="14.5" font-weight="bold" fill="#1e293b">⑥ 中央 vmauth　— 依 bearer token 決定 tenant</text>
  <text x="58" y="664" font-size="12" fill="#475569">三條都打同一個 URL，只差 token。tenant 設計由中央維護，這邊不碰</text>
  <path d="M120,676 L120,710" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <path d="M300,676 L300,710" stroke="#d97706" stroke-width="2" marker-end="url(#mo)"/>
  <path d="M480,676 L480,710" stroke="#64748b" stroke-width="2" marker-end="url(#m)"/>

  <rect x="40" y="712" width="160" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="84" y="743" font-size="14" font-weight="bold" fill="#1e40af">IT tenant</text>
  <rect x="220" y="712" width="160" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="258" y="743" font-size="14" font-weight="bold" fill="#92400e">IMC tenant</text>
  <rect x="400" y="712" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="422" y="743" font-size="14" font-weight="bold" fill="#334155">platform tenant</text>

  <!-- ═════════ 右上：分流規則 ═════════ -->
  <rect x="600" y="76" width="540" height="248" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="620" y="102" font-size="14.5" font-weight="bold" fill="#0f172a">vmagent 怎麼依 group 分流</text>
  <text x="630" y="132" font-size="13" fill="#0f172a" font-family="Consolas,'Courier New',monospace">group=it</text>
  <text x="820" y="132" font-size="13" fill="#1e40af">→ IT</text>
  <text x="630" y="160" font-size="13" fill="#0f172a" font-family="Consolas,'Courier New',monospace">group=imc</text>
  <text x="820" y="160" font-size="13" fill="#92400e">→ IMC</text>
  <text x="630" y="188" font-size="13" fill="#0f172a" font-family="Consolas,'Courier New',monospace">group=it.imc</text>
  <text x="820" y="188" font-size="13" font-weight="bold" fill="#0f172a">→ IT + IMC</text>
  <text x="630" y="216" font-size="13" fill="#0f172a">沒有 / 不合法</text>
  <text x="820" y="216" font-size="13" fill="#334155">→ platform（fallback）</text>
  <line x1="620" y1="232" x2="1120" y2="232" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="620" y="256" font-size="12" fill="#334155">IT 那條：keep group =~ <tspan font-family="Consolas,'Courier New',monospace">'(.*\.)?it(\..*)?'</tspan>　「以點切開，其中一段是 it」</text>
  <text x="620" y="280" font-size="12" font-weight="bold" fill="#b91c1c">不能寫成 'it'：只認單一值，it.imc 會被 IT 漏掉，而且不會報錯</text>
  <text x="620" y="304" font-size="12" fill="#334155">fallback 那條用 drop：不含任何 tenant 名稱的才收</text>

  <!-- ═════════ 右中：fan-out ═════════ -->
  <rect x="600" y="344" width="540" height="330" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="620" y="370" font-size="14.5" font-weight="bold" fill="#0f172a">group=it.imc：抓一次，送兩份</text>

  <rect x="770" y="388" width="200" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="808" y="416" font-size="13" font-weight="bold" fill="#92400e">vmagent 抓一次</text>
  <path d="M820,434 L730,470" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <path d="M920,434 L1010,470" stroke="#d97706" stroke-width="2" marker-end="url(#mo)"/>
  <text x="706" y="458" font-size="11" fill="#475569">複製</text>
  <text x="1000" y="458" font-size="11" fill="#475569">複製</text>

  <rect x="620" y="472" width="230" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="634" y="492" font-size="12.5" font-weight="bold" fill="#1e40af">IT 那條 remoteWrite</text>
  <text x="634" y="510" font-size="11.5" fill="#1e40af">token: it</text>
  <rect x="890" y="472" width="230" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="904" y="492" font-size="12.5" font-weight="bold" fill="#92400e">IMC 那條 remoteWrite</text>
  <text x="904" y="510" font-size="11.5" fill="#92400e">token: imc</text>
  <path d="M735,518 L735,546" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <path d="M1005,518 L1005,546" stroke="#d97706" stroke-width="2" marker-end="url(#mo)"/>

  <rect x="620" y="548" width="500" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="818" y="572" font-size="13" font-weight="bold" fill="#1e293b">中央 vmauth</text>
  <path d="M735,586 L735,614" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <path d="M1005,586 L1005,614" stroke="#d97706" stroke-width="2" marker-end="url(#mo)"/>

  <rect x="620" y="616" width="230" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="696" y="641" font-size="13" font-weight="bold" fill="#1e40af">IT tenant</text>
  <rect x="890" y="616" width="230" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="962" y="641" font-size="13" font-weight="bold" fill="#92400e">IMC tenant</text>

  <!-- ═════════ 右下：誰維護 ═════════ -->
  <rect x="600" y="694" width="540" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="620" y="718" font-size="14" font-weight="bold" fill="#0f172a">誰改什麼</text>
  <text x="620" y="740" font-size="12.5" fill="#334155">app 團隊：只改自己的 app.yaml（① 那格）</text>
  <text x="620" y="760" font-size="12.5" fill="#334155">平台：namespace-metadata.tmpl（dept → group）、vmstack-values.yaml</text>
  <text x="620" y="780" font-size="12.5" fill="#334155">中央：vmauth 的 token → tenant，這邊不碰</text>

  <!-- ═════════ 底 ═════════ -->
  <text x="40" y="806" font-size="13" fill="#334155">共用的資料在兩個 tenant 裡每一筆原始樣本的 timestamp 和 value 都一樣——是同一次抓取複製成兩份，不是抓兩次。已在本機 E2E 驗證。</text>
  <text x="40" y="830" font-size="13" fill="#334155">存進每個 tenant 的 group 一律改寫成那個 tenant 的名字：共用資料在 IT 裡是 group=it、在 IMC 裡是 group=imc。</text>
  <text x="40" y="854" font-size="13" font-weight="bold" fill="#0f172a">沒有第二條路：不存在 namespace 對照表、不存在另一個會寫 label 的元件。</text>
</svg>
