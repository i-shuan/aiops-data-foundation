<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="710" viewBox="0 0 1180 710" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1180" height="710" fill="#ffffff"/>

  <text x="40" y="34" font-size="21" font-weight="bold" fill="#0f172a">兩條 pipeline，不是同一條</text>

  <!-- lane 1 -->
  <text x="40" y="76" font-size="15" font-weight="bold" fill="#1e40af">① app 的 CI/CD　—　app 團隊自己的 repo，有 build image</text>
  <rect x="30" y="88" width="1120" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="60" y="110" width="150" height="68" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="84" y="138" font-size="13.5" font-weight="bold" fill="#1e40af">app repo</text>
  <text x="84" y="159" font-size="12" fill="#1e40af">程式碼</text>
  <path d="M210,144 L246,144" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="250" y="110" width="190" height="68" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="268" y="138" font-size="13.5" font-weight="bold" fill="#1e40af">stage 1：build image</text>
  <text x="268" y="159" font-size="12" fill="#1e40af">打包、推到 image registry</text>
  <path d="M440,144 L476,144" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="480" y="110" width="210" height="68" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="496" y="134" font-size="13.5" font-weight="bold" fill="#991b1b">stage 2：部署前檢查（新增）</text>
  <text x="496" y="153" font-size="12" fill="#991b1b">目標 namespace 有沒有 dept？</text>
  <text x="496" y="170" font-size="12" font-weight="bold" fill="#991b1b">沒有就 fail，不要讓它上線</text>
  <path d="M690,144 L726,144" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="730" y="110" width="160" height="68" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="748" y="138" font-size="13.5" font-weight="bold" fill="#1e40af">stage 3：deploy</text>
  <text x="748" y="159" font-size="12" fill="#1e40af">app-common 產生規格</text>
  <path d="M890,144 L926,144" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="930" y="110" width="200" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="950" y="138" font-size="13.5" font-weight="bold" fill="#065f46">namespace + pod 在跑</text>
  <text x="950" y="159" font-size="12" fill="#065f46">這裡不知道 tenant / group</text>

  <!-- middle -->
  <path d="M1030,192 L1030,398" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)" marker-start="url(#bs)"/>
  <text x="700" y="262" font-size="13.5" font-weight="bold" fill="#334155">兩條 pipeline 唯一的交會點</text>
  <text x="700" y="283" font-size="12.5" fill="#475569">就是同一個 namespace 物件：</text>
  <text x="700" y="303" font-size="12.5" fill="#475569">一條把它建出來，另一條在上面標歸屬。</text>
  <text x="700" y="323" font-size="12.5" fill="#475569">兩邊不用互相知道對方存在。</text>

  <rect x="60" y="236" width="600" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="262" font-size="13.5" font-weight="bold" fill="#0f172a">為什麼平台那條沒有 build image</text>
  <text x="80" y="285" font-size="12.5" fill="#334155">要進 cluster 的只有一份 chart 和一份 values，沒有任何東西要編譯或打包。</text>
  <text x="80" y="306" font-size="12.5" fill="#334155">CronJob 用的是現成的公開映像（alpine/k8s），不是我們自己 build 的。</text>
  <text x="80" y="327" font-size="12.5" fill="#334155">所以這條 pipeline 只有一個 stage：把 ConfigMap apply 到每一個 cluster。</text>

  <!-- lane 2 -->
  <text x="40" y="380" font-size="15" font-weight="bold" fill="#92400e">② 平台的 CI/CD　—　平台團隊的 repo，沒有 build image</text>
  <rect x="30" y="392" width="1120" height="104" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>

  <rect x="60" y="414" width="150" height="68" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="80" y="442" font-size="13.5" font-weight="bold" fill="#92400e">platform repo</text>
  <text x="80" y="463" font-size="12" fill="#92400e">values.yaml 對照表</text>
  <path d="M210,448 L246,448" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="250" y="414" width="190" height="68" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="280" y="442" font-size="13.5" font-weight="bold" fill="#64748b">沒有 build 這一段</text>
  <text x="268" y="463" font-size="12" fill="#64748b">純設定，沒東西要打包</text>
  <path d="M440,448 L476,448" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="480" y="414" width="210" height="68" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="498" y="442" font-size="13.5" font-weight="bold" fill="#92400e">唯一的 stage：apply</text>
  <text x="498" y="463" font-size="12" font-weight="bold" fill="#92400e">central / zk / el 三個都要推</text>
  <path d="M690,448 L726,448" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="730" y="414" width="160" height="68" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="748" y="442" font-size="13.5" font-weight="bold" fill="#92400e">ns-labeler</text>
  <text x="748" y="463" font-size="12" fill="#92400e">每 10 分鐘對帳一次</text>
  <path d="M890,448 L926,448" stroke="#475569" stroke-width="2" marker-end="url(#b)"/>

  <rect x="930" y="414" width="200" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="950" y="442" font-size="13.5" font-weight="bold" fill="#065f46">同一個 namespace</text>
  <text x="950" y="463" font-size="12" fill="#065f46">被標上 dept / group / system</text>

  <!-- timing callout -->
  <rect x="30" y="528" width="1120" height="152" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="52" y="556" font-size="15.5" font-weight="bold" fill="#991b1b">順序：平台那條要先跑完</text>
  <text x="52" y="584" font-size="13" fill="#7f1d1d">新 app 上線的正確流程是「先在 registry 加一行並合進去，等對帳跑過，app 再部署」。</text>
  <text x="52" y="609" font-size="13" fill="#7f1d1d">反過來的話，app 先上線、對照表後補，中間那段時間的 metrics 和 log 會進 unassigned —— <tspan font-weight="bold">而且補登記之後不會搬回來</tspan>，</text>
  <text x="52" y="632" font-size="13" fill="#7f1d1d">因為資料早就寫進別的 tenant 和 index 了。那段歷史就是錯的，AIOps 之後學基準線會學到錯的資料。</text>
  <text x="52" y="662" font-size="13" font-weight="bold" fill="#991b1b">所以上面那個「部署前檢查」要加：把一個會被忽略的靜默錯誤，變成一個擋得住的部署失敗。</text>
</svg>
