<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="-apple-system, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" role="img">
  <title>一個 cluster 一台 vmagent vs 一個 namespace 一台</title>
  <desc>左邊是一個 cluster 一台 vmagent，所有 namespace 的資料集中到同一台，用同一把 token 送往中央；右邊是每個 namespace 各自有 vmagent 與 Secret，各自帶自己的 token 送出。victoria-metrics-k8s-stack 的共用 values 產生的是左邊那種。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="540" fill="#ffffff"/>

  <rect x="30" y="50" width="300" height="226" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="46" y="70" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">A：一個 cluster 一台</text>
  <rect x="350" y="50" width="300" height="226" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="366" y="70" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">B：一個 namespace 一台</text>

  <line x1="86" y1="134" x2="120" y2="178" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="182" y1="134" x2="180" y2="178" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="278" y1="134" x2="240" y2="178" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="252" x2="180" y2="318" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="408" y1="172" x2="408" y2="318" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="504" y1="172" x2="504" y2="318" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="172" x2="600" y2="318" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="46" y="90" width="80" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="86" y="112" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">ns 1</text>
  <rect x="142" y="90" width="80" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="182" y="112" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">ns 2</text>
  <rect x="238" y="90" width="80" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="278" y="112" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">ns 3</text>

  <rect x="60" y="180" width="240" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="180" y="200" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">vmagent（只有 1 台）</text>
  <text x="180" y="222" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">全 cluster 全收</text>
  <text x="180" y="240" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">1 把 token，全進同一個 tenant</text>

  <rect x="366" y="100" width="84" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="408" y="120" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">ns 1</text>
  <text x="408" y="142" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">vmagent</text>
  <text x="408" y="160" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Secret</text>
  <rect x="462" y="100" width="84" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="504" y="120" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">ns 2</text>
  <text x="504" y="142" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">vmagent</text>
  <text x="504" y="160" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Secret</text>
  <rect x="558" y="100" width="84" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="600" y="120" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">ns 3</text>
  <text x="600" y="142" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">vmagent</text>
  <text x="600" y="160" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Secret</text>

  <rect x="30" y="320" width="620" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="338" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">中央 vmauth</text>
  <text x="340" y="356" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">依 token 決定進哪個 tenant</text>

  <rect x="30" y="420" width="620" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="438" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">共用 values 產生的是 A</text>
  <text x="340" y="456" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">B 要另外部署；兩套並存＝同一批資料被收兩次</text>

  <circle cx="150" cy="510" r="4" fill="#1D9E75"/>
  <text x="160" y="510" font-size="12" fill="#5F5E5A" dominant-baseline="central">A：目前共用 values 的樣子</text>
  <circle cx="380" cy="510" r="4" fill="#7F77DD"/>
  <text x="390" y="510" font-size="12" fill="#5F5E5A" dominant-baseline="central">B：另一種架構</text>
</svg>
