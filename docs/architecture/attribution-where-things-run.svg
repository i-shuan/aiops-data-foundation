<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="840" viewBox="0 0 1180 840" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1180" height="840" fill="#ffffff"/>

  <text x="40" y="34" font-size="21" font-weight="bold" fill="#0f172a">對照表放哪、labeler 跑在哪</text>

  <!-- git -->
  <rect x="40" y="54" width="1100" height="140" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="62" y="82" font-size="15" font-weight="bold" fill="#5b21b6">Git（devops repo）cluster-addons/ns-labeler/　—　人只改這裡，全部 cluster 共用同一份</text>
  <text x="72" y="110" font-size="13" fill="#1e293b">values.yaml　registry.apps</text>
  <text x="270" y="110" font-size="13" fill="#64748b">app → 部門</text>
  <text x="400" y="110" font-size="13" font-weight="bold" fill="#7c3aed">← 新 app 上線</text>
  <text x="72" y="134" font-size="13" fill="#1e293b">values.yaml　registry.namespaces</text>
  <text x="270" y="134" font-size="13" fill="#64748b">例外 + 平台自己的 namespace</text>
  <text x="72" y="158" font-size="13" fill="#1e293b">values.yaml　registry.groups</text>
  <text x="270" y="158" font-size="13" fill="#64748b">部門 → group</text>
  <text x="400" y="158" font-size="13" font-weight="bold" fill="#7c3aed">← 改組只改這裡</text>
  <text x="640" y="110" font-size="13" fill="#1e293b">ns-labeler chart</text>
  <text x="840" y="110" font-size="13" fill="#64748b">對帳腳本</text>
  <text x="640" y="134" font-size="13" fill="#1e293b">發佈到內部 Helm repo</text>
  <text x="840" y="134" font-size="13" fill="#64748b">版本釘選</text>
  <text x="640" y="158" font-size="12" fill="#94a3b8">chart 發一次，對照表改 values 就好</text>

  <!-- bus -->
  <path d="M590,194 L590,216" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M210,216 L970,216" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M210,216 L210,250" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M590,216 L590,250" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M970,216 L970,250" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="598" y="210" font-size="12.5" fill="#475569">cluster-addons 的 ApplicationSet 部到每個 cluster（內容完全相同，不需要每廠一份）</text>

  <!-- cluster 1: central -->
  <rect x="40" y="254" width="340" height="312" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="58" y="280" font-size="15" font-weight="bold" fill="#0f172a">central cluster</text>
  <text x="58" y="298" font-size="11.5" fill="#64748b">也是中央接收層的所在</text>
  <rect x="56" y="308" width="308" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="70" y="330" font-size="13" font-weight="bold" fill="#92400e">ns-labeler CronJob（每 10 分鐘）</text>
  <text x="70" y="352" font-size="12" fill="#92400e">+ 對照表 ConfigMap</text>
  <path d="M210,368 L210,394" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="56" y="394" width="308" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="70" y="416" font-size="13" font-weight="bold" fill="#065f46">namespace 被標上</text>
  <text x="70" y="438" font-size="12.5" fill="#065f46">dept=D3120　group=it</text>
  <path d="M210,458 L210,484" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="56" y="484" width="146" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="80" y="508" font-size="13" font-weight="bold" fill="#1e40af">vmagent</text>
  <text x="70" y="526" font-size="11" fill="#1e40af">讀 label 分三條</text>
  <rect x="216" y="484" width="148" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="242" y="508" font-size="13" font-weight="bold" fill="#1e40af">Fluentd</text>
  <text x="230" y="526" font-size="11" fill="#1e40af">讀 label 改 tag</text>

  <!-- cluster 2: zk -->
  <rect x="420" y="254" width="340" height="312" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="438" y="280" font-size="15" font-weight="bold" fill="#0f172a">zk cluster（中科）</text>
  <text x="438" y="298" font-size="11.5" fill="#64748b">地端</text>
  <rect x="436" y="308" width="308" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="450" y="330" font-size="13" font-weight="bold" fill="#92400e">ns-labeler CronJob（每 10 分鐘）</text>
  <text x="450" y="352" font-size="12" fill="#92400e">+ 對照表 ConfigMap</text>
  <path d="M590,368 L590,394" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="436" y="394" width="308" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="450" y="416" font-size="13" font-weight="bold" fill="#065f46">zk-mes-prod → dept=D3120 group=it</text>
  <text x="450" y="438" font-size="12.5" fill="#065f46">zk-wip-prod → dept=D1110 group=imc</text>
  <path d="M590,458 L590,484" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="436" y="484" width="146" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="460" y="508" font-size="13" font-weight="bold" fill="#1e40af">vmagent</text>
  <text x="450" y="526" font-size="11" fill="#1e40af">讀 label 分三條</text>
  <rect x="596" y="484" width="148" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="622" y="508" font-size="13" font-weight="bold" fill="#1e40af">Fluentd</text>
  <text x="610" y="526" font-size="11" fill="#1e40af">讀 label 改 tag</text>

  <!-- cluster 3: el -->
  <rect x="800" y="254" width="340" height="312" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="818" y="280" font-size="15" font-weight="bold" fill="#0f172a">el cluster（二林）</text>
  <text x="818" y="298" font-size="11.5" fill="#64748b">地端</text>
  <rect x="816" y="308" width="308" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="830" y="330" font-size="13" font-weight="bold" fill="#92400e">ns-labeler CronJob（每 10 分鐘）</text>
  <text x="830" y="352" font-size="12" fill="#92400e">+ 對照表 ConfigMap</text>
  <path d="M970,368 L970,394" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="816" y="394" width="308" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="830" y="416" font-size="13" font-weight="bold" fill="#065f46">el-mes-prod → dept=D3120 group=it</text>
  <text x="830" y="438" font-size="12.5" fill="#065f46">對不到的 → 不標，等告警</text>
  <path d="M970,458 L970,484" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="816" y="484" width="146" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="840" y="508" font-size="13" font-weight="bold" fill="#1e40af">vmagent</text>
  <text x="830" y="526" font-size="11" fill="#1e40af">讀 label 分三條</text>
  <rect x="976" y="484" width="148" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1002" y="508" font-size="13" font-weight="bold" fill="#1e40af">Fluentd</text>
  <text x="990" y="526" font-size="11" fill="#1e40af">讀 label 改 tag</text>

  <!-- arrows into central layer -->
  <path d="M129,536 L129,630" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M509,536 L200,630" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M889,536 L270,630" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M290,536 L700,630" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M670,536 L760,630" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <path d="M1050,536 L820,630" stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>

  <!-- central receiving layer -->
  <rect x="40" y="634" width="1100" height="118" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="62" y="660" font-size="15" font-weight="bold" fill="#991b1b">中央接收層（跑在 central cluster 裡，tenant 設計由對方維護，我們不碰）</text>
  <rect x="62" y="676" width="150" height="46" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="84" y="698" font-size="13" font-weight="bold" fill="#991b1b">vmauth</text>
  <text x="72" y="715" font-size="11" fill="#991b1b">依 bearer token</text>
  <path d="M212,699 L246,699" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="250" y="676" width="260" height="46" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="264" y="698" font-size="12.5" fill="#991b1b">tenant：it ／ imc ／ platform</text>
  <text x="264" y="715" font-size="11" fill="#991b1b">metrics 落點</text>
  <rect x="600" y="676" width="150" height="46" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="614" y="698" font-size="13" font-weight="bold" fill="#991b1b">Elasticsearch</text>
  <text x="614" y="715" font-size="11" fill="#991b1b">依 API key</text>
  <path d="M750,699 L784,699" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="788" y="676" width="330" height="46" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="802" y="698" font-size="12.5" fill="#991b1b">k8s-it-* ／ k8s-imc-* ／ k8s-unassigned-*</text>
  <text x="802" y="715" font-size="11" fill="#991b1b">log 落點</text>

  <text x="40" y="786" font-size="12.5" fill="#334155">① labeler 每個 cluster 都要有一份。namespace label 是 cluster 內的物件，central 改不到別的 cluster 的 namespace。</text>
  <text x="40" y="808" font-size="12.5" fill="#334155">② 對照表全廠共用同一份，擴廠時只要在 cluster-addons 的 list 加一行，新廠就會自動拿到 labeler。</text>
  <text x="40" y="830" font-size="12.5" fill="#334155">③ 藍色虛線是 metrics、綠色虛線是 log。central 自己的 vmagent／Fluentd 也一樣要走這條路，它沒有特權。</text>
</svg>
