<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <marker id="aIT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="aIMC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1240" height="720" fill="#ffffff"/>

  <text x="36" y="32" font-size="21" font-weight="bold" fill="#0f172a">metrics 分流：tenant 從「依廠分」改成「依組織分」</text>
  <text x="36" y="56" font-size="13" fill="#64748b">重點在右圖的線會交叉：兩個廠的同一個組織進同一個 tenant。沒有交叉就等於沒改。</text>

  <line x1="592" y1="76" x2="592" y2="700" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ══════════ BEFORE ══════════ -->
  <text x="36" y="92" font-size="16" font-weight="bold" fill="#991b1b">Before　一把 token，tenant 依「廠」分</text>

  <!-- 中科 -->
  <rect x="36" y="102" width="340" height="196" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="48" y="112" width="92" height="22" fill="#fde047"/>
  <text x="53" y="128" font-size="13.5" font-weight="bold" fill="#0f172a">中科 Cluster</text>
  <text x="50" y="152" font-size="11" fill="#64748b">Application layer</text>
  <rect x="50" y="158" width="104" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="62" y="178" font-size="12" font-weight="bold" fill="#1e40af">NS1・IT</text>
  <text x="62" y="196" font-size="11" fill="#1e40af">App / Svc</text>
  <rect x="162" y="158" width="104" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="174" y="178" font-size="12" font-weight="bold" fill="#92400e">NS2・IMC</text>
  <text x="174" y="196" font-size="11" fill="#92400e">App / Svc</text>
  <rect x="274" y="158" width="88" height="50" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="286" y="178" font-size="12" font-weight="bold" fill="#334155">NS3・平台</text>
  <text x="286" y="196" font-size="11" fill="#334155">node-exp</text>
  <line x1="50" y1="220" x2="362" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="238" font-size="11" fill="#64748b">Platform layer</text>
  <rect x="50" y="244" width="312" height="46" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="62" y="263" font-size="12.5" font-weight="bold" fill="#991b1b">vmagent（只有一台）</text>
  <text x="62" y="281" font-size="11.5" fill="#991b1b">一把 token，三種資料全收全送</text>

  <!-- 二林 -->
  <rect x="36" y="314" width="340" height="196" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="48" y="324" width="92" height="22" fill="#fde047"/>
  <text x="53" y="340" font-size="13.5" font-weight="bold" fill="#0f172a">二林 Cluster</text>
  <text x="50" y="364" font-size="11" fill="#64748b">Application layer</text>
  <rect x="50" y="370" width="104" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="62" y="390" font-size="12" font-weight="bold" fill="#1e40af">NS1・IT</text>
  <text x="62" y="408" font-size="11" fill="#1e40af">App / Svc</text>
  <rect x="162" y="370" width="104" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="174" y="390" font-size="12" font-weight="bold" fill="#92400e">NS2・IMC</text>
  <text x="174" y="408" font-size="11" fill="#92400e">App / Svc</text>
  <rect x="274" y="370" width="88" height="50" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="286" y="390" font-size="12" font-weight="bold" fill="#334155">NS3・平台</text>
  <text x="286" y="408" font-size="11" fill="#334155">node-exp</text>
  <line x1="50" y1="432" x2="362" y2="432" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="450" font-size="11" fill="#64748b">Platform layer</text>
  <rect x="50" y="456" width="312" height="46" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="62" y="475" font-size="12.5" font-weight="bold" fill="#991b1b">vmagent（只有一台）</text>
  <text x="62" y="493" font-size="11.5" fill="#991b1b">一把 token，三種資料全收全送</text>

  <!-- 中央 before -->
  <rect x="412" y="168" width="162" height="220" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="424" y="192" font-size="13" font-weight="bold" fill="#991b1b">中央 vmauth</text>
  <rect x="424" y="204" width="138" height="56" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="436" y="224" font-size="12" font-weight="bold" fill="#991b1b">tenant 中科</text>
  <text x="436" y="242" font-size="10.5" fill="#b91c1c">IT + IMC 混在一起</text>
  <rect x="424" y="270" width="138" height="56" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="436" y="290" font-size="12" font-weight="bold" fill="#991b1b">tenant 二林</text>
  <text x="436" y="308" font-size="10.5" fill="#b91c1c">IT + IMC 混在一起</text>
  <text x="436" y="356" font-size="14" fill="#b91c1c">…</text>

  <path d="M376,266 L408,236" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#aR)"/>
  <path d="M376,478 L408,302" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#aR)"/>

  <!-- before 問題 -->
  <rect x="36" y="528" width="538" height="106" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="52" y="552" font-size="13.5" font-weight="bold" fill="#991b1b">問題出在 tenant 是按「廠」切的</text>
  <text x="52" y="578" font-size="12.5" fill="#7f1d1d">① 同一個 tenant 裡混著 IT 和 IMC 的資料，沒辦法只讓 IT 看到自己的。</text>
  <text x="52" y="602" font-size="12.5" fill="#7f1d1d">② 中科的 IT 和二林的 IT 在不同 tenant，同一套系統跨廠比對不了。</text>
  <text x="52" y="624" font-size="12.5" fill="#7f1d1d">③ 平台自己的 node-exporter 也混在裡面，佔用應用團隊的配額。</text>

  <!-- ══════════ AFTER ══════════ -->
  <text x="610" y="92" font-size="16" font-weight="bold" fill="#065f46">After　三把 token，tenant 依「組織」分，跨廠共用</text>

  <!-- 中科 after -->
  <rect x="608" y="102" width="352" height="196" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="620" y="112" width="92" height="22" fill="#fde047"/>
  <text x="625" y="128" font-size="13.5" font-weight="bold" fill="#0f172a">中科 Cluster</text>
  <text x="622" y="152" font-size="11" fill="#64748b">Application layer　　應用完全不知道 tenant 的存在</text>
  <rect x="622" y="158" width="108" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="632" y="177" font-size="12" font-weight="bold" fill="#1e40af">NS1・IT</text>
  <text x="632" y="195" font-size="10.5" fill="#1e40af">dept=D3120</text>
  <rect x="738" y="158" width="108" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="748" y="177" font-size="12" font-weight="bold" fill="#92400e">NS2・IMC</text>
  <text x="748" y="195" font-size="10.5" fill="#92400e">dept=D1110</text>
  <rect x="854" y="158" width="94" height="50" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="864" y="177" font-size="12" font-weight="bold" fill="#334155">NS3・平台</text>
  <text x="864" y="195" font-size="10.5" fill="#334155">無 dept</text>
  <line x1="622" y1="220" x2="948" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="622" y="238" font-size="11" fill="#64748b">Platform layer</text>
  <rect x="622" y="244" width="326" height="46" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="634" y="263" font-size="12.5" font-weight="bold" fill="#065f46">vmagent（還是只有一台，抓取只有一次）</text>
  <text x="634" y="281" font-size="11.5" fill="#065f46">三條 remoteWrite，依 dept 過濾、各帶自己的 token</text>

  <!-- 二林 after -->
  <rect x="608" y="314" width="352" height="196" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="620" y="324" width="92" height="22" fill="#fde047"/>
  <text x="625" y="340" font-size="13.5" font-weight="bold" fill="#0f172a">二林 Cluster</text>
  <text x="622" y="364" font-size="11" fill="#64748b">Application layer</text>
  <rect x="622" y="370" width="108" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="632" y="389" font-size="12" font-weight="bold" fill="#1e40af">NS1・IT</text>
  <text x="632" y="407" font-size="10.5" fill="#1e40af">dept=D3130</text>
  <rect x="738" y="370" width="108" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="748" y="389" font-size="12" font-weight="bold" fill="#92400e">NS2・IMC</text>
  <text x="748" y="407" font-size="10.5" fill="#92400e">dept=D1120</text>
  <rect x="854" y="370" width="94" height="50" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="864" y="389" font-size="12" font-weight="bold" fill="#334155">NS3・平台</text>
  <text x="864" y="407" font-size="10.5" fill="#334155">無 dept</text>
  <line x1="622" y1="432" x2="948" y2="432" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="622" y="450" font-size="11" fill="#64748b">Platform layer</text>
  <rect x="622" y="456" width="326" height="46" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="634" y="475" font-size="12.5" font-weight="bold" fill="#065f46">vmagent（還是只有一台，抓取只有一次）</text>
  <text x="634" y="493" font-size="11.5" fill="#065f46">三條 remoteWrite，依 dept 過濾、各帶自己的 token</text>

  <!-- 中央 after -->
  <rect x="1032" y="128" width="180" height="300" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1044" y="152" font-size="13" font-weight="bold" fill="#991b1b">中央 vmauth</text>
  <text x="1044" y="169" font-size="10.5" fill="#b91c1c">依 bearer token 決定 tenant</text>
  <rect x="1044" y="178" width="156" height="56" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1056" y="198" font-size="12.5" font-weight="bold" fill="#1e40af">tenant　IT</text>
  <text x="1056" y="216" font-size="10.5" fill="#1e40af">中科 + 二林的 IT 都在這</text>
  <rect x="1044" y="244" width="156" height="56" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1056" y="264" font-size="12.5" font-weight="bold" fill="#92400e">tenant　IMC</text>
  <text x="1056" y="282" font-size="10.5" fill="#92400e">中科 + 二林的 IMC 都在這</text>
  <rect x="1044" y="310" width="156" height="56" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="1056" y="330" font-size="12.5" font-weight="bold" fill="#334155">tenant　平台</text>
  <text x="1056" y="348" font-size="10.5" fill="#334155">兜底，不能省</text>
  <text x="1044" y="392" font-size="10.5" fill="#991b1b">廠別沒有消失：每筆資料上的</text>
  <text x="1044" y="409" font-size="10.5" font-weight="bold" fill="#991b1b">cluster 欄位還分得出來</text>

  <!-- 交叉線 -->
  <path d="M960,252 L1028,200" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#aIT)"/>
  <path d="M960,267 L1028,266" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#aIMC)"/>
  <path d="M960,282 L1028,332" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#aP)"/>
  <path d="M960,464 L1028,212" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#aIT)" stroke-dasharray="7 4"/>
  <path d="M960,479 L1028,278" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#aIMC)" stroke-dasharray="7 4"/>
  <path d="M960,494 L1028,344" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#aP)" stroke-dasharray="7 4"/>
  <text x="966" y="393" font-size="11" font-weight="bold" fill="#334155">實線＝中科</text>
  <text x="966" y="410" font-size="11" font-weight="bold" fill="#334155">虛線＝二林</text>

  <!-- after 說明 -->
  <rect x="608" y="528" width="604" height="106" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="624" y="552" font-size="13.5" font-weight="bold" fill="#065f46">改的只有 remoteWrite，vmagent 沒有變多</text>
  <text x="624" y="578" font-size="12.5" fill="#065f46">① 抓取還是只有一次。資料複製三份，每份各自過濾後帶不同 token 送出。</text>
  <text x="624" y="602" font-size="12.5" fill="#065f46">② 前提是 namespace 身上要有 dept label——由 ns-labeler 依對照表自動標，不是人工。</text>
  <text x="624" y="624" font-size="12.5" fill="#065f46">③ 三段過濾條件必須互斥，兜底那條用 drop。漏一個部門就會同時進兩個 tenant，而且不會報錯。</text>

  <text x="36" y="668" font-size="12.5" fill="#334155"><tspan font-weight="bold">給應用團隊的訊息：什麼都不用改。</tspan>　他們不知道 tenant、group、token 的存在，分流全部發生在平台層那一台 vmagent 上。</text>
  <text x="36" y="694" font-size="12.5" fill="#334155"><tspan font-weight="bold">給中央的訊息：tenant 設計不用動。</tspan>　我們只是從「一個 cluster 用一把 token」改成「一個 cluster 依組織用三把」，token 仍由中央發放。</text>
</svg>
