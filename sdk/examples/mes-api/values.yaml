# 應用團隊只需要填這一份。不需要知道 tenant、group、token。

app:
  name: mes-api        # 服務名稱，上線後不要改
  partOf: mes          # 所屬系統
  component: api       # api / web / worker / batch / gateway

image:
  repository: nexus.aillm.spil.com.tw/docker/mes/mes-api
  tag: "2.3.1"         # 版本號，不能用 latest

replicas: 2

ports:
  http: 8080
  metrics: 9464        # OpenTelemetry Prometheus exporter 的預設 port

probes:
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

# Java 服務：用 OpenTelemetry Java agent，程式不用改就會輸出標準 metrics，並把 trace_id 寫進 log
otel:
  javaAgent:
    enabled: true
    image: nexus.aillm.spil.com.tw/docker/open-telemetry/autoinstrumentation-java:2.10.0
  # .NET 服務改用這個（javaAgent 關掉）：掛 OpenTelemetry .NET 自動埋點，metrics 用 OTLP 推，見 docs/metrics/dotnet-how-to.md
  # dotnet:
  #   enabled: true
  #   image: nexus.aillm.spil.com.tw/ghcr/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.12.0
  #   arch: linux-x64          # Alpine（musl）的 image 用 linux-musl-x64
  # trace 取樣比例（0～1）。保持預設 1.0 全部送：平台在請求結束後才決定留不留（錯的、慢的全留，正常的留 5%）
  # traces:
  #   sampleRatio: 1.0
  # log 預設從 stdout 收（要照 sdk/standards/java/logback-spring.xml 印 JSON，trace_id 才會在 log 上）。
  # 舊專案 log 格式改不了、又要 log 對得到 trace：改成 otlp，agent 直接把 log（帶 trace_id）送給平台
  # logs:
  #   exporter: otlp

# log 格式。照 Java 標準（logback JSON）輸出就不用填；其他格式填名稱，例如 logfmt、secs。
# 沒有對應解析規則的格式，log 仍會完整收進去，只是不拆欄位。
# logFormat: logfmt

# 應用自己的環境變數
env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
