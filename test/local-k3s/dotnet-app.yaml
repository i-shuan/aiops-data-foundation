# 指標案例驗證用的真的 .NET 應用：程式在 dotnet-app/（建成 ConfigMap dotnet-app-src）。
# initContainer 用 .NET 8 SDK 編譯（測試用；正式環境 image 先建好）。
# app：ASP.NET Core 8。OpenTelemetry 在程式裡設定：metrics 開在 9464 的 /metrics，平台的 Collector 依標註來抓（跟 Java 一樣是 pull）；
#   trace 送同節點的 Collector。下面的環境變數就是 app-common chart 的 otel.dotnet 會產生的。
# db：PostgreSQL（Npgsql 連線池上限 5）。load：8 個迴圈一直打；/ctl/burst 存在時加到 40 個（執行緒池飢餓用）。
apiVersion: apps/v1
kind: Deployment
metadata: {name: dotnet-app, namespace: metrics-cases}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: dotnet-app}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dotnet-app, app.kubernetes.io/version: "1.0.0", app.kubernetes.io/part-of: demo}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9464", prometheus.io/path: /metrics}
    spec:
      initContainers:
        - name: build
          image: mcr.microsoft.com/dotnet/sdk:8.0
          command: ["sh", "-c", "cp -r /src /work && cd /work && dotnet publish -c Release -o /app --nologo -v q"]
          # 測試環境的對外 HTTPS 經過會重簽憑證的 proxy，NuGet 要信任它的 CA（ConfigMap proxy-ca，沒有就用系統的）
          env: [{name: SSL_CERT_FILE, value: /ca/ca-bundle.crt}]
          volumeMounts: [{name: src, mountPath: /src}, {name: app, mountPath: /app}, {name: ca, mountPath: /ca}]
          resources: {limits: {memory: 2Gi}}
      containers:
        - name: app
          image: mcr.microsoft.com/dotnet/aspnet:8.0
          command: ["dotnet", "/app/order-app.dll"]
          env:
            - {name: OTEL_SERVICE_NAME, value: dotnet-app}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.version=1.0.0,service.namespace=demo"}
            - {name: OTEL_PROPAGATORS, value: "tracecontext,baggage"}
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-node-collector.otel-collector.svc:4318/v1/traces"}
            - {name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL, value: http/protobuf}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: "1.0"}
            # ASP.NET Core 預設每個請求印 5 行 Information（實測），log 量會暴增；框架的只留 Warning 以上
            - {name: Logging__LogLevel__Microsoft.AspNetCore, value: Warning}
          ports: [{containerPort: 8080}, {name: metrics, containerPort: 9464}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: app, mountPath: /app}, {name: ctl, mountPath: /ctl}]
        - name: db
          image: docker.io/library/postgres:16-alpine
          env: [{name: POSTGRES_PASSWORD, value: test-only}]
          resources: {limits: {memory: 256Mi}}
        - name: load
          image: docker.io/curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              sleep 40
              loop() { while true; do curl -s -o /dev/null -m 10 "http://localhost:8080/orders/$(( $(od -An -N2 -tu2 /dev/urandom) % 1000 ))"; sleep 0.5; done; }
              for i in 1 2 3 4 5 6 7 8; do loop & done
              while true; do
                if [ -f /ctl/burst ] && [ ! -f /tmp/bursting ]; then touch /tmp/bursting; for i in $(seq 32); do loop & done; fi
                sleep 5
              done
          volumeMounts: [{name: ctl, mountPath: /ctl}]
      volumes:
        - {name: src, configMap: {name: dotnet-app-src}}
        - {name: app, emptyDir: {}}
        - {name: ctl, emptyDir: {}}
        - {name: ca, configMap: {name: proxy-ca, optional: true}}
