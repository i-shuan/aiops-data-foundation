# 三種情境各一個 namespace，驗證分流與欄位：
#   it-mes-prod  dept=D3120 → k8s-it-local，輸出 logback 格式 JSON（含 stack trace、trace_id、自訂欄位）
#   imc-wip-prod dept=D1110 → k8s-imc-local，輸出 ECS 巢狀格式（Spring Boot 3.4 的 logging.structured.format.console=ecs）
#   legacy       沒標 dept → k8s-unassigned-local，輸出純文字
# 另外兩個服務測「依格式分派」（都在 it-mes-prod）：
#   hold-svc     宣告 log-format: logfmt → 走 k8s-logs-format-logfmt
#   eap          宣告 log-format: secs，但中央還沒有 secs 的規則 → 退回 default，原文完整保留
# 純文字 log 保底抓 level（在 legacy）：
#   text-app     輪流輸出幾種純文字，有的帶 ERROR/WARNING/INFO，有的是不該被當成 level 的寫法
apiVersion: v1
kind: Namespace
metadata:
  name: it-mes-prod
  labels: {dept: D3120}
---
apiVersion: v1
kind: Namespace
metadata:
  name: imc-wip-prod
  labels: {dept: D1110}
---
apiVersion: v1
kind: Namespace
metadata:
  name: legacy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gen
  namespace: it-mes-prod
data:
  gen.sh: |
    i=0
    while true; do
      i=$((i+1))
      ts=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
      echo "{\"timestamp\":\"$ts\",\"level\":\"INFO\",\"message\":\"order $i accepted\",\"logger\":\"com.spil.mes.OrderService\",\"thread\":\"http-nio-8080-exec-1\",\"trace_id\":\"4bf92f3577b34da6a3ce929d0e0e4736\",\"span_id\":\"00f067aa0ba902b7\",\"lot_id\":\"L$i\",\"@version\":\"1\",\"level_value\":20000}"
      if [ $((i % 5)) -eq 0 ]; then
        echo "{\"timestamp\":\"$ts\",\"level\":\"ERROR\",\"message\":\"order $i failed\",\"logger\":\"com.spil.mes.OrderService\",\"thread\":\"http-nio-8080-exec-2\",\"stack_trace\":\"java.lang.IllegalStateException: lot not found\\n\\tat com.spil.mes.OrderService.run(OrderService.java:42)\",\"trace_id\":\"5bf92f3577b34da6a3ce929d0e0e4736\"}"
      fi
      sleep 2
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mes-api
  namespace: it-mes-prod
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mes-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mes-api
        app.kubernetes.io/version: "2.3.1"
        app.kubernetes.io/part-of: mes
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: mes-api
          image: docker.io/library/busybox:1.37
          command: ["sh", "/gen/gen.sh"]
          volumeMounts: [{name: gen, mountPath: /gen}]
      volumes: [{name: gen, configMap: {name: gen}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wip-worker
  namespace: imc-wip-prod
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: wip-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wip-worker
        app.kubernetes.io/version: "1.0.4"
        app.kubernetes.io/part-of: wip
    spec:
      containers:
        - name: wip-worker
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              while true; do
                echo "{\"@timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",\"log\":{\"level\":\"WARN\",\"logger\":\"wip.Queue\"},\"process\":{\"pid\":1,\"thread\":{\"name\":\"main\"}},\"message\":\"queue depth high\",\"ecs\":{\"version\":\"8.11\"}}"
                sleep 3
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: legacy
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy}
  template:
    metadata:
      labels: {app: legacy}
    spec:
      containers:
        - name: legacy
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c", "while true; do echo \"plain text $(date)\"; sleep 3; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hold-svc
  namespace: it-mes-prod
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hold-svc}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hold-svc
        app.kubernetes.io/version: "0.9.0"
        log-format: logfmt
    spec:
      containers:
        - name: hold-svc
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                echo "ts=$(date -u +%Y-%m-%dT%H:%M:%S.000Z) level=warn msg=\"lot hold requested\" lot_id=L$i caller=hold.go:42"
                sleep 3
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eap
  namespace: it-mes-prod
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: eap}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eap
        app.kubernetes.io/version: "3.1.0"
        log-format: secs
    spec:
      containers:
        - name: eap
          image: docker.io/library/busybox:1.37
          # 只是「宣告了但還沒有規則」的測資，不是真實的 SECS 格式
          command: ["sh", "-c", "while true; do echo \"$(date -u '+%Y-%m-%d %H:%M:%S') [EQP01] RECV S6F11 W SystemBytes=1234\"; sleep 3; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-app
  namespace: legacy
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: text-app}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: text-app
    spec:
      containers:
        - name: text-app
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - |
              while true; do
                t=$(date -u '+%Y-%m-%d %H:%M:%S')
                echo "$t ERROR [main] c.s.LotService - lot not found"
                echo "$t [WARNING] disk usage 91%"
                echo "INFO: service started on port 8080"
                echo "db connection ok, no error found"
                echo "processing batch ERROR_CODE=5 retry=1"
                sleep 3
              done
