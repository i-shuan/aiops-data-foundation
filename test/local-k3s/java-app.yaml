# 指標案例驗證（run-metrics-cases-e2e.sh）用的真的 Java 應用：程式在 java-app/OrderApp.java（建成 ConfigMap order-app）。
# 掛 OpenTelemetry Java agent、用 Prometheus 格式開 metrics（跟 app-common chart 一樣），旁邊一個 curl 每秒打約 10 次。
# initContainer 從 GitHub、Maven Central 下載 agent 與 HikariCP、H2（測試用；正式環境 agent 由 chart 的 image 帶）。
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-app, namespace: metrics-cases}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: order-app}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: order-app, app.kubernetes.io/version: "1.0.0", app.kubernetes.io/part-of: demo}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9464", prometheus.io/path: /metrics}
    spec:
      initContainers:
        - name: download
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cd /lib-ext
              M=https://repo1.maven.org/maven2
              [ -s otel.jar ] || wget -q -O otel.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.20.0/opentelemetry-javaagent.jar
              [ -s hikari.jar ] || wget -q -O hikari.jar $M/com/zaxxer/HikariCP/5.1.0/HikariCP-5.1.0.jar
              [ -s h2.jar ] || wget -q -O h2.jar $M/com/h2database/h2/2.2.224/h2-2.2.224.jar
              [ -s slf4j.jar ] || wget -q -O slf4j.jar $M/org/slf4j/slf4j-api/2.0.13/slf4j-api-2.0.13.jar
              ls -la
          volumeMounts: [{name: lib, mountPath: /lib-ext}]
      containers:
        - name: app
          image: docker.io/library/eclipse-temurin:21-jdk
          # ExitOnOutOfMemoryError：OOM 時直接結束讓 K8s 重開；不加的話 JVM 會變成「Pod 還在、什麼都做不了」（實測）
          command: ["java", "-javaagent:/lib-ext/otel.jar", "-Xmx128m", "-XX:+ExitOnOutOfMemoryError", "-cp", "/lib-ext/hikari.jar:/lib-ext/h2.jar:/lib-ext/slf4j.jar", "/app/OrderApp.java"]
          env:
            - {name: OTEL_SERVICE_NAME, value: order-app}
            - {name: OTEL_METRICS_EXPORTER, value: prometheus}
            - {name: OTEL_EXPORTER_PROMETHEUS_HOST, value: 0.0.0.0}
            - {name: OTEL_EXPORTER_PROMETHEUS_PORT, value: "9464"}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-node-collector.otel-collector.svc:4318/v1/traces"}
            - {name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL, value: http/protobuf}
            - {name: OTEL_LOGS_EXPORTER, value: none}
          ports: [{containerPort: 8080}, {name: metrics, containerPort: 9464}]
          resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {memory: 768Mi}}
          volumeMounts: [{name: lib, mountPath: /lib-ext}, {name: src, mountPath: /app}]
        - name: load
          image: docker.io/curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 30; while true; do curl -s -o /dev/null -m 5 http://localhost:8080/orders; sleep 0.1; done"]
      volumes:
        - {name: lib, emptyDir: {}}
        - {name: src, configMap: {name: order-app}}
