# 本機測試用：沿用正式的 metrics 收集設定，只改連線目標與 image 來源。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/cluster-addons/otel-collector
configMapGenerator:
  - name: otel-collector-env
    behavior: replace
    literals:
      - CLUSTER_NAME=local
      - ES_ENDPOINT=http://elasticsearch.es-test.svc:9200
      - NTP_SERVER=pool.ntp.org:123   # 測試機要能連外；不能的話換成區網的 NTP（沒設這個 Collector 起不來）
images:
  - name: otel/opentelemetry-collector-contrib
    newName: docker.io/otel/opentelemetry-collector-contrib
# trace-sampler（尾端取樣）：測試環境預設全部留（random 100%）、等 5 秒，其他 e2e 的 trace 數量、時間跟以前一樣。
# 尾端取樣本身的實測（tail-sampling/run-tail-sampling.sh）每一輪自己設 RANDOM_PCT、DECISION_WAIT。
patches:
  - target: {kind: StatefulSet, name: trace-sampler}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: 5s
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "100"
