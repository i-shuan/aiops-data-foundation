# 只給本機測試用的單節點 Elasticsearch。正式環境用中央那套，不要拿這份去部署。
# 開了 security（API key 要靠它），但 HTTP 不走 TLS，省掉憑證。
apiVersion: v1
kind: Namespace
metadata:
  name: es-test
---
apiVersion: v1
kind: Secret
metadata:
  name: es-elastic
  namespace: es-test
stringData:
  password: changeme-test-only
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: es-test
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: {app: elasticsearch}
  template:
    metadata:
      labels: {app: elasticsearch}
    spec:
      containers:
        - name: elasticsearch
          image: docker.io/library/elasticsearch:9.5.5
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "true"}
            - {name: xpack.security.http.ssl.enabled, value: "false"}
            - {name: xpack.security.transport.ssl.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g"}
            # 測試機常和別人共用磁碟，使用率超過 90% 時 ES 會拒絕配置 shard，測試時不檢查
            - {name: cluster.routing.allocation.disk.threshold_enabled, value: "false"}
            - name: ELASTIC_PASSWORD
              valueFrom: {secretKeyRef: {name: es-elastic, key: password}}
          ports:
            - {name: http, containerPort: 9200}
          # 健康檢查要用 API key 打 GET /：ES 剛起來的 1 秒多，/_cluster/health（elastic 帳號）已經 200、API key 卻 401，
          # Collector 收到 401 會直接丟資料（docs/pdca/2026-10-es-startup-401.md）。
          # 第一次啟動還沒有 key（run-e2e.sh 跑完 elasticsearch-setup.sh 才建 Secret es-probe-key），先退回 /_cluster/health
          readinessProbe:
            exec:
              command: ["sh", "-c", "if [ -s /probe/PROBE_ES_API_KEY ]; then curl -sf -H \"Authorization: ApiKey $(cat /probe/PROBE_ES_API_KEY)\" localhost:9200/ >/dev/null; else curl -sf -u elastic:$ELASTIC_PASSWORD localhost:9200/_cluster/health >/dev/null; fi"]
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
            - {name: probe-key, mountPath: /probe, readOnly: true}
      volumes:
        - name: probe-key
          secret: {secretName: es-probe-key, optional: true}   # setup 之後才有；Secret 建好後約 1 分鐘內會出現在 /probe
      securityContext:
        fsGroup: 1000
      initContainers:
        # local-path 建出來的目錄是 root 的，ES 以 uid 1000 執行
        - name: chown
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - {name: data, mountPath: /data}
  # 掛硬碟：停機測試要 ES 重啟後資料還在
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: es-test
spec:
  selector: {app: elasticsearch}
  ports:
    - {name: http, port: 9200}
