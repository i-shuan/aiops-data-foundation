            - {name: KAFKA, value: "kafka.kafka-cases.svc:9092"}
            # OpenTelemetry .NET 自動埋點（不改程式），跟 app-common chart 的 otel.dotnet 一樣
            - {name: CORECLR_ENABLE_PROFILING, value: "1"}
            - {name: CORECLR_PROFILER, value: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"}
            - {name: CORECLR_PROFILER_PATH, value: /otel/linux-x64/OpenTelemetry.AutoInstrumentation.Native.so}
            - {name: DOTNET_ADDITIONAL_DEPS, value: /otel/AdditionalDeps}
