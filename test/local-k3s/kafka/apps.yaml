            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: Logging__LogLevel__Microsoft.AspNetCore, value: Warning}
            - {name: Logging__Console__FormatterName, value: json}
            - {name: Logging__Console__FormatterOptions__IncludeScopes, value: "true"}
            - {name: Logging__Console__FormatterOptions__UseUtcTimestamp, value: "true"}
            - {name: Logging__Console__FormatterOptions__TimestampFormat, value: "yyyy-MM-ddTHH:mm:ss.fffZ"}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: app, mountPath: /app}, {name: otel, mountPath: /otel}, {name: ctl, mountPath: /ctl}]
        - name: db
          image: docker.io/library/postgres:16-alpine
          env: [{name: POSTGRES_PASSWORD, value: test-only}]
          resources: {limits: {memory: 256Mi}}
      volumes:
        - {name: src, configMap: {name: kafka-app-src}}
        - {name: app, emptyDir: {}}
        - {name: otel, emptyDir: {}}
        - {name: ctl, emptyDir: {}}
        - {name: ca, configMap: {name: proxy-ca, optional: true}}
