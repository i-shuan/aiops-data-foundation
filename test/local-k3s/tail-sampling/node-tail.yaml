# 第一層（node Collector）的改動：trace 補好 K8s、部門欄位後，不直接寫 ES，改成依 trace_id 送到 trace-sampler。
# 同一個 trace 的每一段（不同服務、不同節點送來的）都會到同一台 trace-sampler，它才看得到整個 trace。
# 測試用：疊在正式的 common.yaml、node.yaml 後面（後面的設定蓋掉前面的），三個 group 的 trace 出口都換成這個。
exporters:
  loadbalancing/traces:
    routing_key: traceID
    protocol:
      otlp:
        tls: {insecure: true}
        timeout: 10s
    resolver:
      dns:
        hostname: trace-sampler-headless.otel-collector.svc.cluster.local   # headless Service：解析出每一台的 IP
        port: "4317"
        interval: 5s

service:
  pipelines:
    traces/it:
      receivers: [routing/traces]
      exporters: [loadbalancing/traces]
    traces/imc:
      receivers: [routing/traces]
      exporters: [loadbalancing/traces]
    traces/unassigned:
      receivers: [routing/traces]
      exporters: [loadbalancing/traces]
