# 第二層 trace-sampler：StatefulSet ＋ headless Service（node Collector 的 loadbalancing exporter 用 DNS 解析出每一台）。
# 參數用環境變數（run-tail-sampling.sh 每一輪用 kubectl set env 換）。
apiVersion: v1
kind: Service
metadata:
  name: trace-sampler-headless
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: trace-sampler}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trace-sampler
  labels: {app.kubernetes.io/name: trace-sampler}
spec:
  serviceName: trace-sampler-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: trace-sampler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: trace-sampler}
    spec:
      containers:
        - name: otelcol
          image: otelcol
          args:
            - --config=/conf/sampler-config.yaml
            # 每一段記下是哪一條規則讓它留下（tailsampling.policy），trace baseline 只用 random 那份
            - --feature-gates=processor.tailsamplingprocessor.recordpolicy
          envFrom:
            - configMapRef: {name: otel-collector-env}
          env:
            - {name: DECISION_WAIT, value: 10s}
            - {name: NUM_TRACES, value: "50000"}
            - {name: EXPECTED_TPS, value: "200"}
            - {name: RANDOM_PCT, value: "5"}
            - {name: SLOW_MS, value: "1000"}
            - {name: GOMEMLIMIT, value: 800MiB}
          ports:
            - {name: health, containerPort: 13133}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: metrics, containerPort: 8888}
          readinessProbe:
            httpGet: {path: /, port: health}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /conf}
            - {name: es-keys, mountPath: /etc/es-keys, readOnly: true}
      volumes:
        - name: config
          configMap: {name: trace-sampler-config}
        - name: es-keys
          secret: {secretName: es-writer-keys}
