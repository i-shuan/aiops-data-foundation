# 根因分析（aiops/rca）的測試應用：模擬兩個服務，資料走真正的路線（OTel Collector → ES）。
#
#   rca-mes-api（it-mes-prod）  每 0.5 秒處理一個請求「GET /lots/{id}」，呼叫 rca-wip-worker
#   rca-wip-worker（imc-wip-prod）收到後查 Oracle「SELECT LOT_HISTORY」（平常 30ms）
#
# 兩個服務都把自己的 span 送到 Collector、印一行帶 trace_id 的 JSON log，所以 log 和 trace 對得起來。
# trace_id 用網址參數傳給下游（模擬 traceparent header；busybox httpd 不會把任意 header 交給 CGI）。
# 時間用節點開機時間（/proc/stat btime）＋ /proc/uptime，兩個 Pod 在同一個節點上，時間一致、精確到 10ms。
#
# 共用的函式在 rca-lib.sh（run-rca-e2e.sh 在兩個 namespace 建成 ConfigMap rca-lib）。
#
# 製造事故（run-rca-e2e.sh 做）：在 rca-wip-worker 的 Pod 裡
#   echo 1.5 > /tmp/db_delay   查 Oracle 變 1.5 秒
#   touch /tmp/slow            印出 error log「Connection pool timeout … 10.0.1.5:5432 …」，約 1/4 的請求失敗
apiVersion: v1
kind: ConfigMap
metadata: {name: rca-mes-api, namespace: it-mes-prod}
data:
  run.sh: |
    . /rca/lib.sh
    i=0
    while :; do
      i=$((i + 1)); lot="L$((100000 + i))"
      tid=$(hex 16); root=$(hex 8); cli=$(hex 8)
      t0=$(now)
      if wget -q -O /dev/null -T 10 "http://rca-wip-worker.imc-wip-prod.svc/cgi-bin/wip?tid=${tid}&psid=${cli}&lot=${lot}" 2>/dev/null; then err=""; else err=1; fi
      t1=$(now)
      if [ -n "$err" ]; then log ERROR "lot ${lot} failed: wip-worker returned error" "$tid" "$root"
      else log INFO "lot ${lot} handled in $((t1 - t0))ms" "$tid" "$root"; fi
      send rca-mes-api "$(span "$tid" "$root" "" "GET /lots/{id}" 2 "$t0" $((t1 + 2)) "$(attr http.request.method GET),$(attr http.route /lots/{id})" "$err"),$(span "$tid" "$cli" "$root" "GET" 3 $((t0 + 1)) "$t1" "$(attr peer.service rca-wip-worker)" "$err")"
      sleep 0.5
    done
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rca-mes-api, namespace: it-mes-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rca-mes-api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rca-mes-api, app.kubernetes.io/version: "1.0.0", app.kubernetes.io/part-of: demo}
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37
          command: ["sh", "/script/run.sh"]
          resources: {requests: {cpu: 20m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts: [{name: script, mountPath: /script}, {name: lib, mountPath: /rca}]
      volumes:
        - {name: script, configMap: {name: rca-mes-api}}
        - {name: lib, configMap: {name: rca-lib}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: rca-wip-worker, namespace: imc-wip-prod}
data:
  wip: |
    #!/bin/sh
    . /rca/lib.sh
    eval "$(echo "$QUERY_STRING" | tr '&' '\n' | grep -E '^(tid|psid|lot)=[A-Za-z0-9]+$')"
    t0=$(now); sid=$(hex 8); db=$(hex 8)
    delay=$(cat /tmp/db_delay 2>/dev/null || echo 0.03)
    d0=$(now); sleep "$delay"; d1=$(now)
    fail=""
    if [ -f /tmp/slow ]; then
      [ $(( $(od -An -N1 -tu1 /dev/urandom) % 4 )) -eq 0 ] && fail=1
      log ERROR "Connection pool timeout waiting for connection to 10.0.1.5:5432 after $((d1 - d0))ms, lot ${lot}" "$tid" "$sid" > /proc/1/fd/1
    else
      log INFO "lot ${lot} found in LOT_HISTORY" "$tid" "$sid" > /proc/1/fd/1
    fi
    t1=$(now)
    send rca-wip-worker "$(span "$tid" "$sid" "$psid" "GET /wip" 2 "$t0" $((t1 + 1)) "$(attr http.request.method GET)" "$fail"),$(span "$tid" "$db" "$sid" "SELECT LOT_HISTORY" 3 "$d0" "$d1" "$(attr db.system oracle),$(attr server.address 10.0.1.5)" "$fail")"
    if [ -n "$fail" ]; then printf 'Status: 500 Internal Server Error\r\nContent-Type: text/plain\r\n\r\nerror\n'
    else printf 'Content-Type: text/plain\r\n\r\nok\n'; fi
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rca-wip-worker, namespace: imc-wip-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rca-wip-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rca-wip-worker, app.kubernetes.io/version: "1.0.0", app.kubernetes.io/part-of: demo}
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37
          command: ["httpd", "-f", "-p", "80", "-h", "/www"]
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 20m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts: [{name: cgi, mountPath: /www/cgi-bin}, {name: lib, mountPath: /rca}]
      volumes:
        - {name: cgi, configMap: {name: rca-wip-worker, defaultMode: 0755}}
        - {name: lib, configMap: {name: rca-lib}}
---
apiVersion: v1
kind: Service
metadata: {name: rca-wip-worker, namespace: imc-wip-prod}
spec:
  selector: {app.kubernetes.io/name: rca-wip-worker}
  ports: [{port: 80, targetPort: 80}]
