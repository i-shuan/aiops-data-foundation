# 本機測試用：沿用正式設定，只改連線目標與 image 來源。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/cluster-addons/fluent-bit
configMapGenerator:
  - name: fluent-bit-env
    behavior: replace
    literals:
      - CLUSTER_NAME=local
      - ES_HOST=elasticsearch.es-test.svc
      - ES_PORT=9200
      - ES_TLS=off
      - ES_TLS_VERIFY=off
images:
  - name: cr.fluentbit.io/fluent/fluent-bit
    newName: docker.io/fluent/fluent-bit
